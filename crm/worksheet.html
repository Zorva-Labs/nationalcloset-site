<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Install Worksheet · National Closet Company CRM</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root{ --ink:#16140f; --soft:#3a362f; --mute:#6b665c; --line:#d8d6d0; --clay:#c0522f; --amber:#B45309; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',-apple-system,sans-serif;color:var(--ink);background:#edece8;padding:24px 16px 60px;line-height:1.45}
  .sheet{max-width:820px;margin:0 auto;background:#fff;padding:34px 38px 44px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:8px;border:0;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;display:inline-block}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .tgl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--soft);background:#fff;border:1.5px solid var(--line);padding:8px 12px;border-radius:8px;cursor:pointer}
  .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:20px}
  .hd h1{font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
  .hd .sub{font-size:13px;color:var(--mute);font-weight:600;margin-top:3px}
  .hd .po{text-align:right;font-size:12px;color:var(--mute);font-weight:700;line-height:1.5;white-space:nowrap}
  .hd .po b{display:block;font-size:20px;color:var(--ink);letter-spacing:.01em}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;margin-bottom:20px}
  .fld{border-bottom:1px solid var(--line);padding-bottom:7px}
  .fld .k{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
  .fld .v{font-size:15px;font-weight:700;margin-top:2px}
  .fld .v.big{font-size:19px}
  h2{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--clay);margin:22px 0 9px;padding-bottom:5px;border-bottom:2px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);padding:5px 6px;border-bottom:1px solid var(--line)}
  td{padding:7px 6px;border-bottom:1px solid #eee;vertical-align:top}
  td.q{width:52px;font-weight:800;text-align:center}
  .chk{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700}
  .chk span{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:7px;padding:6px 11px}
  .box{border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
  .box.cust{border-left:4px solid var(--clay)}
  .int{border:1.5px solid #F3D9A9;background:#FFFBF2;border-left:4px solid var(--amber);border-radius:8px;padding:12px 14px}
  .int .warn{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
  .int li{list-style:none;font-size:13px;line-height:1.55;padding:7px 0;border-top:1px dashed #E7D3AE}
  .int li:first-of-type{border-top:0}
  .int .meta{font-size:10.5px;color:var(--mute);font-weight:600;margin-top:2px}
  .sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26px}
  .sign div{border-top:1.5px solid var(--ink);padding-top:6px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
  .foot{margin-top:22px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mute);display:flex;justify-content:space-between}
  .muted{color:var(--mute);font-style:italic;font-size:13px}
  @media print{
    body{background:#fff;padding:0}
    .bar{display:none !important}
    .sheet{box-shadow:none;max-width:none;padding:0 .3in}
    @page{size:letter portrait;margin:.45in}
    h2{break-after:avoid}
    tr,li,.int,.box{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="bar">
  <a class="btn ghost" id="back" href="#">← Back to job</a>
  <button class="btn" onclick="window.print()">🖨 Print worksheet</button>
  <label class="tgl"><input type="checkbox" id="inc-internal" checked onchange="toggleInternal()"/> Include internal notes</label>
  <span class="muted" id="warn"></span>
</div>
<div class="sheet" id="sheet">Loading…</div>

<script src="/crm/crm-app.js?v=ncc84"></script>
<script>
const pid = parseInt(new URLSearchParams(location.search).get("id"), 10);
const e = (s) => SSCrm.esc(s == null ? "" : String(s));
let DATA = null;

function toggleInternal() {
  const on = document.getElementById("inc-internal").checked;
  document.querySelectorAll(".int-block").forEach((el) => { el.style.display = on ? "" : "none"; });
  document.getElementById("warn").textContent = on ? "Internal notes are on this printout — don't leave it with the customer." : "";
}

(async () => {
  if (!pid) { document.getElementById("sheet").textContent = "Missing job id."; return; }
  document.getElementById("back").href = `/crm/project.html?id=${pid}`;
  // fetchJSON bounces to login on 401, so this doubles as the auth gate
  const s = await SSCrm.fetchJSON(`/api/projects/${pid}`);
  DATA = s;

  // Line items come from the accepted proposal's selected tier.
  let lines = [], tierTitle = "";
  const acc = (s.proposals || []).find((p) => p.status === "accepted") || (s.proposals || [])[0];
  if (acc) {
    try {
      const pr = await SSCrm.fetchJSON(`/api/proposals/${acc.id}`);
      const tier = (pr.tiers || []).find((t) => t.tier === (pr.proposal.selected_tier || "good")) || (pr.tiers || [])[0];
      if (tier) { lines = (tier.lines || []).filter((l) => (l.line_total_cents || 0) >= 0); tierTitle = tier.title || ""; }
    } catch (_) {}
  }
  const k = (s.contracts || []).find((c) => c.status === "fully_executed") || (s.contracts || [])[0];
  const TYPE = { custom_order:"Walls as-is — no wall repair", wallprep:"INCLUDES wall repair &amp; paint",
                 install_only:"Install only — customer-supplied", repair:"Repair / service visit" };
  render(s, lines, tierTitle, k, TYPE);
  toggleInternal();
})();

function render(s, lines, tierTitle, k, TYPE) {
  const p = s.project, notes = s.notes || [];
  const mat = [["Ordered", p.materials_ordered_at], ["Received", p.materials_received_at],
               ["Missing parts", p.materials_missing_at], ["Damaged", p.materials_damaged_at]];
  document.getElementById("sheet").innerHTML = `
    <div class="hd">
      <div>
        <h1>Install Worksheet</h1>
        <div class="sub">${e(p.name || "Custom closet project")}${tierTitle ? " · " + e(tierTitle) : ""}</div>
      </div>
      <div class="po">PO NUMBER<b>${e(p.po_number || "—")}</b>
        <span>${p.install_date ? "Install " + SSCrm.fmtDay(p.install_date) : "Install date TBD"}</span></div>
    </div>

    <div class="grid">
      <div class="fld"><div class="k">Customer</div><div class="v big">${e(p.contact_name)}</div></div>
      <div class="fld"><div class="k">Phone</div><div class="v big">${e(p.contact_phone || "—")}</div></div>
      <div class="fld" style="grid-column:1/-1"><div class="k">Site address</div>
        <div class="v">${e(p.site_address || "—")}</div></div>
      <div class="fld"><div class="k">Job status</div><div class="v">${e(p.status || "—")}</div></div>
      <div class="fld"><div class="k">Scope of contract</div>
        <div class="v">${k ? (TYPE[k.contract_type] || e(k.contract_type)) : "—"}</div></div>
    </div>

    <h2>Materials</h2>
    <div class="chk">${mat.map(([lbl, at]) =>
      `<span>${at ? "☑" : "☐"} ${lbl}${at ? ` <em style="font-weight:600;color:var(--mute);font-style:normal">${SSCrm.fmtDay(at)}</em>` : ""}</span>`).join("")}</div>

    <h2>Scope of work</h2>
    ${lines.length ? `<table>
      <thead><tr><th class="q">Qty</th><th>Item</th><th style="width:130px">Room</th><th style="width:74px">Done</th></tr></thead>
      <tbody>${lines.map((l) => `<tr>
        <td class="q">${l.quantity || 1}</td>
        <td><strong>${e(l.description)}</strong></td>
        <td>${e(l.room || "")}</td>
        <td style="text-align:center;font-size:16px">☐</td></tr>`).join("")}</tbody></table>`
      : `<p class="muted">No line items on the accepted proposal.</p>`}

    ${s.job_notes ? `<h2>Promised to the customer</h2><div class="box cust">${e(s.job_notes)}</div>` : ""}

    ${notes.length ? `<div class="int-block"><h2 style="color:var(--amber)">Internal notes</h2>
      <div class="int"><div class="warn">⚠ Staff only — do not leave this page with the customer</div>
        <ul>${notes.map((n) => `<li>${e(n.body)}<div class="meta">${e(n.author || "—")} · ${SSCrm.fmtDateTime(n.created_at)}</div></li>`).join("")}</ul>
      </div></div>` : ""}

    <h2>Notes from the install</h2>
    <div class="box" style="min-height:96px">&nbsp;</div>

    <div class="sign">
      <div>Installer signature / date</div>
      <div>Customer sign-off / date</div>
    </div>
    <div class="foot"><span>National Closet Company · 629-298-8241</span>
      <span>Job #${p.id}${p.po_number ? " · " + e(p.po_number) : ""} · printed ${new Date().toLocaleDateString()}</span></div>`;
}
</script>
</body>
</html>
