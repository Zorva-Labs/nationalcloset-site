<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay your invoice · National Closet Company</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/img/ncc-logo-nc.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    :root{
      --white:#FFFFFF; --paper:#FAF9F6; --fog:#EDECE8; --ink:#16140F; --ink-soft:#3A362F; --muted:#6B6457;
      --clay:#D2683F; --clay-deep:#B9542F; --clay-wash:#F6E6DF; --line:#E4E1DA;
      --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
    .wrap{max-width:480px;margin:0 auto;padding:32px 20px 64px}
    .masthead{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:24px}
    .masthead img{height:42px;width:auto}
    .masthead .co{font-weight:800;font-size:18px;letter-spacing:.01em}
    .card{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(22,20,15,.06);overflow:hidden}
    .card__top{padding:24px 24px 0}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--clay-deep)}
    h1{font-size:22px;font-weight:800;margin:6px 0 2px}
    .sub{color:var(--muted);font-size:14px;margin:0}
    .amount{font-size:40px;font-weight:900;letter-spacing:-.02em;margin:18px 0 2px}
    .amount small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
    .desc{color:var(--ink-soft);font-size:14px;margin:0 0 4px}
    .divider{height:1px;background:var(--line);margin:22px 0 0}
    .pay{padding:22px 24px 26px}
    #payment-element{margin-bottom:18px}
    .btn{width:100%;border:0;border-radius:12px;background:var(--clay);color:#fff;font-family:var(--font);font-weight:800;font-size:17px;padding:15px;cursor:pointer;transition:background .15s, transform .05s}
    .btn:hover{background:var(--clay-deep)}
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:.6;cursor:default}
    .msg{font-size:13px;margin:12px 2px 0;color:var(--clay-deep);min-height:18px;text-align:center}
    .secure{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12px;margin-top:16px}
    .state{padding:40px 28px;text-align:center}
    .state .ic{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;background:#ECFDF5;color:#10B981}
    .state.void .ic{background:#F1F5F9;color:#64748B}
    .state h2{font-size:20px;font-weight:800;margin:0 0 6px}
    .state p{color:var(--muted);font-size:14px;margin:0}
    .spin{width:34px;height:34px;border:3px solid var(--fog);border-top-color:var(--clay);border-radius:50%;animation:s .8s linear infinite;margin:40px auto}
    @keyframes s{to{transform:rotate(360deg)}}
    .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
    .foot a{color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="masthead">
      <img src="/img/ncc-logo-nc.png" alt="National Closet Company" />
      <span class="co">National Closet Company</span>
    </div>
    <div id="root"><div class="spin"></div></div>
    <div class="foot">Questions? <a href="mailto:hello@nationalclosetco.com">hello@nationalclosetco.com</a> · <a href="tel:+16292988241">629-298-8241</a></div>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get("t");
    const root = document.getElementById("root");
    const money = (c) => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    let stripe, elements;

    function checkmark() { return `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`; }

    function paidState(inv) {
      root.innerHTML = `<div class="card"><div class="state">
        <div class="ic">${checkmark()}</div>
        <h2>Payment received</h2>
        <p>Thank you! Invoice <strong>${esc(inv.number)}</strong> for <strong>${money(inv.amount_cents)}</strong> is paid.</p>
      </div></div>`;
    }
    function voidState(inv) {
      root.innerHTML = `<div class="card"><div class="state void">
        <div class="ic">—</div>
        <h2>Invoice canceled</h2>
        <p>This invoice (${esc(inv.number)}) is no longer payable. Reach out if you have questions.</p>
      </div></div>`;
    }
    function errorState(msg) {
      root.innerHTML = `<div class="card"><div class="state void"><div class="ic">!</div><h2>Something went wrong</h2><p>${esc(msg)}</p></div></div>`;
    }

    async function init() {
      if (!token) return errorState("Missing invoice link.");
      let data;
      try {
        const res = await fetch(`/api/public/invoice/${encodeURIComponent(token)}`);
        data = await res.json();
        if (!res.ok && !data.invoice) return errorState(data.error || "Invoice not found.");
      } catch (e) { return errorState("Could not load this invoice."); }

      if (data.paid) return paidState(data.invoice);
      if (data.voided) return voidState(data.invoice);

      const inv = data.invoice;
      const typeLabel = { deposit: "Deposit", balance: "Final balance", full: "Payment", custom: "Invoice" }[inv.type] || "Invoice";
      root.innerHTML = `
        <div class="card">
          <div class="card__top">
            <div class="eyebrow">${esc(typeLabel)} · Invoice ${esc(inv.number)}</div>
            <h1>${esc(inv.project_name || "Custom closet project")}</h1>
            <p class="sub">${esc(inv.contact_name ? "For " + inv.contact_name : "")}</p>
            <div class="amount">${money(inv.amount_cents)} <small>due</small></div>
            <p class="desc">${esc(inv.description || "")}</p>
            <div class="divider"></div>
          </div>
          <div class="pay">
            <form id="pay-form">
              <div id="payment-element"></div>
              <button class="btn" id="pay-btn" type="submit">Pay ${money(inv.amount_cents)}</button>
              <div class="msg" id="msg"></div>
            </form>
            <div class="secure">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Secured by Stripe
            </div>
          </div>
        </div>`;

      stripe = Stripe(data.publishable_key);
      const appearance = {
        theme: "stripe",
        variables: { colorPrimary: "#D2683F", fontFamily: "Montserrat, system-ui, sans-serif", borderRadius: "10px", colorText: "#16140F" },
      };
      elements = stripe.elements({ clientSecret: data.client_secret, appearance });
      const paymentElement = elements.create("payment");
      paymentElement.mount("#payment-element");

      document.getElementById("pay-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("pay-btn");
        const msg = document.getElementById("msg");
        btn.disabled = true; btn.textContent = "Processing…"; msg.textContent = "";
        const { error, paymentIntent } = await stripe.confirmPayment({
          elements,
          confirmParams: { return_url: location.href },
          redirect: "if_required",
        });
        if (error) {
          msg.textContent = error.message || "Payment failed. Please try again.";
          btn.disabled = false; btn.textContent = `Pay ${money(inv.amount_cents)}`;
          return;
        }
        if (paymentIntent && (paymentIntent.status === "succeeded" || paymentIntent.status === "processing")) {
          paidState({ number: inv.number, amount_cents: inv.amount_cents });
        } else {
          msg.textContent = "Payment status: " + (paymentIntent ? paymentIntent.status : "unknown");
          btn.disabled = false; btn.textContent = `Pay ${money(inv.amount_cents)}`;
        }
      });
    }

    init();
  </script>
</body>
</html>
