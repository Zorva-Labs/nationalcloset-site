<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reports · National Closet Company CRM</title><meta name="robots" content="noindex, nofollow"/>
<link rel="stylesheet" href="/crm/crm-app.css?v=ncc17"/>
<style>
  .rpt-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .rpt-presets{display:inline-flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:4px}
  .rpt-preset{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);padding:7px 14px;border-radius:999px;cursor:pointer}
  .rpt-preset:hover{color:var(--ink)}
  .rpt-preset.is-active{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .rpt-dates{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
  .rpt-dates input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm,6px);background:var(--bg);color:var(--ink)}
  .rpt-scope{display:inline-flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:4px}
  .rpt-right{margin-left:auto;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
  .rpt-dl{display:inline-flex;gap:6px}
  .rpt-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .rpt-kpi{background:var(--bg);border:1px solid var(--line);border-radius:var(--r,10px);padding:16px 18px}
  .rpt-kpi .lbl{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
  .rpt-kpi .val{font-size:28px;font-weight:800;margin-top:6px;line-height:1.1}
  .rpt-kpi .sub{font-size:12px;color:var(--ink-soft);margin-top:4px}
  .rpt-kpi.accent .val{color:#15803D}
  .rpt-pnl{width:100%;border-collapse:collapse;font-size:14px}
  .rpt-pnl td{padding:9px 4px;border-bottom:1px solid var(--line)}
  .rpt-pnl td.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .rpt-pnl td.pct{text-align:right;white-space:nowrap;color:var(--ink-soft);font-size:12px;width:64px}
  .rpt-pnl tr.exp td:first-child{padding-left:18px;color:var(--ink-soft)}
  .rpt-pnl tr.sum td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
  .rpt-pnl tr.profit td{font-weight:800;font-size:16px}
  .rpt-pnl tr.profit td.amt{color:#15803D}
  .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .fnl-row{display:grid;grid-template-columns:150px 1fr 52px 46px;align-items:center;gap:12px;padding:7px 0}
  .fnl-row .lab{font-size:13px;font-weight:600}
  .fnl-bar{height:24px;background:var(--bg-soft);border-radius:5px;overflow:hidden}
  .fnl-bar>span{display:block;height:100%;background:linear-gradient(90deg,#E8915E,#C2522F);border-radius:5px;min-width:2px}
  .fnl-row .ct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .fnl-row .pc{text-align:right;color:var(--ink-soft);font-size:12px}
</style></head>
<body>
<script src="/crm/crm-app.js?v=ncc17"></script>
<script>
(async () => {
  const user = await SSCrm.mount({ title: "Reports", subtitle: "Profit & loss and lead performance", wide: true });
  if (!user) return;
  const page = document.getElementById("page");
  const M = SSCrm.fmtMoney;
  const e = SSCrm.esc;

  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  function presetRange(key) {
    const now = new Date();
    if (key === "month") return [iso(new Date(now.getFullYear(), now.getMonth(), 1)), iso(now)];
    if (key === "ytd")   return [iso(new Date(now.getFullYear(), 0, 1)), iso(now)];
    if (key === "30")    return [iso(new Date(now.getTime() - 29 * 864e5)), iso(now)];
    if (key === "12mo")  return [iso(new Date(now.getFullYear() - 1, now.getMonth(), now.getDate())), iso(now)];
    return ["2000-01-01", "2999-12-31"]; // all
  }

  let view = "pnl";        // "pnl" | "leads"
  let preset = "ytd";
  let [from, to] = presetRange(preset);
  let all = false;         // P&L scope toggle
  let data = null;         // P&L payload
  let ldata = null;        // Leads payload

  const STATUS_LABEL = { contracted: "Booked", scheduled_install: "Scheduled", installing: "Installing", completed: "Completed" };
  const pct = (part, whole) => whole ? Math.round((part / whole) * 100) + "%" : "—";
  const pct1 = (part, whole) => whole ? (Math.round((part / whole) * 1000) / 10) + "%" : "—";

  // Business letterhead for downloaded reports
  const BIZ = {
    name: "National Closet Company",
    loc: "Gallatin, Tennessee · Serving Middle Tennessee",
    phone: "(629) 298-8241",
    email: "hello@nationalclosetco.com",
    web: "NationalClosetCo.com",
    logo: location.origin + "/img/ncc-logo.png",
  };
  const fmtDay = (s) => { const d = new Date(s + "T00:00:00"); return isNaN(d) ? s : d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }); };
  const rangeLabel = () => (from <= "2000-01-01" && to >= "2999-12-31") ? "All time" : `${fmtDay(from)} – ${fmtDay(to)}`;

  const FUNNEL = [["new", "New leads"], ["contacted", "Contacted"], ["replied", "Replied"], ["consult", "Consult booked"], ["proposal", "Proposal stage"], ["booked", "Booked (won)"]];

  // ───────── shared filter bar ─────────
  function barHTML() {
    return `<div class="rpt-bar">
      <div class="rpt-presets">
        <button class="rpt-preset ${view === "pnl" ? "is-active" : ""}" data-view="pnl">Profit &amp; loss</button>
        <button class="rpt-preset ${view === "leads" ? "is-active" : ""}" data-view="leads">Leads</button>
      </div>
      <div class="rpt-presets">
        ${[["month", "This month"], ["ytd", "Year to date"], ["30", "Last 30"], ["12mo", "Last 12 mo"], ["all", "All time"]]
          .map(([k, lbl]) => `<button class="rpt-preset ${preset === k ? "is-active" : ""}" data-p="${k}">${lbl}</button>`).join("")}
      </div>
      <div class="rpt-dates"><input type="date" id="rpt-from" value="${from}"/><span>→</span><input type="date" id="rpt-to" value="${to === "2999-12-31" ? "" : to}"/></div>
      <div class="rpt-right">
        ${view === "pnl" ? `<div class="rpt-scope">
          <button class="rpt-preset ${!all ? "is-active" : ""}" data-scope="won">Won jobs</button>
          <button class="rpt-preset ${all ? "is-active" : ""}" data-scope="all">All projects</button>
        </div>` : ""}
        <div class="rpt-dl">
          <button class="btn secondary sm" id="rpt-pdf">⤓ Download PDF</button>
          <button class="btn ghost sm" id="rpt-csv">CSV</button>
        </div>
      </div>
    </div>`;
  }
  function wireBar() {
    page.querySelectorAll(".rpt-preset[data-view]").forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; load(); }));
    page.querySelectorAll(".rpt-preset[data-p]").forEach((b) => b.addEventListener("click", () => { preset = b.dataset.p; [from, to] = presetRange(preset); load(); }));
    page.querySelectorAll(".rpt-preset[data-scope]").forEach((b) => b.addEventListener("click", () => { all = b.dataset.scope === "all"; load(); }));
    const fEl = document.getElementById("rpt-from"), tEl = document.getElementById("rpt-to");
    const onDate = () => { from = fEl.value || "2000-01-01"; to = tEl.value || "2999-12-31"; preset = ""; load(); };
    fEl.addEventListener("change", onDate); tEl.addEventListener("change", onDate);
    document.getElementById("rpt-pdf").addEventListener("click", downloadPDF);
    document.getElementById("rpt-csv").addEventListener("click", downloadCSV);
  }

  function render() { view === "leads" ? renderLeads() : renderPnl(); wireBar(); }

  // ───────── P&L view ─────────
  function renderPnl() {
    const t = data ? data.totals : { revenue: 0, materials: 0, shipping: 0, tax: 0, labor: 0, misc: 0, expenses: 0, profit: 0 };
    const rev = t.revenue;
    const expRow = (label, cents) => `<tr class="exp"><td>${label}</td><td class="amt">${cents ? "(" + M(cents) + ")" : "—"}</td><td class="pct">${pct(cents, rev)}</td></tr>`;
    const jobsRows = (data && data.jobs.length) ? data.jobs.map((j) => `
      <tr>
        <td><a href="/crm/project.html?id=${j.id}">${e(j.name || "Job #" + j.id)}</a><div class="muted" style="font-size:12px">${e(j.contact_name || "")} · ${SSCrm.fmtDate(j.created_at)}</div></td>
        <td>${SSCrm.pill(STATUS_LABEL[j.status] || j.status, j.status)}</td>
        <td class="num">${M(j.price_cents)}</td><td class="num">${M(j.materials_cents)}</td><td class="num">${M(j.shipping_cents)}</td>
        <td class="num">${M(j.tax_cents)}</td><td class="num">${M(j.labor_cents)}</td><td class="num">${M(j.misc_cents)}</td>
        <td class="num" style="font-weight:700;color:#15803D">${M(j.profit_cents)}</td>
      </tr>`).join("")
      : `<tr><td colspan="9" class="empty" style="padding:24px">No jobs in this range.</td></tr>`;

    page.innerHTML = barHTML() + `
      <div class="rpt-cards">
        <div class="rpt-kpi"><div class="lbl">Gross income</div><div class="val">${M(rev)}</div><div class="sub">${data ? data.count : 0} job${(data && data.count === 1) ? "" : "s"}</div></div>
        <div class="rpt-kpi"><div class="lbl">Total expenses</div><div class="val">${M(t.expenses)}</div><div class="sub">${pct(t.expenses, rev)} of revenue</div></div>
        <div class="rpt-kpi accent"><div class="lbl">Net profit</div><div class="val">${M(t.profit)}</div><div class="sub">${pct(t.profit, rev)} margin</div></div>
        <div class="rpt-kpi"><div class="lbl">Avg / job</div><div class="val">${M(data && data.count ? Math.round(t.profit / data.count) : 0)}</div><div class="sub">profit per job</div></div>
      </div>
      <div class="lead-grid" style="grid-template-columns:minmax(280px,360px) 1fr;gap:20px;align-items:start">
        <div class="card">
          <div class="card-head"><h3>Profit &amp; loss</h3></div>
          <table class="rpt-pnl">
            <tr><td><strong>Gross income</strong></td><td class="amt"><strong>${M(rev)}</strong></td><td class="pct">100%</td></tr>
            ${expRow("Materials", t.materials)}${expRow("Shipping", t.shipping)}${expRow("Taxes", t.tax)}${expRow("Labor", t.labor)}${expRow("Misc", t.misc)}
            <tr class="sum"><td>Total expenses</td><td class="amt">(${M(t.expenses)})</td><td class="pct">${pct(t.expenses, rev)}</td></tr>
            <tr class="profit"><td>Net profit</td><td class="amt">${M(t.profit)}</td><td class="pct">${pct(t.profit, rev)}</td></tr>
          </table>
        </div>
        <div class="card">
          <div class="card-head"><h3>By job <span class="muted" style="font-weight:500">· ${data ? data.count : 0}</span></h3></div>
          <div class="tbl"><table>
            <thead><tr><th>Job</th><th>Status</th><th class="num">Price</th><th class="num">Materials</th><th class="num">Ship</th><th class="num">Tax</th><th class="num">Labor</th><th class="num">Misc</th><th class="num">Profit</th></tr></thead>
            <tbody>${jobsRows}</tbody>
          </table></div>
        </div>
      </div>
      <p class="muted" style="font-size:12px;margin-top:14px">Revenue counts each job by its created date. Expenses use saved per-job overrides where set, otherwise the cost formula on the job's contract/proposal total.</p>`;
  }

  // ───────── Leads view ─────────
  function renderLeads() {
    const d = ldata || { total: 0, booked: 0, lost: 0, conversion: 0, funnel: {}, sources: [], proposals_sent: 0, proposals_accepted: 0, quoted_total_cents: 0 };
    const total = d.total;
    const fnlRows = FUNNEL.map(([k, lbl]) => {
      const n = d.funnel[k] || 0;
      const w = total ? Math.round((n / total) * 100) : 0;
      return `<div class="fnl-row"><div class="lab">${lbl}</div><div class="fnl-bar"><span style="width:${w}%"></span></div><div class="ct">${n}</div><div class="pc">${pct(n, total)}</div></div>`;
    }).join("");
    const srcRows = (d.sources.length ? d.sources : []).map((s) => `<tr><td>${e(s.source)}</td><td class="num">${s.n}</td><td class="num muted">${pct(s.n, total)}</td></tr>`).join("")
      || `<tr><td colspan="3" class="empty" style="padding:18px">No leads in this range.</td></tr>`;

    page.innerHTML = barHTML() + `
      <div class="rpt-cards">
        <div class="rpt-kpi"><div class="lbl">Total leads</div><div class="val">${total}</div><div class="sub">${d.lost} lost · ${pct(d.lost, total)}</div></div>
        <div class="rpt-kpi accent"><div class="lbl">Conversion rate</div><div class="val">${pct1(d.booked, total)}</div><div class="sub">${d.booked} booked of ${total}</div></div>
        <div class="rpt-kpi"><div class="lbl">Proposals sent</div><div class="val">${d.proposals_sent}</div><div class="sub">${d.proposals_accepted} accepted · ${pct(d.proposals_accepted, d.proposals_sent)}</div></div>
        <div class="rpt-kpi"><div class="lbl">Quoted value</div><div class="val">${M(d.quoted_total_cents)}</div><div class="sub">across ${d.quoted_count || 0} quote${d.quoted_count === 1 ? "" : "s"}</div></div>
      </div>
      <div class="lead-grid" style="grid-template-columns:1fr minmax(260px,340px);gap:20px;align-items:start">
        <div class="card">
          <div class="card-head"><h3>Lead funnel</h3></div>
          ${total ? fnlRows : `<div class="empty" style="padding:24px">No leads in this range.</div>`}
          <p class="muted" style="font-size:12px;margin-top:12px">Each stage counts leads that reached at least that point (current status). Conversion = booked ÷ total leads.</p>
        </div>
        <div class="card">
          <div class="card-head"><h3>Lead sources</h3></div>
          <div class="tbl"><table>
            <thead><tr><th>Source</th><th class="num">Leads</th><th class="num">Share</th></tr></thead>
            <tbody>${srcRows}</tbody>
          </table></div>
        </div>
      </div>`;
  }

  // ───────── Branded downloads ─────────
  function letterhead() {
    return `<div class="head">
      <img src="${BIZ.logo}" alt=""/>
      <div><div class="nm">${e(BIZ.name)}</div><div class="meta">${e(BIZ.loc)}</div></div>
      <div class="right">${e(BIZ.phone)}<br/>${e(BIZ.email)}<br/>${e(BIZ.web)}</div>
    </div>`;
  }
  const PRINT_CSS = `
    @page { size: letter; margin: 0.6in; }
    * { box-sizing: border-box; }
    body { font: 13px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #1a1a1a; margin: 0; }
    .head { display: flex; align-items: center; gap: 16px; border-bottom: 3px solid #C2522F; padding-bottom: 14px; margin-bottom: 22px; }
    .head img { height: 58px; width: auto; }
    .head .nm { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
    .head .meta { color: #555; font-size: 12px; margin-top: 2px; }
    .head .right { margin-left: auto; text-align: right; color: #555; font-size: 12px; }
    h1 { font-size: 17px; margin: 0 0 2px; }
    .range { color: #555; font-size: 12px; margin-bottom: 18px; }
    .kpis { display: flex; gap: 12px; margin-bottom: 22px; }
    .kpi { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; }
    .kpi .l { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #777; font-weight: 700; }
    .kpi .v { font-size: 20px; font-weight: 800; margin-top: 3px; }
    .kpi.green .v { color: #15803D; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: #C2522F; border-bottom: 1px solid #eee; padding-bottom: 5px; margin: 0 0 8px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 26px; }
    .pnl td { padding: 7px 4px; border-bottom: 1px solid #eee; }
    .pnl td.lab { padding-left: 16px; color: #555; }
    .pnl tr.tot td { font-weight: 800; border-top: 2px solid #1a1a1a; border-bottom: 0; padding-top: 8px; }
    .pnl tr.tot td:first-child { padding-left: 4px; }
    .amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .p { text-align: right; width: 60px; color: #888; font-size: 11px; }
    .data th { text-align: right; font-size: 10px; text-transform: uppercase; letter-spacing: .03em; color: #777; border-bottom: 2px solid #ddd; padding: 6px 4px; }
    .data th:first-child { text-align: left; }
    .data td { padding: 7px 4px; border-bottom: 1px solid #f0f0f0; }
    .data td.strong { font-weight: 700; color: #15803D; }
    .data .sub { color: #888; font-size: 11px; }
    .bar { height: 16px; background: #f0ede8; border-radius: 4px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: #C2522F; }
    tr { page-break-inside: avoid; }
    .foot { margin-top: 8px; padding-top: 10px; border-top: 1px solid #eee; color: #999; font-size: 11px; display: flex; justify-content: space-between; }`;
  const PRINT_JS = `<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},250);});<\/script>`;
  const generatedOn = () => new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

  function brandedPnlHTML() {
    const t = data.totals, rev = t.revenue;
    const expRow = (label, cents) => `<tr><td class="lab">${label}</td><td class="amt">${cents ? "(" + M(cents) + ")" : "—"}</td><td class="p">${pct(cents, rev)}</td></tr>`;
    const jobRows = data.jobs.length ? data.jobs.map((j) => `<tr>
        <td>${e(j.name || "Job #" + j.id)}<div class="sub">${e(j.contact_name || "")} · ${SSCrm.fmtDate(j.created_at)}</div></td>
        <td class="amt">${M(j.price_cents)}</td><td class="amt">${M(j.materials_cents)}</td><td class="amt">${M(j.shipping_cents)}</td>
        <td class="amt">${M(j.tax_cents)}</td><td class="amt">${M(j.labor_cents)}</td><td class="amt">${M(j.misc_cents)}</td>
        <td class="amt strong">${M(j.profit_cents)}</td></tr>`).join("")
      : `<tr><td colspan="8" style="text-align:center;color:#777;padding:20px">No jobs in this range.</td></tr>`;
    const scope = all ? "All projects" : "Won jobs (booked → completed)";
    return `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>P&amp;L — ${e(BIZ.name)} — ${e(rangeLabel())}</title><style>${PRINT_CSS}</style></head><body>
      ${letterhead()}
      <h1>Profit &amp; Loss Statement</h1>
      <div class="range">${e(rangeLabel())} · ${e(scope)} · ${data.count} job${data.count === 1 ? "" : "s"}</div>
      <div class="kpis">
        <div class="kpi"><div class="l">Gross income</div><div class="v">${M(rev)}</div></div>
        <div class="kpi"><div class="l">Total expenses</div><div class="v">${M(t.expenses)}</div></div>
        <div class="kpi green"><div class="l">Net profit</div><div class="v">${M(t.profit)}</div></div>
        <div class="kpi"><div class="l">Margin</div><div class="v">${pct(t.profit, rev)}</div></div>
      </div>
      <h2>Profit &amp; Loss</h2>
      <table class="pnl">
        <tr><td><strong>Gross income</strong></td><td class="amt"><strong>${M(rev)}</strong></td><td class="p">100%</td></tr>
        ${expRow("Materials", t.materials)}${expRow("Shipping", t.shipping)}${expRow("Taxes", t.tax)}${expRow("Labor", t.labor)}${expRow("Misc", t.misc)}
        <tr class="tot"><td>Total expenses</td><td class="amt">(${M(t.expenses)})</td><td class="p">${pct(t.expenses, rev)}</td></tr>
        <tr class="tot"><td>Net profit</td><td class="amt" style="color:#15803D">${M(t.profit)}</td><td class="p">${pct(t.profit, rev)}</td></tr>
      </table>
      <h2>By job</h2>
      <table class="data">
        <thead><tr><th>Job</th><th>Price</th><th>Materials</th><th>Ship</th><th>Tax</th><th>Labor</th><th>Misc</th><th>Profit</th></tr></thead>
        <tbody>${jobRows}</tbody>
      </table>
      <div class="foot"><span>Generated ${generatedOn()} · ${e(BIZ.name)}</span><span>Internal management report</span></div>
      ${PRINT_JS}</body></html>`;
  }

  function brandedLeadsHTML() {
    const d = ldata, total = d.total;
    const fnlRows = FUNNEL.map(([k, lbl]) => {
      const n = d.funnel[k] || 0, w = total ? Math.round((n / total) * 100) : 0;
      return `<tr><td>${lbl}</td><td style="width:46%"><div class="bar"><span style="width:${w}%"></span></div></td><td class="amt">${n}</td><td class="p">${pct(n, total)}</td></tr>`;
    }).join("");
    const srcRows = d.sources.length ? d.sources.map((s) => `<tr><td>${e(s.source)}</td><td class="amt">${s.n}</td><td class="p">${pct(s.n, total)}</td></tr>`).join("")
      : `<tr><td colspan="3" style="text-align:center;color:#777;padding:18px">No leads in this range.</td></tr>`;
    return `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Leads — ${e(BIZ.name)} — ${e(rangeLabel())}</title><style>${PRINT_CSS}</style></head><body>
      ${letterhead()}
      <h1>Lead Performance Report</h1>
      <div class="range">${e(rangeLabel())} · ${total} lead${total === 1 ? "" : "s"}</div>
      <div class="kpis">
        <div class="kpi"><div class="l">Total leads</div><div class="v">${total}</div></div>
        <div class="kpi green"><div class="l">Conversion</div><div class="v">${pct1(d.booked, total)}</div></div>
        <div class="kpi"><div class="l">Proposals sent</div><div class="v">${d.proposals_sent}</div></div>
        <div class="kpi"><div class="l">Quoted value</div><div class="v">${M(d.quoted_total_cents)}</div></div>
      </div>
      <h2>Lead funnel</h2>
      <table class="data"><thead><tr><th>Stage</th><th></th><th>Leads</th><th>%</th></tr></thead><tbody>${fnlRows}</tbody></table>
      <h2>Lead sources</h2>
      <table class="data"><thead><tr><th>Source</th><th>Leads</th><th>Share</th></tr></thead><tbody>${srcRows}</tbody></table>
      <div class="foot"><span>Generated ${generatedOn()} · ${e(BIZ.name)}</span><span>Booked ${d.booked} · Lost ${d.lost} · ${d.proposals_accepted} proposals accepted</span></div>
      ${PRINT_JS}</body></html>`;
  }

  function openPrint(html) {
    const w = window.open("", "_blank");
    if (!w) { SSCrm.toast("Allow pop-ups to download the report", "error"); return; }
    w.document.open(); w.document.write(html); w.document.close();
  }
  function downloadPDF() {
    if (view === "leads") { if (ldata) openPrint(brandedLeadsHTML()); }
    else if (data) openPrint(brandedPnlHTML());
  }

  function csvDownload(rows, name) {
    const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const csv = rows.map((r) => r.map(esc).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function downloadCSV() {
    const tag = `${from}_to_${to === "2999-12-31" ? "all" : to}`;
    if (view === "leads") {
      if (!ldata) return;
      const d = ldata, rows = [["NCC Lead Report", rangeLabel()], [], ["Metric", "Value"],
        ["Total leads", d.total], ["Booked (won)", d.booked], ["Lost", d.lost],
        ["Conversion rate", pct1(d.booked, d.total)], ["Proposals sent", d.proposals_sent], ["Proposals accepted", d.proposals_accepted],
        ["Quoted value", (d.quoted_total_cents / 100).toFixed(2)], [], ["Funnel stage", "Leads", "% of total"]];
      FUNNEL.forEach(([k, lbl]) => rows.push([lbl, d.funnel[k] || 0, pct(d.funnel[k] || 0, d.total)]));
      rows.push([], ["Source", "Leads", "% of total"]);
      d.sources.forEach((s) => rows.push([s.source, s.n, pct(s.n, d.total)]));
      csvDownload(rows, `NCC-Leads-${tag}.csv`);
    } else {
      if (!data) return;
      const t = data.totals, c = (x) => (x / 100).toFixed(2);
      const rows = [["Job", "Contact", "Status", "Created", "Price", "Materials", "Shipping", "Taxes", "Labor", "Misc", "Expenses", "Profit"]];
      data.jobs.forEach((j) => rows.push([j.name || "Job #" + j.id, j.contact_name || "", j.status, (j.created_at || "").slice(0, 10), c(j.price_cents), c(j.materials_cents), c(j.shipping_cents), c(j.tax_cents), c(j.labor_cents), c(j.misc_cents), c(j.expenses_cents), c(j.profit_cents)]));
      rows.push([], ["TOTALS", "", "", "", c(t.revenue), c(t.materials), c(t.shipping), c(t.tax), c(t.labor), c(t.misc), c(t.expenses), c(t.profit)]);
      csvDownload(rows, `NCC-PnL-${tag}.csv`);
    }
  }

  async function load() {
    page.innerHTML = barHTML() + `<div class="muted" style="padding:24px">Loading…</div>`;
    wireBar();
    try {
      if (view === "leads") ldata = await SSCrm.fetchJSON(`/api/reports/leads?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
      else data = await SSCrm.fetchJSON(`/api/reports?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&all=${all ? 1 : 0}`);
    } catch (err) {
      page.innerHTML = barHTML() + `<div class="tbl"><div class="empty">Couldn't load: ${e(err.message)}</div></div>`;
      wireBar();
      return;
    }
    render();
  }

  load();
})();
</script></body></html>
