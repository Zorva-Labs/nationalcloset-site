name = "nationalcloset"
compatibility_date = "2026-05-24"
pages_build_output_dir = "."

# Non-secret env vars MUST live here: with a wrangler.toml present, each
# `wrangler pages deploy` treats [vars] as authoritative and clears any
# plain-text vars set in the dashboard/API. (Secrets are managed separately
# and are NOT affected — RESEND_API_KEY, PURELYMAIL_PASSWORD, CRON_SECRET,
# CALENDAR_FEED_TOKEN stay as encrypted secrets.)
[vars]
PURELYMAIL_USER = "hello@nationalclosetco.com"
IMAP_HOST = "imap.purelymail.com"
IMAP_PORT = "993"
MAIL_FROM = "National Closet Company <hello@nationalclosetco.com>"
MAIL_DEFAULT_REPLY = "hello@nationalclosetco.com"
STAFF_EMAIL = "hello@nationalclosetco.com"
# Stripe publishable key is public (safe in client/source). Secret key +
# webhook signing secret are encrypted Pages secrets (STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET) — NOT here.
STRIPE_PUBLISHABLE_KEY = "pk_test_51TdEk3Fp54lWWmFANs89GvyTSZ9rR1QAEIhloKASL2mD3ig96W8aoFmzYjTRvvx4BQohL5r2zrSXS0TPYR8cueLk001D4qIBW7"

# D1 binding used by the Pages Functions in /functions/api/*
[[d1_databases]]
binding = "DB"
database_name = "nationalcloset-crm"
database_id = "f5787ce4-29f9-43be-bf0e-cb486f1ec8e9"
