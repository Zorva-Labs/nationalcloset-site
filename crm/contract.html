<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contract · National Closet Company CRM</title><meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/crm/crm-app.css?v=ncc22" />
<style>
  /* ── Printable contract document ────────────────────────────────────────
     The CRM screen shows an *editable* form (textareas, inputs) for admins.
     But that form is NOT what we print — printing the form gave raw HTML in
     textareas, clipped content, and no letterhead. Instead we render a
     separate, fully-formatted legal document (.print-doc) with a branded
     letterhead (logo + business info), the scope/terms rendered as real HTML,
     a clean line-item table and signature blocks. On screen .print-doc is
     hidden; in print it's the ONLY thing shown. Browser "Save as PDF"
     produces a permanent, professional copy. */
  .print-doc { display: none; }

  @media print {
    @page { size: letter; margin: 0.55in; }
    /* Hide the entire CRM app + the editable screen view; show only the doc. */
    html, body { background: #fff !important; }
    .tnav, .page-head { display: none !important; }
    #page > *:not(.print-doc) { display: none !important; }
    .app, .app--wide, #page { max-width: none !important; margin: 0 !important; padding: 0 !important; }

    .print-doc {
      display: block !important;
      color: #16140F; font-family: "Montserrat", system-ui, sans-serif;
      font-size: 10.5pt; line-height: 1.55;
    }
    .print-doc * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* Letterhead */
    .pd-mast { display: flex; justify-content: space-between; align-items: flex-start;
      padding-bottom: 12pt; border-bottom: 2px solid #16140F; margin-bottom: 4pt; }
    .pd-brand { display: flex; align-items: center; gap: 11pt; }
    .pd-brand img { height: 46pt; width: auto; display: block; }
    .pd-brand-txt strong { display: block; font-size: 15pt; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
    .pd-brand-txt span { display: block; font-size: 7.5pt; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B9542F; margin-top: 3pt; }
    .pd-biz { text-align: right; font-size: 8.5pt; line-height: 1.65; color: #3A362F; }
    .pd-biz a { color: #3A362F; text-decoration: none; }

    /* Title bar */
    .pd-titlebar { display: flex; justify-content: space-between; align-items: baseline; margin: 16pt 0 4pt; }
    .pd-titlebar h1 { font-size: 19pt; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
    .pd-num { text-align: right; font-size: 9pt; color: #3A362F; }
    .pd-num strong { display: block; font-size: 11pt; color: #16140F; font-weight: 700; }
    .pd-num span { display: block; font-size: 8pt; color: #6C665B; margin-top: 2pt; }

    /* Meta grid */
    .pd-meta { display: flex; flex-wrap: wrap; gap: 6pt 28pt; padding: 10pt 14pt; margin: 12pt 0 4pt;
      background: #F6E6DF; border-radius: 4pt; }
    .pd-meta div { font-size: 9.5pt; }
    .pd-meta span { display: block; font-size: 7pt; letter-spacing: 0.1em; text-transform: uppercase; color: #6C665B; margin-bottom: 1pt; }
    .pd-meta strong { font-weight: 600; }

    .pd-intro { font-size: 10.5pt; color: #3A362F; margin: 14pt 0; }

    .print-doc h2 { font-size: 12.5pt; font-weight: 800; letter-spacing: -0.01em; margin: 20pt 0 7pt;
      padding-bottom: 3pt; border-bottom: 1px solid #D8D6D0; page-break-after: avoid; }
    .pd-rich { font-size: 10pt; line-height: 1.6; }
    .pd-rich p { margin: 0 0 7pt; }
    .pd-rich ul, .pd-rich ol { margin: 0 0 7pt; padding-left: 18pt; }
    .pd-rich li { margin-bottom: 3pt; }
    .pd-rich h3 { font-size: 10.5pt; font-weight: 700; margin: 10pt 0 4pt; }
    .pd-rich strong, .pd-rich b { font-weight: 700; }

    /* Line items */
    table.pd-lines { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin: 6pt 0; }
    table.pd-lines th { text-align: left; font-size: 7pt; letter-spacing: 0.08em; text-transform: uppercase;
      color: #56493C; padding: 5pt 7pt; border-bottom: 1.5px solid #16140F; }
    table.pd-lines td { padding: 6pt 7pt; border-bottom: 1px solid #E3E1DC; vertical-align: top; }
    table.pd-lines .num { text-align: right; font-variant-numeric: tabular-nums; }

    .pd-totals { margin-left: auto; width: 46%; min-width: 240pt; margin-top: 8pt; font-variant-numeric: tabular-nums; }
    .pd-totals .r { display: flex; justify-content: space-between; padding: 3pt 0; font-size: 10pt; }
    .pd-totals .r.grand { border-top: 1.5px solid #16140F; margin-top: 4pt; padding-top: 7pt; font-size: 12pt; font-weight: 700; }
    .pd-totals .r.deposit { color: #B9542F; font-weight: 700; }

    /* Signatures */
    .pd-sigs { display: grid; grid-template-columns: 1fr 1fr; gap: 26pt; margin-top: 14pt; page-break-inside: avoid; }
    .pd-sig-label { font-size: 7pt; letter-spacing: 0.1em; text-transform: uppercase; color: #6C665B; margin-bottom: 5pt; }
    .pd-sig img { max-width: 100%; height: 60pt; object-fit: contain; object-position: left bottom; display: block; }
    .pd-sig-line { border-bottom: 1.5px solid #16140F; height: 46pt; margin-bottom: 5pt; }
    .pd-sig-name { font-size: 10pt; font-weight: 600; border-top: 1px solid #D8D6D0; padding-top: 4pt; }
    .pd-sig-date { font-size: 8pt; color: #6C665B; margin-top: 2pt; }
    .pd-hash { font-size: 6.5pt; color: #9b958a; margin-top: 3pt; word-break: break-all; }

    .pd-foot { margin-top: 22pt; padding-top: 8pt; border-top: 1px solid #D8D6D0;
      font-size: 7.5pt; color: #6C665B; text-align: center; letter-spacing: 0.04em; }

    /* Avoid orphaned section headers / split signature blocks */
    .pd-section { page-break-inside: avoid; }
  }
</style>
</head>
<body>
<script src="/crm/crm-app.js?v=ncc22"></script>
<script>
const id = parseInt(new URLSearchParams(location.search).get("id"), 10);
const wantCountersign = new URLSearchParams(location.search).get("action") === "countersign";
if (!id) location.href = "/crm/contracts.html";
let state;

(async () => {
  const user = await SSCrm.mount({ title: "Contract", actions: `<a class="btn ghost" href="/crm/contracts.html">← Contracts</a>` });
  if (!user) return;
  state = await SSCrm.fetchJSON("/api/contracts/" + id);
  render();
  if (wantCountersign) setTimeout(() => document.getElementById("countersign-btn")?.scrollIntoView({ behavior: "smooth" }), 100);
})();

function render() {
  const { contract: k, lines } = state;
  document.getElementById("page-title").textContent = `${k.number} · ${SSCrm.fmtMoney(k.total_cents)}`;
  const customerUrl = `${location.origin}/contract/?t=${k.view_token}`;
  const canSend = k.status === "draft";
  // Contracts now auto-counter-sign at the moment the customer signs — see
  // POST /api/public/contract/[token] which sets status='fully_executed' +
  // counter_signed_at + counter_signer_name='National Closet Company' in one shot.
  // The legacy manual countersign UI is intentionally not surfaced here; a
  // pre-existing contract still stuck in 'signed_by_customer' shows a small
  // hint and a one-click "Mark as booked" button below to clear it.
  const stuckSignedByCustomer = k.status === "signed_by_customer";
  const isBooked = k.status === "fully_executed";
  // The manual-deposit card is relevant once the customer has signed (either
  // fully executed or legacy stuck-signed state) so an admin can record an
  // off-platform deposit (check / Venmo / cash / ACH).
  const canCountersign = stuckSignedByCustomer;

  document.getElementById("page").innerHTML = `
    ${isBooked ? `
      <div class="banner banner--success">
        <div class="banner__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="banner__body">
          <strong>Job booked!</strong>
          <span>Auto-countersigned ${SSCrm.fmtDateTime(k.counter_signed_at)}. ${k.deposit_paid ? "Deposit received." : `Deposit pending: ${SSCrm.fmtMoney(k.deposit_cents)}`}</span>
        </div>
      </div>` : ""}

    ${stuckSignedByCustomer ? `
      <div class="banner" style="background:#FEF3C7;border-left:3px solid #9D7A3E;color:#14110D">
        <div class="banner__body">
          <strong>Legacy contract pending counter-sign.</strong>
          <span>This contract was signed before auto-countersign was wired up. Click below to mark it as booked.</span>
          <button class="btn primary sm" style="margin-top:8px" onclick="markBooked()">Mark as booked &amp; book the job</button>
        </div>
      </div>` : ""}

    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div style="display:flex;gap:10px;align-items:center">
        ${SSCrm.pill(k.status)}
        <span class="pill" style="background:#F0FDFA;color:#0F766E;border-color:#CCFBF1">${contractTypeLabel(k.contract_type || "custom_order")}</span>
        <span class="muted" style="font-size:13px">${SSCrm.esc(k.project_name)} · <a href="/crm/contact.html?id=${k.contact_id}">${SSCrm.esc(k.contact_name)}</a></span>
      </div>
      <div style="display:flex;gap:8px">
        ${canSend ? `<button class="btn primary" onclick="sendContract()">Send to customer</button>` : ""}
        <button class="btn secondary" onclick="printContract()">🖨 Print / Save PDF</button>
        ${k.status !== "draft" ? `<a class="btn secondary" href="${customerUrl}" target="_blank">Customer link ↗</a>` : ""}
        ${!isBooked ? `<button class="btn danger" onclick="del()">Delete</button>` : ""}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Scope &amp; line items</h2></div>
      <table class="lines"><thead><tr>
        <th style="width:34%">Description</th><th>Room / Area</th><th class="num">Qty</th><th class="num">Unit $</th><th class="num">Total</th><th></th>
      </tr></thead><tbody id="lines-body">${lines.length ? lines.map((l, i) => lineRow(l, i)).join("") : lineRow({}, 0)}</tbody></table>
      <div class="add"><button onclick="addLine()">+ Line item</button></div>

      <div class="totals">
        <div class="r"><span>Total</span><span id="t-grand">${SSCrm.fmtMoney(k.total_cents)}</span></div>
        <div class="r"><span>Deposit due at signing</span><input id="t-deposit" type="text" value="${k.deposit_cents ? "$" + (k.deposit_cents/100).toFixed(2) : ""}" style="width:120px;text-align:right;border:1px solid var(--line);padding:5px 8px;border-radius:var(--r-sm)"/></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head"><h2>Contract content</h2></div>
      <div class="form">
        <label><span>Intro</span><textarea id="intro" rows="3">${SSCrm.esc(k.intro || "")}</textarea></label>
        <label><span>Scope (HTML allowed)</span><textarea id="scope" rows="4">${SSCrm.esc(k.scope_html || "")}</textarea></label>
        <label><span>Terms (HTML allowed)</span><textarea id="terms" rows="10">${SSCrm.esc(k.terms_html || "")}</textarea></label>
        <label><span>Estimated install window</span><input id="install-win" value="${SSCrm.esc(k.estimated_install_window || "")}"/></label>
        <div class="form-actions"><button class="btn primary" onclick="save()">Save changes</button></div>
      </div>
    </div>

    ${isBooked || canCountersign ? `
      <div class="card" style="margin-top:16px">
        <div class="card-head"><h2>Deposit</h2></div>
        <div class="form">
          <div class="row">
            <label><span>Deposit received?</span>
              <select id="dep-paid">
                <option value="0" ${!k.deposit_paid ? "selected" : ""}>Not yet</option>
                <option value="1" ${k.deposit_paid ? "selected" : ""}>Yes, received</option>
              </select>
            </label>
            <label><span>Method (check #, Venmo, cash, ACH)</span>
              <input id="dep-method" value="${SSCrm.esc(k.deposit_paid_method || "")}"/></label>
          </div>
          <div class="form-actions"><button class="btn primary" onclick="saveDeposit()">Update deposit</button></div>
        </div>
      </div>` : ""}

    ${k.signature_image ? `
      <div class="card" style="margin-top:16px">
        <div class="card-head"><h2>Signatures</h2></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:30px">
          <div>
            <div class="muted" style="font-size:12px;margin-bottom:6px">CUSTOMER SIGNATURE</div>
            <img src="${SSCrm.esc(k.signature_image)}" style="border:1px solid var(--line);max-width:100%;background:#fff" alt="Customer signature"/>
            <div style="font-size:13px;margin-top:8px"><strong>${SSCrm.esc(k.signer_name)}</strong></div>
            <div class="muted" style="font-size:12px">${SSCrm.fmtDateTime(k.signed_by_customer_at)}</div>
            <div class="muted" style="font-size:11px;font-family:var(--font-mono)">hash ${SSCrm.esc(String(k.document_hash_at_sign || "").slice(0, 16))}…</div>
          </div>
          ${k.counter_signature_image ? `
            <div>
              <div class="muted" style="font-size:12px;margin-bottom:6px">NATIONAL CLOSET COMPANY SIGNATURE</div>
              <img src="${SSCrm.esc(k.counter_signature_image)}" style="border:1px solid var(--line);max-width:100%;background:#fff" alt="Counter signature"/>
              <div style="font-size:13px;margin-top:8px"><strong>${SSCrm.esc(k.counter_signer_name)}</strong></div>
              <div class="muted" style="font-size:12px">${SSCrm.fmtDateTime(k.counter_signed_at)}</div>
            </div>` : `
            <div style="display:flex;align-items:center;justify-content:center;border:1px dashed var(--line-strong);border-radius:var(--r);padding:30px;color:var(--ink-muted);font-size:13px">
              Awaiting counter-signature
            </div>`}
        </div>
      </div>` : ""}

    ${renderContractDoc(k, lines)}
  `;
}

// Branded, fully-rendered legal document used for Print / Save PDF. This is a
// SEPARATE element from the editable form above — it renders scope_html /
// terms_html as real HTML (not raw text in a textarea), carries the company
// letterhead (logo + business info), a clean line-item table and signature
// blocks. Hidden on screen (.print-doc { display:none }); the @media print
// stylesheet hides everything else and shows only this.
function renderContractDoc(k, lines) {
  const esc = SSCrm.esc;
  const typeLabel = contractTypeLabel(k.contract_type || "custom_order");
  const docDate = k.created_at ? SSCrm.fmtDate(k.created_at) : "";
  const rows = (lines && lines.length ? lines : []).map((l) => {
    const total = l.line_total_cents != null ? l.line_total_cents : (Number(l.quantity || 1) * (l.unit_price_cents || 0));
    return `<tr>
      <td><strong>${esc(l.description || "")}</strong></td>
      <td>${esc(l.room || "")}</td>
      <td class="num">${l.quantity || 1}</td>
      <td class="num">${SSCrm.fmtMoney(l.unit_price_cents || 0)}</td>
      <td class="num"><strong>${SSCrm.fmtMoney(total)}</strong></td>
    </tr>`;
  }).join("");

  // Customer signature block — drawn image if signed, blank rule otherwise.
  const custSig = k.signature_image
    ? `<div class="pd-sig"><img src="${esc(k.signature_image)}" alt="Customer signature"/></div>
       <div class="pd-sig-name">${esc(k.signer_name || k.contact_name || "")}</div>
       ${k.signed_by_customer_at ? `<div class="pd-sig-date">Signed ${SSCrm.fmtDateTime(k.signed_by_customer_at)}</div>` : ""}
       ${k.document_hash_at_sign ? `<div class="pd-hash">Document hash: ${esc(String(k.document_hash_at_sign))}</div>` : ""}`
    : `<div class="pd-sig-line"></div>
       <div class="pd-sig-name">${esc(k.contact_name || "Customer")}</div>
       <div class="pd-sig-date">Signature &amp; date</div>`;

  // Company counter-signature.
  const compSig = k.counter_signature_image
    ? `<div class="pd-sig"><img src="${esc(k.counter_signature_image)}" alt="National Closet Company signature"/></div>
       <div class="pd-sig-name">${esc(k.counter_signer_name || "National Closet Company")}</div>
       ${k.counter_signed_at ? `<div class="pd-sig-date">Signed ${SSCrm.fmtDateTime(k.counter_signed_at)}</div>` : ""}`
    : (k.counter_signer_name
      ? `<div class="pd-sig-line" style="display:flex;align-items:flex-end;padding-bottom:6pt;font-family:'Montserrat';font-size:15pt;font-style:italic">${esc(k.counter_signer_name)}</div>
         <div class="pd-sig-name">${esc(k.counter_signer_name)}</div>
         ${k.counter_signed_at ? `<div class="pd-sig-date">Signed ${SSCrm.fmtDateTime(k.counter_signed_at)}</div>` : ""}`
      : `<div class="pd-sig-line"></div>
         <div class="pd-sig-name">National Closet Company</div>
         <div class="pd-sig-date">Authorized signature &amp; date</div>`);

  return `
    <article class="print-doc">
      <header class="pd-mast">
        <div class="pd-brand">
          <img src="/img/ncc-logo-nc.png" alt="National Closet Company"/>
          <div class="pd-brand-txt">
            <strong>National Closet Company</strong>
            <span>Custom Closets &amp; Closet Systems</span>
          </div>
        </div>
        <div class="pd-biz">
          Gallatin, TN<br/>
          629-298-8241<br/>
          hello@nationalclosetco.com<br/>
          nationalclosetco.com
        </div>
      </header>

      <div class="pd-titlebar">
        <h1>Custom Closet Agreement</h1>
        <div class="pd-num"><strong>${esc(k.number || "")}</strong><span>${esc(typeLabel)}</span></div>
      </div>

      <div class="pd-meta">
        <div><span>Customer</span><strong>${esc(k.contact_name || "")}</strong></div>
        <div><span>Project</span><strong>${esc(k.project_name || "")}</strong></div>
        ${k.site_address ? `<div><span>Site address</span><strong>${esc(k.site_address)}</strong></div>` : ""}
        <div><span>Install window</span><strong>${esc(k.estimated_install_window || "TBD")}</strong></div>
        ${docDate ? `<div><span>Date</span><strong>${esc(docDate)}</strong></div>` : ""}
      </div>

      ${k.intro ? `<p class="pd-intro">${esc(k.intro)}</p>` : ""}

      <section class="pd-section">
        <h2>Scope of work</h2>
        ${k.scope_html ? `<div class="pd-rich">${k.scope_html}</div>` : ""}
        <table class="pd-lines">
          <thead><tr>
            <th style="width:46%">Description</th><th>Room / Area</th>
            <th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th>
          </tr></thead>
          <tbody>${rows || `<tr><td colspan="5" style="color:#9b958a">No line items.</td></tr>`}</tbody>
        </table>
        <div class="pd-totals">
          <div class="r grand"><span>Total</span><span>${SSCrm.fmtMoney(k.total_cents)}</span></div>
          ${k.deposit_cents ? `<div class="r deposit"><span>Deposit due at signing</span><span>${SSCrm.fmtMoney(k.deposit_cents)}</span></div>` : ""}
        </div>
      </section>

      ${k.terms_html ? `
        <section class="pd-section">
          <h2>Terms &amp; conditions</h2>
          <div class="pd-rich">${k.terms_html}</div>
        </section>` : ""}

      <section class="pd-section">
        <h2>Signatures</h2>
        <div class="pd-sigs">
          <div><div class="pd-sig-label">Customer</div>${custSig}</div>
          <div><div class="pd-sig-label">National Closet Company</div>${compSig}</div>
        </div>
      </section>

      <div class="pd-foot">National Closet Company · Custom Closets &amp; Closet Systems · Gallatin, TN · 629-298-8241 · hello@nationalclosetco.com · nationalclosetco.com</div>
    </article>`;
}

function lineRow(l, i) {
  const total = (Number(l.quantity || 1)) * (l.unit_price_cents || 0);
  return `<tr data-i="${i}">
    <td><input data-f="description" value="${SSCrm.esc(l.description || "")}"/></td>
    <td><input data-f="room" value="${SSCrm.esc(l.room || "")}"/></td>
    <td><input class="num" data-f="quantity" value="${l.quantity || 1}" type="number" step="1" min="0"/></td>
    <td><input class="num" data-f="unit" value="${l.unit_price_cents ? "$" + (l.unit_price_cents / 100).toFixed(2) : ""}"/></td>
    <td class="num money money-line">${SSCrm.fmtMoney(total)}</td>
    <td><button class="rm" onclick="this.closest('tr').remove()" title="Remove">×</button></td>
  </tr>`;
}
function addLine() { const t = document.getElementById("lines-body"); t.insertAdjacentHTML("beforeend", lineRow({}, t.children.length)); }

async function save() {
  const lines = [...document.querySelectorAll("#lines-body tr")].map((tr) => {
    return {
      description: tr.querySelector("[data-f=description]").value.trim(),
      room: tr.querySelector("[data-f=room]").value.trim() || null,
      quantity: Number(tr.querySelector("[data-f=quantity]").value || 1),
      unit_price_cents: SSCrm.parseMoney(tr.querySelector("[data-f=unit]").value),
    };
  }).filter((l) => l.description);
  try {
    await SSCrm.fetchJSON("/api/contracts/" + id, { method: "PATCH", body: JSON.stringify({
      lines,
      deposit_cents: SSCrm.parseMoney(document.getElementById("t-deposit").value),
      intro: document.getElementById("intro").value.trim(),
      scope_html: document.getElementById("scope").value.trim(),
      terms_html: document.getElementById("terms").value.trim(),
      estimated_install_window: document.getElementById("install-win").value.trim(),
    })});
    SSCrm.toast("Saved", "success");
    state = await SSCrm.fetchJSON("/api/contracts/" + id);
    render();
  } catch (e) { SSCrm.toast(e.message, "error"); }
}
async function saveDeposit() {
  try {
    await SSCrm.fetchJSON("/api/contracts/" + id, { method: "PATCH", body: JSON.stringify({
      deposit_paid: document.getElementById("dep-paid").value === "1",
      deposit_paid_method: document.getElementById("dep-method").value.trim() || null,
      deposit_paid_at: document.getElementById("dep-paid").value === "1" ? new Date().toISOString().slice(0, 19).replace("T", " ") : null,
    })});
    SSCrm.toast("Deposit updated", "success");
    state = await SSCrm.fetchJSON("/api/contracts/" + id);
    render();
  } catch (e) { SSCrm.toast(e.message, "error"); }
}
async function sendContract() {
  if (!(await SSCrm.confirmDialog("Email this contract to the customer for signature?"))) return;
  try { await SSCrm.fetchJSON(`/api/contracts/${id}/send`, { method: "POST" }); SSCrm.toast("Contract sent", "success"); state = await SSCrm.fetchJSON("/api/contracts/" + id); render(); }
  catch (e) { SSCrm.toast(e.message, "error"); }
}

// Legacy fallback: a contract stuck in 'signed_by_customer' (signed before
// auto-countersign was wired). One click flips it to fully_executed without
// requiring a hand-drawn signature — the system stamps National Closet Company as
// the counter-signer with the current timestamp.
async function markBooked() {
  if (!(await SSCrm.confirmDialog("Mark this contract as booked? (Auto-countersign as National Closet Company.)"))) return;
  try {
    await SSCrm.fetchJSON(`/api/contracts/${id}/countersign`, {
      method: "POST",
      body: JSON.stringify({ signer_name: "National Closet Company", auto: true }),
    });
    SSCrm.toast("Booked!", "success");
    state = await SSCrm.fetchJSON("/api/contracts/" + id);
    render();
  } catch (e) { SSCrm.toast(e.message, "error"); }
}

// Open a clean print view of the contract — uses browser print → "Save as
// PDF" so admins / customers can download a permanent copy without any
// server-side PDF rendering. The print stylesheet (@media print, see <style>
// block above) hides admin chrome and shows just the legal document.
function printContract() {
  // Slight delay so any open dropdowns close before the print dialog opens
  setTimeout(() => window.print(), 50);
}

async function del() {
  if (!(await SSCrm.confirmDialog("Delete this contract? Cannot be undone."))) return;
  await SSCrm.fetchJSON("/api/contracts/" + id, { method: "DELETE" });
  location.href = "/crm/contracts.html";
}

function contractTypeLabel(t) {
  return ({
    custom_order: "Design & Install · walls as-is",
    wallprep: "Design & Install + Wall Repair & Paint",
    install_only: "Install Only · BYO",
    repair: "Repair / Service Call",
    service_call: "Service Call",
  })[t] || t;
}
</script>
