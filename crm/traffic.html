<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic · National Closet Company CRM</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="/crm/crm-app.css?v=ncc121" />
  <link rel="icon" href="/img/favicon-nc.png" />
  <style>
    .tf-tog{display:inline-flex;border:2px solid var(--line-soft,#e6e3dd);border-radius:999px;overflow:hidden;background:#fff}
    .tf-tog button{font-family:inherit;font-size:.85rem;font-weight:700;padding:7px 20px;border:0;background:transparent;color:var(--ink-soft);cursor:pointer}
    .tf-tog button.on{background:var(--accent-fill);color:#fff}
  .src-head{
  font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;
  font-weight:700;margin:0 0 .3rem;
}
.src-lede{font-size:.86rem;line-height:1.55;margin:0 0 1rem;max-width:62rem}
.src-lede strong{font-weight:700}

.src-edge{background:#f4f6f8;border-top-color:#5b6673}
.src-edge .src-head{color:#3c4854}
.src-edge .src-lede{color:#4a5663}

.src-gsc{background:#f0f8f2;border-top-color:#1e8e3e}
.src-gsc .src-head{color:#10652a}
.src-gsc .src-lede{color:#2f6b42}
.src-gsc .panel{border-color:#cfe6d6}

.src-ga{background:#f2f7fd;border-top-color:#1a73e8}
.src-ga .src-head{color:#12467f}
.src-ga .src-lede{color:#3d5878}
.src-ga .panel{border-color:#c9dcf4}

/* The caveat that stops the three sections being read as one number measured
   three times. Sits inside its section so it inherits the ground. */
.src-note{
  margin:0 0 1rem;padding:.8rem .95rem;border-radius:3px;
  background:rgba(255,255,255,.75);font-size:.82rem;line-height:1.55;
}
.src-note ul{margin:.45rem 0 0;padding-left:1.1rem}
.src-note li{margin-bottom:.28rem}
.src-gsc .src-note{color:#2f6b42}
.src-ga .src-note{color:#3d5878}
.src-edge .src-note{color:#4a5663}


/* ---- Panels in columns ----------------------------------------------------
 *
 * Seventeen full-width panels ran to several screens and made the three
 * sections feel like three pages. auto-fit means the same markup is one column
 * on a phone and three on a desktop without a breakpoint per layout.
 *
 * Charts and the wide tables opt out: a sparkline squeezed into a third of the
 * width is smaller without being more readable, which is the wrong trade.
 */
.panels{display:grid;gap:.85rem;grid-template-columns:1fr;align-items:start}
.panels .panel{margin-bottom:0}
@media (min-width:56rem){
  .panels{grid-template-columns:repeat(auto-fit,minmax(20rem,1fr))}
  .panels .panel-wide{grid-column:1 / -1}
}
.panels .panel h2{font-size:.92rem;margin-bottom:.6rem}
.panels .panel .pg-sub{font-size:.78rem;margin-bottom:.6rem}

/* Air between the sections, so the colour change reads as a boundary rather
   than as a panel that happens to be tinted. */
/* The nav is sticky, so an anchor must not land under it. */
.src-nav{
  position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:.4rem;
  margin:0 -1rem 1.25rem;padding:.7rem 1rem;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(140%) blur(8px);
  border-bottom:1px solid var(--rule);
}
.src-nav a{
  font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  text-decoration:none;padding:.35rem .7rem;border-radius:999px;
  border:1px solid var(--rule);color:var(--ink-2,#39424e);background:#fff;
}
.src-nav a:hover{border-color:currentColor}
.src-nav a:nth-child(1):hover{color:#3c4854}
.src-nav a:nth-child(2){color:#10652a;border-color:#cfe6d6}
.src-nav a:nth-child(3){color:#12467f;border-color:#c9dcf4}


.why{margin:0 0 .9rem}
.why summary{display:inline-block;cursor:pointer;list-style:none;font-size:.75rem;font-weight:600;
  color:var(--muted,#656f7d);border-bottom:1px dotted currentColor;padding:.1rem 0}
.why summary::-webkit-details-marker{display:none}
.why summary:hover{color:var(--ink-2,#39424e)}
.why[open] summary{margin-bottom:.5rem}
.why .src-note{margin:0}
.panel-wide #chart,.panel-wide .spark,.panel-wide svg{width:100%}
/* ---- Stat tiles -----------------------------------------------------------
 *
 * .grid-3 and .tile are used by the summary rows and by the Analytics panel,
 * and were never defined — so every tile row rendered as a vertical stack of
 * unstyled number-then-label pairs. The markup was right; the stylesheet was
 * simply missing.
 */
.grid{display:grid;gap:.7rem}
.grid-3{grid-template-columns:1fr}
@media (min-width:34rem){.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{
  background:var(--sunk,#f5f7fa);border:1px solid var(--rule,#e2e6ec);
  border-radius:2px;padding:.7rem .8rem;
}
.tile-n{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile-k{margin:.15rem 0 0;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted,#656f7d)}
.src-ga .tile{background:rgba(255,255,255,.75);border-color:#c9dcf4}
.src-gsc .tile{background:rgba(255,255,255,.75);border-color:#cfe6d6}

/* ---- Overflow -------------------------------------------------------------
 *
 * A grid item defaults to min-width:auto, which means it refuses to shrink
 * below the intrinsic width of its widest child. A five-column table inside a
 * 19rem column therefore pushes the panel wider than its track, clipping the
 * last column and shoving the next panel off the edge — which is exactly what
 * it did.
 *
 * min-width:0 lets the track win; overflow-x:auto gives the table somewhere to
 * go instead of being cut off. Both are needed: the first alone would squash
 * the table, the second alone would never trigger.
 */
.panels > *,.panels .panel{min-width:0}
.panel{overflow-x:auto;overflow-y:visible}
.panel table{width:100%;border-collapse:collapse}
.panel td,.panel th{overflow-wrap:anywhere}

/* Long URLs and search phrases are the usual culprit: one unbroken string is
   as wide as it is, and no amount of column sizing helps. */
.panel .bar-label,.panel .tbl td:first-child{overflow-wrap:anywhere;word-break:break-word}

/* Nothing on the page may push the document sideways. */
html,body{max-width:100%;overflow-x:hidden}

/* ---- Overflow, corrected --------------------------------------------------
 *
 * overflow-wrap:anywhere on every cell broke headings mid-word ("Visit s",
 * "Conversi ons"). It belongs only on the cells that actually carry unbreakable
 * strings — URLs and search phrases in the first column. Headings and numbers
 * wrap at word boundaries or not at all.
 */
.panel th{overflow-wrap:normal;word-break:normal;hyphens:none;white-space:normal}
.panel td{overflow-wrap:normal}
.panel td:first-child,.panel .bar-label{overflow-wrap:anywhere}
.panel td.n,.panel th.n{white-space:nowrap;text-align:right}

/* auto-fill keeps empty tracks, which is where the gap on the right came from.
   auto-fit collapses them, so two panels share the row instead of two panels
   and a hole. */
@media (min-width:56rem){
  .panels{grid-template-columns:repeat(auto-fit,minmax(19rem,1fr))}
}

/* The chart is drawn to its container, so the container has to be the thing
   that is bounded. */
.panel-wide{overflow:hidden}
.panel-wide #chart,.panel-wide .spark{max-width:100%;overflow-x:auto}

/* ---- Track width, finally -------------------------------------------------
 *
 * A panel spanning 1 / -1 fixes the track count, so auto-fit cannot collapse
 * the unused one — which is where the empty third column came from. Wider
 * tracks mean the row is full at two panels on a normal screen, and three only
 * on a genuinely wide one. Fewer, wider panels also read better: these are
 * tables, not tiles.
 */
@media (min-width:56rem){
  .panels{grid-template-columns:repeat(auto-fit,minmax(24rem,1fr))}
}
@media (min-width:100rem){
  .panels{grid-template-columns:repeat(auto-fit,minmax(21rem,1fr))}
}

/* ---- Masonry, and air between the sections --------------------------------
 *
 * Grid gives every item in a row the height of the tallest, so a five-row table
 * beside a two-row one leaves a hole under the short one. CSS columns pack
 * bottom-up instead — true masonry, no gaps, and no JavaScript. It is also the
 * only version of this that degrades sanely: one column on a phone, and the
 * browser decides the rest.
 *
 * The trade is reading order: columns flow top-to-bottom then across, so panel
 * two sits under panel one rather than beside it. These panels are independent
 * readings, so that costs nothing.
 */
.panels{
  display:block;
  columns:1;
  column-gap:1rem;
}
@media (min-width:56rem){ .panels{columns:2} }
@media (min-width:92rem){ .panels{columns:3} }

.panels > *{
  break-inside:avoid;
  -webkit-column-break-inside:avoid;
  page-break-inside:avoid;
  display:block;
  margin:0 0 1rem;
  width:100%;
}

/* Charts want the full width, and column-span resets the flow around them. */
.panels > .panel-wide{
  column-span:all;
  -webkit-column-span:all;
  margin-bottom:1.15rem;
}

/* ---- Section separation ---------------------------------------------------
 *
 * The bands were landing directly on the panel above them, so the colour change
 * read as a rendering fault rather than a boundary. Each section is now an
 * inset block with its own ground and real space around it.
 */
.src-head{margin:0 0 .35rem}
.src-lede{margin:0 0 1rem;max-width:62ch}
.why{margin:0 0 1.15rem}

/* ---- Section spacing, actually ---------------------------------------------
 *
 * `.src + .src` only works when the sections are adjacent siblings, and they
 * are not — a "show more" details block sits between them, so the rule never
 * matched and the bands kept landing on the panel above. Margin on the section
 * itself does not care what is between them.
 */
.src:last-of-type{margin-bottom:1rem}

/* Panels have to read as separate cards against a near-white ground, or a
   column of them merges into one sheet of text. */
.panels > .panel{
  background:#fff;
  border:1px solid #dde3ea;
  border-radius:3px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}

/* ---- Sections: one definition, deliberately last --------------------------
 *
 * Replaces five overlapping .src rules that accumulated across patches. Each
 * set part of the spacing and partly overrode the one before, so the result was
 * whatever the cascade landed on rather than anything chosen.
 */
.src{
  padding:1.75rem 1.35rem 1.6rem;
  border-radius:4px;
  margin:0 0 3rem;
  scroll-margin-top:4.5rem;
}
.src:last-of-type{margin-bottom:1.5rem}
.src-head{margin:0 0 .35rem}
.src-lede{margin:0 0 1rem;max-width:62ch}
.why{margin:0 0 1.15rem}
</style>

<body>
<script src="/crm/crm-app.js?v=ncc110"></script>
<!-- bing: script -->
<script>
/* Section 4, Bing Webmaster Tools (/api/traffic/bing, filled daily by
   gsc-ingest). Self-contained on purpose: every site's dashboard has drifted
   from the template, so this block drops in whole (bin/add-bing.mjs) without
   touching the page's own code. It follows the page's window by watching the
   page ask /api/traffic/data for it, then asks /api/traffic/bing for the same
   number of days — the range buttons and Refresh drive it with no hook into
   the page. Runs before the page's module script so the watch is in place for
   the first load. */
(function () {
  var realFetch = window.fetch.bind(window);
  var seq = 0;
  /* Which request to follow and where Bing's numbers are: attributes on the
     section, so the same block serves the kit's /traffic (the defaults) and
     the CRM traffic pages (/api/crm/traffic, /api/crm/traffic-bing). Read at
     request time — the section comes later in the page than this script. */
  function cfg(k, d) { var el = document.getElementById('bing'); return (el && el.getAttribute('data-' + k)) || d; }
  window.fetch = function (input, init) {
    var p = realFetch(input, init);
    try {
      var u = new URL(typeof input === 'string' ? input : input.url, location.href);
      if (u.pathname === cfg('watch', '/api/traffic/data')) {
        var d = parseInt(u.searchParams.get('days') || '30', 10) || 30;
        p.then(function (r) { if (r && r.ok) load(d); }, function () {});
      }
    } catch (e) { /* never let the watch break the page's own request */ }
    return p;
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function n(v) { return v == null ? '—' : Number(v).toLocaleString('en-US'); }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  /* Parsed by hand, as the page's own chart does: a bare date string is read
     differently across browsers, and the day must not be off by one. */
  function short(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    return m ? MON[+m[2] - 1] + ' ' + (+m[3]) : String(iso || '');
  }
  function long(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    return m ? MON[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1] : String(iso || '');
  }
  var PANELS = ['bing-queries-panel', 'bing-pages-panel', 'bing-crawl-panel'];
  function panels(on) { PANELS.forEach(function (id) { var el = $(id); if (el) el.hidden = !on; }); }

  function load(days) {
    var my = ++seq;
    realFetch(cfg('api', '/api/traffic/bing') + '?days=' + days, { credentials: 'same-origin', headers: { accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (j) { if (my === seq) render(j.bing, days); })
      .catch(function () { if (my === seq) render(undefined, days); });
  }

  /* A card in the same shape as the Google sections' (window.chart.statCard,
     defined by the page), or a plain tile where a page predates it. */
  function card(label, value, prev, series, color) {
    if (window.chart && window.chart.statCard) {
      return window.chart.statCard(label, value, prev, series, color, [value, prev]);
    }
    return '<div class="tile"><p class="tile-n">' + n(value) + '</p><p class="tile-k">' + esc(label) + '</p></div>';
  }
  function plain(label, text) {
    return window.chart && window.chart.statCard
      ? '<div class="stat-lead"><p class="stat-lead-k">' + esc(label) + '</p><div class="stat-lead-r"><span class="stat-lead-n">' + esc(text) + '</span></div></div>'
      : '<div class="tile"><p class="tile-n">' + esc(text) + '</p><p class="tile-k">' + esc(label) + '</p></div>';
  }

  /* Bars are impressions; a bar that brought clicks is highlighted with the
     count above it — the page's own chart, in teal. Past three months a bar
     is a week, or the columns get too thin to read. */
  function chart(rows) {
    if (!rows || !rows.length) return '';
    var data = rows;
    if (rows.length > 92) {
      var weeks = [];
      rows.forEach(function (r, i) {
        if (i % 7 === 0) weeks.push({ day: r.day, clicks: 0, impressions: 0 });
        var w = weeks[weeks.length - 1];
        w.clicks += r.clicks || 0; w.impressions += r.impressions || 0;
      });
      data = weeks;
    }
    var max = Math.max.apply(null, data.map(function (r) { return r.impressions || 0; }).concat([1]));
    var step = Math.max(1, Math.ceil(data.length / 8));
    var last = data.length - 1;
    return '<p class="hint" style="margin-top:14px">Each bar is how often Bing showed the site that ' + (data === rows ? 'day' : 'week')
      + '. A highlighted bar, with a number above it, brought clicks.</p><div class="chart">'
      + data.map(function (r, i) {
        var h = Math.max(2, Math.round(((r.impressions || 0) / max) * 148));
        var label = i === last || (i % step === 0 && last - i >= Math.ceil(step / 2));
        return '<div class="chart__col" title="' + esc(long(r.day)) + ' — shown ' + n(r.impressions) + ', ' + n(r.clicks) + ' click' + (r.clicks === 1 ? '' : 's') + '">'
          + (r.clicks ? '<span class="chart__n">' + n(r.clicks) + '</span>' : '')
          + '<div class="chart__bar' + (r.clicks ? ' hit' : '') + '" style="height:' + h + 'px"></div>'
          + '<span class="chart__d">' + (label ? esc(short(r.day)) : '') + '</span></div>';
      }).join('') + '</div>';
  }

  function table(rows, cols) {
    if (!rows || !rows.length) return '<p class="empty">Nothing in this window.</p>';
    return '<table class="mv"><thead><tr>' + cols.map(function (c) { return '<th class="' + (c.n ? 'n' : '') + '">' + c.h + '</th>'; }).join('')
      + '</tr></thead><tbody>' + rows.map(function (r) {
        return '<tr>' + cols.map(function (c) { return '<td class="' + (c.n ? 'n' : 'q') + '">' + c.f(r) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  }
  function position(r) { return r.position == null ? '—' : Number(r.position).toFixed(1); }

  function render(b, days) {
    var asof = $('bing-asof');
    if (!asof) return;
    var tiles = $('bing-tiles'), box = $('bing-chart');
    if (b === undefined) {
      asof.textContent = 'Bing’s figures could not be loaded just now. Refresh to try again.';
      tiles.innerHTML = ''; box.innerHTML = ''; panels(false); return;
    }
    if (!b) {
      asof.textContent = 'This site is not in Bing Webmaster Tools yet. Once it is, Bing’s figures appear here within a day or two.';
      tiles.innerHTML = ''; box.innerHTML = ''; panels(false); return;
    }
    if (b.empty) {
      asof.textContent = 'Connected as ' + b.siteUrl + '. Bing has not reported anything for this site yet: it needs a day or two after a site is added, and a new site can take weeks to appear in Bing’s results.';
      tiles.innerHTML = ''; box.innerHTML = ''; panels(false); return;
    }

    asof.textContent = 'Bing’s figures for the ' + days + ' days to ' + long(b.asOf) + ', its latest day; collected every morning.';
    var t = b.totals || {}, pv = b.previous || {};
    var daily = b.daily || [];
    var ctr = t.impressions ? (t.clicks / t.impressions) * 100 : null;
    tiles.innerHTML = card('Clicks', t.clicks || 0, pv.clicks || 0, daily.map(function (r) { return r.clicks; }), '#00897b')
      + card('Impressions', t.impressions || 0, pv.impressions || 0, daily.map(function (r) { return r.impressions; }), '#5e35b1')
      + plain('Click-through rate', ctr == null ? '—' : ctr.toFixed(1) + '%');
    box.innerHTML = chart(daily);

    $('bing-queries').innerHTML = table(b.queries, [
      { h: 'Search', f: function (r) { return esc(r.query); } },
      { h: 'Position', n: 1, f: position },
      { h: 'Shown', n: 1, f: function (r) { return n(r.impressions); } },
      { h: 'Clicks', n: 1, f: function (r) { return n(r.clicks); } },
    ]);
    $('bing-pages').innerHTML = table(b.pages, [
      { h: 'Page', f: function (r) { return esc(r.path || r.page); } },
      { h: 'Shown', n: 1, f: function (r) { return n(r.impressions); } },
      { h: 'Clicks', n: 1, f: function (r) { return n(r.clicks); } },
      { h: 'Position', n: 1, f: position },
    ]);
    /* A two-column table, not tiles: the panel is a third of the page wide
       and three tiles side by side wrapped every label over four lines. */
    var c = b.crawl;
    $('bing-crawl').innerHTML = !c ? '<p class="empty">Bing has not reported a crawl yet.</p>'
      : table([
        ['Pages in Bing\u2019s index', c.inIndex],
        ['Pages crawled', c.crawled],
        ['Crawl errors', c.errors],
        ['Missing pages (4xx)', c.code_4xx],
        ['Server errors (5xx)', c.code_5xx],
        ['Redirects followed', c.redirects],
        ['Blocked by robots.txt', c.blocked],
        ['Links in from other sites', c.inLinks],
      ], [
        { h: 'What Bing found', f: function (r) { return esc(r[0]); } },
        { h: 'Count', n: 1, f: function (r) { return n(r[1]); } },
      ]) + '<p class="hint" style="margin-top:10px">The index count and the links are as of ' + esc(long(c.asOf))
        + '; the rest add up Bing\u2019s visits over the window. A missing page or a server error here is one Bing tried to read and could not.</p>';
    panels(true);
  }
})();
</script>

<script>
// Wrapped in an IIFE so nothing leaks to the global scope — inline scripts
// share globals with crm-app.js, which already defines fmtDay() etc.
(function () {
// ── shared helpers ──────────────────────────────────────────────────────────
const el = (id) => document.getElementById(id);
const N = (n) => (n || 0).toLocaleString();
const fmtDay = (iso) => { const p = String(iso).split("-"); return `${+p[1]}/${+p[2]}`; };
const fmtDur = (s) => { s = Math.round(s || 0); if (!s) return "—"; const m = Math.floor(s / 60), r = s % 60; return m ? (m + "m" + (r ? " " + r + "s" : "")) : (r + "s"); };
const flag = (cc) => (cc && cc.length === 2 && /^[A-Z]{2}$/.test(cc))
  ? String.fromCodePoint(...[...cc].map((c) => 0x1F1E6 + c.charCodeAt(0) - 65)) : "🏳️";
const box = (m) => `<div style="padding:18px;text-align:center;color:var(--ink-soft);font-size:13px">${m}</div>`;
const statHTML = (label, value, hint) => `
  <div style="flex:1;min-width:130px">
    <div style="font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:700">${label}${hint ? ` <span title="${hint.replace(/"/g, "&quot;")}" style="cursor:help;color:var(--clay-deep);font-weight:700">&#9432;</span>` : ""}</div>
    <div style="font-family:var(--display,inherit);font-size:1.6rem;font-weight:800;color:var(--ink);margin-top:2px">${value}</div>
  </div>`;
// Top row visible; the rest tuck behind a "Show all N" dropdown.
function collapse(rows, noun) {
  if (!rows || !rows.length) return "";
  const rest = rows.slice(1).join("");
  return rows[0] + (rest
    ? `<details style="margin-top:2px"><summary style="cursor:pointer;color:var(--clay-deep);font-weight:600;font-size:12px;padding:9px 0 3px;list-style:none">▸ Show all ${rows.length} ${noun}</summary>${rest}</details>`
    : "");
}

let mode = "today"; // "today" | "all"

(async () => {
  const user = await SSCrm.mount({ title: "Traffic", subtitle: "Real site traffic, counted at Cloudflare's edge" });
  if (!user) return;

  el("page").innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px">

function rkEsc(v) {

/* Click a column heading to sort. Reads the rendered cell text rather than the
   source rows, so it works on every table here without each render passing its
   data along — and rows whose cell is not a number ("not ranking yet", an
   em-dash) always sink to the bottom instead of being parsed as zero and
   claiming the top of an ascending sort. */
function initSortable() {
  const st = document.createElement('style');
  st.textContent = 'th[data-s]{cursor:pointer;user-select:none}'
    + 'th[data-s][data-d="asc"]::after{content:" \\25B2";font-size:.8em}'
    + 'th[data-s][data-d="desc"]::after{content:" \\25BC";font-size:.8em}';
  document.head.appendChild(st);

  document.addEventListener('click', (e) => {
    const th = e.target.closest('th[data-s]');
    if (!th) return;
    const tbl = th.closest('table');
    const body = tbl && tbl.tBodies[0];
    if (!body) return;
    const i = Number(th.dataset.s);
    const dir = th.getAttribute('data-d') === 'asc' ? 'desc' : 'asc';
    tbl.querySelectorAll('th[data-s]').forEach((h) => h.removeAttribute('data-d'));
    th.setAttribute('data-d', dir);

    const txt = (r) => ((r.cells[i] && r.cells[i].textContent) || '').trim();
    const numOf = (r) => {
      const t = txt(r);
      if (!/\d/.test(t)) return null;
      const m = t.replace(/,/g, '').match(/-?\d+(\.\d+)?/);
      return m ? parseFloat(m[0]) : null;
    };
    const rows = Array.prototype.slice.call(body.rows);
    const nums = rows.filter((r) => numOf(r) !== null);
    const rest = rows.filter((r) => numOf(r) === null);
    if (!nums.length) {
      rows.sort((a, b) => txt(a).localeCompare(txt(b)));
      if (dir === 'desc') rows.reverse();
      rows.forEach((r) => body.appendChild(r));
      return;
    }
    nums.sort((a, b) => numOf(a) - numOf(b));
    if (dir === 'desc') nums.reverse();
    rest.sort((a, b) => txt(a).localeCompare(txt(b)));
    nums.concat(rest).forEach((r) => body.appendChild(r));
  });
}
initSortable();

  return `<table style="width:100%;border-collapse:collapse"><thead><tr>${cols.map((c, i) => th(c, i)).join("")}</tr></thead>`
    + `<tbody>${rows.map((r) => `<tr>${cols.map((c) => td(c, r)).join("")}</tr>`).join("")}</tbody></table>`;

     time — rendering both as blank makes a working pipeline look broken. */
  if (!rk || !rk.installed) return;

  /* Targets first, and rendered even when the site has no ranking data at all —
     a new site's target list is exactly when it matters most, and "none of
     these yet" is a real answer rather than an empty card. */
  /* Shown even when empty — the card is where the editor lives, so hiding it
     with no keywords would leave no way to add the first one. */
  el("tf-rank-watch-card").hidden = false;
  el("watch-empty").hidden = !!(rk.watch || []).length;
  if ((rk.watch || []).length) {
    el("tf-rank-watch").innerHTML = rkTable(rk.watch, [
      { h: "Search", f: (r) => rkEsc(r.label || r.query) + (r.note ? ` <span style="color:var(--ink-soft)">&middot; ${rkEsc(r.note)}</span>` : "") },
      { h: "Position", n: 1, f: (r) => {
          if (r.position === null || r.position === undefined) return '<span style="color:var(--ink-soft)">not ranking yet</span>';
          const d = r.was === null || r.was === undefined ? null : r.was - r.position;
          const mv = d === null || Math.abs(d) < 0.5 ? ""
            : ` <span style="color:${d > 0 ? "#1a7f37" : "#b42318"}">${d > 0 ? "\u25b2" : "\u25bc"} ${Math.abs(d).toFixed(1)}</span>`;
          return r.position.toFixed(1) + mv;
        } },
      { h: "Times shown", n: 1, f: (r) => (r.impressions == null ? "&mdash;" : N(r.impressions)) },
      { h: "Clicks", n: 1, f: (r) => (r.clicks == null ? "&mdash;" : N(r.clicks)) },
    ]);
  }

  el("tf-rank-card").hidden = false;

  if (!rk.week) {
    el("tf-rank-asof").textContent = "Connected to Google Search Console. No data has arrived yet \u2014 Google needs a few days after a site is verified.";
    return;
  }

  const t = rk.trend || [];
  const cur = t[t.length - 1] || {};
  const prev = t.length > 1 ? t[t.length - 2] : null;
  const tile = (label, n, before) => {
    const d = before === null || before === undefined ? null : (n || 0) - (before || 0);
    const col = !d ? "var(--ink-soft)" : d > 0 ? "#1a7f37" : "#b42318";
    const txt = d === null ? "" : !d ? "no change" : `${d > 0 ? "+" : ""}${d} vs last week`;
    return `<div><div style="font-size:22px;font-weight:700;color:var(--ink)">${N(n || 0)}</div>`
      + `<div style="font-size:11.5px;color:var(--ink-soft)">${label}</div>`
      + `<div style="font-size:11px;color:${col}">${txt}</div></div>`;
  };

  el("tf-rank-asof").textContent = `Week of ${rk.week} \u00b7 ${N(cur.impressions || 0)} appearances in Google, ${N(cur.clicks || 0)} clicks`
    + (rk.meta && rk.meta.property ? ` \u00b7 ${rk.meta.property}` : "");

  /* Buckets, not average position: average position gets WORSE as a site
     succeeds, because newly earned long-tail terms enter around 40 and drag
     the mean down. */
  el("tf-rank-tiles").innerHTML =
      tile("ranking 1-3", cur.top3, prev ? prev.top3 : null)
    + tile("ranking 4-10", cur.top10, prev ? prev.top10 : null)
    + tile("ranking 11-20", cur.top20, prev ? prev.top20 : null)
    + tile("keywords total", cur.total, prev ? prev.total : null);

  /* Wins and losses together. Showing only the winners is the fastest way to
     make a real result look fabricated. */
  const mv = (rk.movement || []).filter((r) => Math.abs(r.was - r.now) >= 0.5).slice(0, 12);
  el("tf-rank-move").innerHTML = mv.length
    ? `<div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:6px">Movement since we started tracking each term</div>`
      + rkTable(mv, [
          { h: "Search", f: (r) => rkEsc(r.query) },
          { h: "Was", n: 1, f: (r) => r.was.toFixed(1) },
          { h: "Now", n: 1, f: (r) => r.now.toFixed(1) },
          { h: "Change", n: 1, f: (r) => {
              const d = r.was - r.now;
              return `<span style="color:${d > 0 ? "#1a7f37" : "#b42318"};font-weight:600">${d > 0 ? "\u25b2" : "\u25bc"} ${Math.abs(d).toFixed(1)}</span>`;
            } },
        ])
    : "";

  if ((rk.top || []).length) {
    el("tf-rank-top-card").hidden = false;
    el("tf-rank-top").innerHTML = rkTable(rk.top, [
      { h: "Search", f: (r) => rkEsc(r.query) },
      { h: "Position", n: 1, f: (r) => r.position.toFixed(1) },
      { h: "Shown", n: 1, f: (r) => N(r.impressions) },
      { h: "Clicks", n: 1, f: (r) => N(r.clicks) },
    ]);
  }

  /* Its own card rather than reusing the list above: this is the only place
     clicks and click-through rate are the point, and an ordering by
     appearances hides exactly the rows this exists to surface. */
  if ((rk.clicked || []).length) {
    el("tf-rank-clicked-card").hidden = false;
    el("tf-rank-clicked").innerHTML = rkTable(rk.clicked, [
      { h: "Search", f: (r) => rkEsc(r.query) },
      { h: "Position", n: 1, f: (r) => r.position.toFixed(1) },
      { h: "Times shown", n: 1, f: (r) => N(r.impressions) },
      { h: "Visits", n: 1, f: (r) => `<strong>${N(r.clicks)}</strong>` },
      { h: "Clicked", n: 1, f: (r) => (r.impressions ? Math.round((r.clicks / r.impressions) * 100) + "%" : "&mdash;") },
    ]);
  }

  if ((rk.striking || []).length) {
    el("tf-rank-near-card").hidden = false;
    el("tf-rank-near").innerHTML = rkTable(rk.striking, [
      { h: "Search", f: (r) => rkEsc(r.query) },
      { h: "Position", n: 1, f: (r) => r.position.toFixed(1) },
      { h: "Shown", n: 1, f: (r) => N(r.impressions) },
    ]);
  }
}

// Cloudflare edge data → stats, daily list, country, hourly.
function renderEdge(data, label) {
  const days = (data && data.days) || [];
  el("tf-daily-h").textContent = "Daily traffic · " + label;
  el("tf-hourly-h").textContent = "Traffic by hour · Central Time" + (label === "today" ? " · today" : "");

  if (!days.length) {
    el("tf-stats").innerHTML = statHTML("Page views · " + label, "0") + statHTML("Unique visitors · " + label, "0");
    el("tf-daily").innerHTML = box("No traffic recorded " + (label === "today" ? "today yet" : "in this range") + ".");
  } else {
    const max = Math.max(...days.map((d) => d.pageViews), 1);
    const totalPV = days.reduce((s, d) => s + d.pageViews, 0);
    const totalU = days.reduce((s, d) => s + d.uniques, 0);
    const pvHint = "Served HTML pages counted at Cloudflare's edge. Includes search/AI crawlers and your /crm admin pages, but EXCLUDES blocked non-US bots (they never load a page). This is an upper bound, not a pure human count — see Sources & Traffic-by-page below for real US visitors.";
    let stats = statHTML("Page views · " + label, N(totalPV), pvHint) + statHTML("Unique visitors · " + label, N(totalU), pvHint);
    if (label !== "today") stats += statHTML("Avg / day", N(Math.round(totalPV / days.length)));
    stats += `<div style="flex-basis:100%;font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-top:2px">Edge totals include search crawlers &amp; <code>/crm</code> and exclude blocked bots — an <strong>upper bound</strong>. The <strong>Sources</strong> &amp; <strong>Traffic by page</strong> sections below are your real US visitors (bots, /crm and non-US removed).</div>`;
    el("tf-stats").innerHTML = stats;

    const ordered = days.slice().reverse();
    const dayRow = (d, isFirst) => `
      <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft)">
        <span style="font-size:13px;color:var(--ink);min-width:52px;font-weight:600">${fmtDay(d.date)}${isFirst ? " <span style='font-weight:500;color:var(--ink-soft);font-size:11px'>today</span>" : ""}</span>
        <span style="flex:1;height:8px;background:var(--bg-soft);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;background:var(--accent);width:${Math.round((d.pageViews / max) * 100)}%"></span></span>
        <span style="font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);min-width:60px;text-align:right">${N(d.pageViews)}</span>
        <span style="font-variant-numeric:tabular-nums;color:var(--ink-soft);min-width:74px;text-align:right;font-size:12px">${N(d.uniques)} visitors</span>
      </div>`;
    const rowsArr = ordered.map((d, i) => dayRow(d, i === 0));
    const rest = rowsArr.slice(1).join("");
    el("tf-daily").innerHTML = rowsArr[0] + (rest
      ? `<details style="margin-top:4px"><summary style="cursor:pointer;color:var(--clay-deep);font-weight:600;font-size:13px;padding:10px 0 4px;list-style:none">▸ Show previous ${rowsArr.length - 1} days</summary>${rest}</details>`
      : "");
  }

  // US vs blocked — two headline bars, with the per-country breakdown on demand.
  const split = (data && data.edge_split) || null;
  const countries = (data && data.countries) || [];
  if (!split || !split.total) { el("tf-country").innerHTML = box("No edge data " + (label === "today" ? "today yet" : "") + "."); }
  else {
    const total = split.total || 1;
    const usPct = Math.round((split.us / total) * 100);
    const blPct = Math.round((split.blocked / total) * 100);
    const bar = (name, sub, n, pct, col) => `
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)">
        <span style="min-width:150px;font-size:13px;color:var(--ink);font-weight:700">${name} <span style="color:var(--ink-soft);font-weight:500;font-size:12px">${sub}</span></span>
        <span style="flex:1;height:10px;background:var(--bg-soft);border-radius:5px;overflow:hidden"><span style="display:block;height:100%;background:${col};width:${pct}%"></span></span>
        <span style="font-variant-numeric:tabular-nums;color:var(--ink-soft);min-width:92px;text-align:right;font-size:12px">${N(n)} · ${pct}%</span>
      </div>`;
    const cMax = Math.max(...countries.map((c) => c.requests), 1);
    const detail = countries.map((c) => `
      <div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line-soft)${c.code === 'US' ? ';background:var(--clay-wash,#FDF0EA)' : ''}">
        <span style="min-width:120px;font-size:13px;color:var(--ink);font-weight:${c.code === 'US' ? '700' : '500'}">${flag(c.code)} ${c.code}${c.code === 'US' ? ' 🇺🇸 · local' : ' · blocked'}</span>
        <span style="flex:1;height:8px;background:var(--bg-soft);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;background:${c.code === 'US' ? 'var(--accent)' : 'var(--ink-soft)'};width:${Math.round((c.requests / cMax) * 100)}%"></span></span>
        <span style="font-variant-numeric:tabular-nums;color:var(--ink-soft);min-width:44px;text-align:right;font-size:12px">${Math.round((c.requests / total) * 100)}%</span>
      </div>`).join("");
    el("tf-country").innerHTML =
      bar("🇺🇸 US visitors", "· allowed", split.us, usPct, "var(--accent)") +
      bar("🚫 Blocked", "· non-US, 403'd", split.blocked, blPct, "var(--ink-soft)") +
      `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--clay-deep);font-weight:600;font-size:13px;padding:10px 0 4px;list-style:none">▸ By country</summary>${detail}</details>`;
  }

  // Hourly
  const hourly = (data && data.hourly) || [];
  const hasHours = hourly.some((h) => h.pageViews > 0);
  if (!hasHours) { el("tf-hourly").innerHTML = box("No hourly data " + (label === "today" ? "today yet" : "") + "."); }
  else {
    const hMax = Math.max(...hourly.map((h) => h.pageViews), 1);
    const hLabel = (h) => { const ap = h < 12 ? "a" : "p"; let hr = h % 12; if (hr === 0) hr = 12; return `${hr}${ap}`; };
    el("tf-hourly").innerHTML = `<div style="display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:12px;padding-top:8px">${hourly.map((h) => `
      <div title="${hLabel(h.hour)} · ${N(h.pageViews)} views" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0">
        <span style="width:70%;background:var(--accent);border-radius:2px 2px 0 0;height:${Math.max(2, Math.round((h.pageViews / hMax) * 90))}px"></span>
        ${h.hour % 3 === 0 ? `<span style="font-size:9px;color:var(--ink-soft);white-space:nowrap">${hLabel(h.hour)}</span>` : `<span style="font-size:9px">&nbsp;</span>`}
      </div>`).join("")}</div>`;
  }
}

// Server-side first-party log → channels + per-page traffic (with avg time).
function renderOwned(data, label) {
  const channels = (data && data.channels) || [];
  const empty = "No visitors logged " + (label === "today" ? "today yet" : "in this range") + " — the first-party log fills in as visitors arrive.";
  const color = (name) => {
    const k = (name || "").toLowerCase();
    if (k.includes("google ads")) return "#2563EB";
    if (k.includes("google")) return "#15803D";
    if (k.includes("facebook") || k.includes("insta")) return "#7C3AED";
    if (k.includes("ai")) return "#0D9488";
    if (k === "direct") return "#94A3B8";
    return "var(--accent)";
  };
  if (!channels.length) { el("tf-channels").innerHTML = box(empty); }
  else {
    const chTotal = channels.reduce((s, c) => s + c.n, 0) || 1;
    const chMax = channels[0] ? channels[0].n : 1;
    el("tf-channels").innerHTML = collapse(channels.map((c) => `
      <div style="display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-soft)">
        <span style="min-width:150px;font-size:13px;color:var(--ink);font-weight:600">${SSCrm.esc(c.channel || "Unknown")}</span>
        <span style="flex:1;height:8px;background:var(--bg-soft);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;background:${color(c.channel)};width:${Math.round((c.n / chMax) * 100)}%"></span></span>
        <span style="font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);min-width:40px;text-align:right">${N(c.n)}</span>
        <span style="font-variant-numeric:tabular-nums;color:var(--ink-soft);min-width:40px;text-align:right;font-size:12px">${Math.round((c.n / chTotal) * 100)}%</span>
      </div>`), "channels") +
      `<p class="muted" style="font-size:12px;margin:12px 0 0">${data.view === "all" ? `Every HTML request the edge logged ${label}, <strong>${N(data.entries)}</strong> session entries — bots included, so "Direct" runs high.` : `<strong>${N(data.entries)}</strong> real visitor entries ${label}${data.tn ? ", Tennessee only" : ""} — counted from the on-page beacon that only a real browser fires. ${data.since ? "Channels have been recorded this way since " + SSCrm.esc(String(data.since).slice(0, 10)) + "." : ""}`}</p>`;
  }

  const engByPath = (data && data.engByPath) || {};
  const pages = (data && data.pages) || [];
  if (!pages.length) { el("tf-pages").innerHTML = box(empty); }
  else {
    const pgMax = pages[0] ? pages[0].n : 1;
    const pretty = (p) => p === "/" ? "/ (home)" : p;
    el("tf-pages").innerHTML =
      `<div style="display:flex;align-items:center;gap:12px;padding:0 0 4px;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:700">
        <span style="min-width:180px;max-width:180px">Page</span><span style="flex:1"></span>
        <span style="min-width:44px;text-align:right">Views</span><span style="min-width:64px;text-align:right">Avg time</span>
      </div>` +
      collapse(pages.map((pg) => `
      <div style="display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-soft)">
        <span style="min-width:180px;max-width:180px;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${SSCrm.esc(pg.path)}">${SSCrm.esc(pretty(pg.path))}</span>
        <span style="flex:1;height:8px;background:var(--bg-soft);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;background:var(--accent);width:${Math.round((pg.n / pgMax) * 100)}%"></span></span>
        <span style="font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);min-width:44px;text-align:right">${N(pg.n)}</span>
        <span style="font-variant-numeric:tabular-nums;color:var(--ink-soft);min-width:64px;text-align:right;font-size:12px" title="Average active time on this page">${fmtDur(engByPath[pg.path])}</span>
      </div>`), "pages") +
      `<p class="muted" style="font-size:12px;margin:12px 0 0">Pageviews per page ${label} — <strong>real US visitors, excluding CRM and bots</strong>. Total: <strong>${N(data.visits)}</strong> · site-wide avg time on page: <strong>${data.eng_samples ? fmtDur(data.avg_seconds) : "collecting…"}</strong>.</p>`;
  }
}
})();


/* ---- Cap every list at a few rows -----------------------------------------
 *
 * A dashboard where one panel runs forty rows and its neighbour runs three is
 * unreadable: the sections stop being comparable and the page becomes a scroll.
 * Every table and bar list shows its top five and hides the rest behind a
 * count, so panels stay the same rough height and the whole page fits.
 *
 * Runs after each render, and is idempotent — re-rendering re-caps rather than
 * stacking a second button.
 */
(function () {
  var SHOW = 5;

  function cap(root) {
    var lists = (root || document).querySelectorAll('table tbody, ol.bars, ul.bars');
    Array.prototype.forEach.call(lists, function (list) {
      if (list.dataset.capped === '1') return;
      var rows = Array.prototype.filter.call(list.children, function (n) {
        return n.tagName === 'TR' || n.tagName === 'LI';
      });
      if (rows.length <= SHOW + 1) { list.dataset.capped = '1'; return; }

      rows.forEach(function (r, i) { if (i >= SHOW) r.classList.add('row-hidden'); });

      var host = list.tagName === 'TBODY' ? list.closest('table').parentNode : list.parentNode;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'rows-more';
      var hidden = rows.length - SHOW;
      btn.textContent = 'Show all ' + rows.length;
      btn.addEventListener('click', function () {
        var nowHidden = list.querySelector('.row-hidden');
        rows.forEach(function (r, i) {
          if (i >= SHOW) r.classList.toggle('row-hidden', !nowHidden);
        });
        btn.textContent = nowHidden ? 'Show top ' + SHOW : 'Show all ' + rows.length;
      });
      if (host) host.insertBefore(btn, list.tagName === 'TBODY' ? null : list.nextSibling);
      list.dataset.capped = '1';
    });
  }

  window.capRows = cap;
  /* Panels are filled asynchronously, so cap on a settle rather than once. */
  var t = null;
  new MutationObserver(function () {
    clearTimeout(t);
    t = setTimeout(function () { cap(document); }, 120);
  }).observe(document.body, { childList: true, subtree: true });
  cap(document);
})();


function renderGa4(ga) {
  var asof = document.getElementById('ga4-asof');
  var tiles = document.getElementById('ga4-tiles');
  var chans = document.getElementById('ga4-channels');
  if (!asof) return;

  if (!ga || !ga.measurementId) {
    asof.textContent = 'Not connected on this site yet.';
    tiles.innerHTML = ''; chans.innerHTML = '';
    return;
  }
  /* The tag is live and Google is recording, but nothing has ever copied those
     figures into this dashboard's database. Worth saying plainly: the message
     below would blame Analytics for a pipeline that was never pointed at this
     site, and the two faults have completely different fixes. */
  if (ga.ingested === false) {
    asof.textContent = 'Google\u2019s tag (' + ga.measurementId + ') is live on the site and recording. '
      + 'Those figures are not being copied into this dashboard yet \u2014 this site\u2019s Analytics '
      + 'property has not been connected to the nightly ingest. The numbers do exist in Analytics itself.';
    tiles.innerHTML = ''; chans.innerHTML = '';
    return;
  }
  if (!ga.days || !ga.days.length) {
    asof.textContent = 'Connected as ' + ga.measurementId + '. No figures yet \u2014 Analytics needs about '
      + 'a day after the tag goes live, and a new property longer than that.';
    tiles.innerHTML = ''; chans.innerHTML = '';
    return;
  }

  var sum = function (k) {
    return ga.days.reduce(function (a, d) { return a + (Number(d[k]) || 0); }, 0);
  };
  asof.textContent = 'Measured by Google\u2019s own tag (' + ga.measurementId + ')'
    + (ga.asOf ? ', to ' + ga.asOf : '') + '.';
  tiles.innerHTML = [
    ['Sessions', sum('sessions')], ['Users', sum('users')], ['Page views', sum('views')],
  ].map(function (p) {
    /* The same tile markup the ranking bands use, so the two blocks in this
       section look like one thing rather than two designs. */
    return '<div class="rk__b"><div class="rk__n">' + p[1].toLocaleString()
      + '</div><div class="rk__l">' + p[0] + '</div></div>';
  }).join('');

  chans.innerHTML = !(ga.channels && ga.channels.length) ? '' :
    '<p class="hint" style="margin:1rem 0 .5rem">How Analytics attributed those sessions. It groups '
    + 'differently from the section above, so the two will not match line for line.</p>'
    + '<table class="tbl"><thead><tr><th>Channel</th><th class="n">Sessions</th></tr></thead><tbody>'
    + ga.channels.slice(0, 8).map(function (c) {
        return '<tr><td>' + esc(c.channel) + '</td><td class="n">'
          + (Number(c.sessions) || 0).toLocaleString() + '</td></tr>';
      }).join('')
    + '</tbody></table>';
}

/* Analytics cards: one metric by one dimension, each row a bar against the
   biggest in its own card, plus the change against the period before. Google's
   card shape, drawn in this page's furniture rather than the network
   dashboard's — same data and same arithmetic, this site's look. */
function gaBars(rows, dimLabel, metricLabel, limit) {
  if (!rows || !rows.length) return box("Nothing recorded in this period yet.");
  const top = rows.slice(0, limit || 8);
  const max = Math.max(...top.map((r) => Number(r.value) || 0), 1);
  /* A rise from nothing is "new", not "+100%" — a percentage needs a
     denominator that actually existed. */
  const delta = (cur, prev) => {
    cur = Number(cur) || 0; prev = Number(prev) || 0;
    if (!prev) return cur ? { txt: "new", col: "#1a7f37" } : null;
    const pc = ((cur - prev) / prev) * 100;
    if (Math.abs(pc) < 0.5) return { txt: "no change", col: "var(--ink-soft)" };
    return { txt: (pc > 0 ? "\u25b2" : "\u25bc") + " " + Math.abs(pc).toFixed(0) + "%",
             col: pc > 0 ? "#1a7f37" : "#b42318" };
  };
  const head = `<div style="display:flex;gap:10px;padding:0 0 6px;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em">`
    + `<span style="flex:1">${rkEsc(dimLabel)}</span><span>${rkEsc(metricLabel)}</span></div>`;
  return head + top.map((r) => {
    const v = Number(r.value) || 0;
    const d = delta(v, r.prev);
    return `<div style="padding:7px 0;border-bottom:1px solid var(--line-soft)">
        <div style="display:flex;align-items:baseline;gap:10px">
          <span style="flex:1;font-size:13px;color:var(--ink);overflow-wrap:anywhere">${rkEsc(r.label)}</span>
          <span style="font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);font-size:13px">${N(v)}</span>
          <span style="font-size:11px;min-width:64px;text-align:right;color:${d ? d.col : "transparent"}">${d ? d.txt : "&nbsp;"}</span>
        </div>
        <div style="margin-top:5px;height:6px;background:var(--bg-soft);border-radius:3px;overflow:hidden"><span style="display:block;height:100%;background:var(--accent);width:${Math.max(2, Math.round((v / max) * 100))}%"></span></div>
      </div>`;
  }).join("");
}

function renderGa4Cards(ga) {
  const CARDS = [
    ["ga4-pages",     "page",    "Page",    "Views"],
    ["ga4-channels",  "channel", "Channel", "Visits"],
    ["ga4-events",    "event",   "Event",   "Count"],
    ["ga4-newusers",  "newuser", "Channel", "New visitors"],
    ["ga4-devices",   "device",  "Device",  "Visits"],
    ["ga4-countries", "country", "Country", "Visitors"],
  ];
  const dims = (ga && ga.dims) || {};
  const live = !!(ga && ga.measurementId && ga.ingested !== false);
  for (const [id, kind, dimLabel, metricLabel] of CARDS) {
    const host = el(id);
    if (!host) continue;
    /* Nothing ingested yet: the panel above already explains why, and six cards
       each saying "nothing recorded" would read as six more faults. */
    const panel = el(id + "-panel");
    if (panel) panel.hidden = !live;
    if (!live) continue;
    const rows = dims[kind] || [];
    /* Channels are drawn by renderGa4 as well, from the daily table. Only
       replace that when the dimension rows are really present, so a site
       ingested before ga4_dims existed keeps the table it already has. */
    if (!rows.length && host.innerHTML.trim()) continue;
    host.innerHTML = gaBars(rows, dimLabel, metricLabel, 8);
  }
}

</script>
