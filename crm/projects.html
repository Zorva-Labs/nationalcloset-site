<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Jobs · National Closet Company CRM</title><meta name="robots" content="noindex, nofollow"/>
<link rel="stylesheet" href="/crm/crm-app.css?v=ncc31"/></head>
<body>
<script src="/crm/crm-app.js?v=ncc31"></script>
<script>
// A project only counts as a "Job" once the contract is signed AND the deposit
// is paid (status 'contracted'). Until then the deal stays a LEAD in the
// proposal stage (project 'proposed' / lead 'proposal') — those live on their
// lead and aren't shown here.
//
// The sidebar Jobs drill-down (see crm-app.js JOB_STATUSES_NAV) deep-links
// here with ?status=contracted | scheduled_install | installing | completed — when present we
// filter the list down to that single status (mirrors how the Leads page
// honors ?status=).
const JOB_STATUSES = new Set(["contracted", "scheduled_install", "installing", "completed"]);
const JOB_STATUS_LABELS = { contracted: "Booked", scheduled_install: "Scheduled", installing: "Installing", completed: "Completed" };

(async () => {
  const params = new URLSearchParams(location.search);
  const filterStatus = params.get("status");
  const subtitle = filterStatus && JOB_STATUSES.has(filterStatus)
    ? `${JOB_STATUS_LABELS[filterStatus] || filterStatus} jobs`
    : "Booked work — contract signed";

  const user = await SSCrm.mount({ title: "Jobs", subtitle,
    actions: `${filterStatus ? `<a class="btn ghost" href="/crm/projects.html">← All jobs</a>` : ""}<a class="btn secondary" href="/crm/pipeline.html">Pipeline (all stages) →</a>`,
    wide: true });
  if (!user) return;
  const { projects: all } = await SSCrm.fetchJSON("/api/projects");
  let projects = all.filter((p) => JOB_STATUSES.has(p.status));
  if (filterStatus && JOB_STATUSES.has(filterStatus)) {
    projects = projects.filter((p) => p.status === filterStatus);
  }
  const page = document.getElementById("page");
  if (!projects.length) {
    const pending = all.length - all.filter((p) => JOB_STATUSES.has(p.status)).length;
    page.innerHTML = `<div class="tbl"><div class="empty">
      ${filterStatus ? `No ${JOB_STATUS_LABELS[filterStatus] || filterStatus} jobs.` : "No booked jobs yet."}
      ${!filterStatus && pending > 0 ? `<div style="margin-top:8px;font-size:13px">${pending} project${pending === 1 ? " is" : "s are"} in flight on the lead side — they'll appear here once the customer signs.</div>` : ""}
    </div></div>`;
    return;
  }
  page.innerHTML = `<div class="tbl"><table>
    <thead><tr><th>Client</th><th>Email</th><th>Phone</th><th>City</th><th class="money">Total</th><th class="money">Net profit</th><th class="money">Balance</th><th>Status</th><th>Install date</th><th>Updated</th></tr></thead>
    <tbody>${projects.map((p) => {
      const total = p.job_total_cents;
      const balance = total != null ? Math.max(0, total - (p.paid_cents || 0)) : null;
      const balanceCell = balance == null
        ? `<span class="muted">—</span>`
        : balance === 0
          ? `<span style="color:#10B981;font-weight:600">Paid</span>`
          : SSCrm.fmtMoney(balance);
      return `<tr class="clickable" onclick="location.href='/crm/project.html?id=${p.id}'">
      <td><strong>${SSCrm.esc(p.contact_name || "—")}</strong></td>
      <td>${p.contact_email ? `<a href="mailto:${SSCrm.esc(p.contact_email)}" onclick="event.stopPropagation()">${SSCrm.esc(p.contact_email)}</a>` : `<span class="muted">—</span>`}</td>
      <td>${p.contact_phone ? `<a href="tel:${SSCrm.esc(p.contact_phone)}" onclick="event.stopPropagation()">${SSCrm.esc(p.contact_phone)}</a>` : `<span class="muted">—</span>`}</td>
      <td>${p.contact_city ? SSCrm.esc(p.contact_city) : `<span class="muted">—</span>`}</td>
      <td class="money">${total != null ? SSCrm.fmtMoney(total) : `<span class="muted">—</span>`}</td>
      <td class="money">${p.net_profit_cents != null ? `<span style="color:#15803D;font-weight:600">${SSCrm.fmtMoney(p.net_profit_cents)}</span>` : `<span class="muted">—</span>`}</td>
      <td class="money">${balanceCell}</td>
      <td>${SSCrm.pill(p.status)}</td>
      <td>${p.install_date ? SSCrm.fmtDay(p.install_date) : `<span class="muted">—</span>`}</td>
      <td class="muted">${SSCrm.fmtDate(p.updated_at)}</td>
    </tr>`;
    }).join("")}</tbody></table></div>`;
})();
</script></body></html>
