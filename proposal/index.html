<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Your Proposal · National Closet Company</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" type="image/png" href="/img/favicon-ncc.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --ink:#16140F; --ink-soft:#3A362F; --muted:#6C665B;
      --paper:#FAF9F6; --fog:#EDECE8; --line:#E3E1DC; --line-soft:#EDECE8;
      --clay:#D2683F; --clay-deep:#B9542F; --clay-wash:#F6E6DF;
      --font:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.55}
    a{color:var(--clay-deep)}
    .doc{max-width:1040px;margin:0 auto;padding:clamp(32px,6vw,72px) clamp(18px,4vw,40px) 80px}
    .doc-mast{display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:34px;gap:16px;flex-wrap:wrap}
    .doc-brand{display:flex;align-items:center;gap:12px}
    .doc-brand img{height:46px;width:auto;display:block}
    .doc-brand b{font-family:var(--font);font-weight:800;font-size:1.05rem;letter-spacing:-0.01em;line-height:1.1}
    .doc-brand small{display:block;font-weight:600;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:2px}
    .doc-num{font-weight:700;font-size:.82rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
    .doc h1{font-family:var(--font);font-weight:800;font-size:clamp(2.1rem,5.5vw,3.4rem);letter-spacing:-0.03em;line-height:1.02;margin:0 0 16px}
    .doc h1 em{color:var(--clay);font-style:normal}
    .doc-intro{font-size:1.08rem;line-height:1.6;color:var(--ink-soft);max-width:64ch;margin:0 0 44px;border-left:3px solid var(--clay);padding-left:16px}
    .opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-bottom:34px}
    .opt{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;cursor:pointer;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .2s;position:relative;min-width:0}
    .opt:hover{transform:translateY(-4px);box-shadow:0 22px 44px -26px rgba(20,18,14,.45);border-color:var(--clay)}
    .opt.is-picked{border-color:var(--clay);border-width:2px;box-shadow:0 22px 44px -22px rgba(210,104,63,.55);background:#fffdfb}
    .opt.is-picked::after{content:"✓ Selected";position:absolute;top:-11px;right:18px;background:var(--clay);color:#fff;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px}
    .opt__label{font-weight:800;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--clay-deep);margin-bottom:8px}
    .opt__title{font-family:var(--font);font-weight:800;font-size:1.22rem;letter-spacing:-0.02em;line-height:1.18;margin:0 0 14px;color:var(--ink);overflow-wrap:anywhere}
    .opt__total{font-family:var(--font);font-weight:800;font-size:2.1rem;letter-spacing:-0.03em;color:var(--ink);margin-bottom:14px;font-variant-numeric:tabular-nums}
    .opt__total .sub{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
    .opt__desc{color:var(--muted);font-size:.95rem;margin-bottom:14px}
    .opt__lines{list-style:none;padding:0;margin:0 0 6px;flex:1}
    .opt__lines li{padding:9px 0;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--ink-soft)}
    .opt__lines li:last-child{border-bottom:0}
    .opt__lines .ln-money{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700;flex-shrink:0}
    .opt__empty{color:var(--muted);font-size:.9rem;font-style:italic;padding:8px 0 4px}
    .opt__sum{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
    .opt__sum-row{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--ink-soft);padding:3px 0;font-variant-numeric:tabular-nums}
    .opt__sum-total{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font-weight:800;font-size:1.05rem;color:var(--ink)}
    .pay-note{margin:0 0 30px;padding:13px 16px;background:var(--fog);border-radius:10px;color:var(--ink-soft);font-size:.86rem;line-height:1.6;text-align:center}
    .pay-note strong{color:var(--ink)}
    /* Everything the price already covers — the bundle is the selling point, so
       name each piece instead of hiding it inside one number. */
    .incl{border:1.5px solid var(--line);border-radius:12px;padding:20px clamp(18px,3vw,26px);margin:0 0 18px;background:#fff}
    .incl__t{font-family:var(--font);font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--clay-deep);margin:0 0 14px}
    .incl__list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px 18px}
    .incl__list li{display:flex;align-items:flex-start;gap:9px;font-size:.92rem;color:var(--ink-soft);line-height:1.45}
    .incl__list .tick{flex:none;width:19px;height:19px;border-radius:50%;background:var(--clay-wash);color:var(--clay-deep);display:grid;place-items:center;font-size:.62rem;font-weight:800;margin-top:1px}
    .incl__foot{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);font-size:.84rem;color:var(--muted);text-align:center}
    .incl__foot strong{color:var(--ink)}
    /* Only rendered when no option carries a discount — see anyDiscount below. */
    .nodisc{border-left:3px solid var(--clay);padding:2px 0 2px 16px;margin:0 0 22px}
    .nodisc__t{font-family:var(--font);font-weight:800;font-size:.95rem;letter-spacing:-.01em;color:var(--ink);margin:0 0 5px}
    .nodisc p{color:var(--ink-soft);font-size:.9rem;line-height:1.6;margin:0;max-width:66ch}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-family:var(--font);font-weight:700;font-size:.95rem;border:0;border-radius:7px;padding:13px 22px;cursor:pointer;min-height:48px;transition:transform .25s cubic-bezier(.22,1,.36,1),background .2s}
    .opt-btn{margin-top:20px;width:100%;background:var(--ink);color:#fff}
    .opt:hover .opt-btn{background:#000}
    .opt.is-picked .opt-btn{background:var(--clay)}
    .opt.is-picked .opt-btn:hover{background:var(--clay-deep)}
    .accept{background:var(--ink);color:var(--paper);padding:36px clamp(22px,4vw,40px);border-radius:14px;margin-top:36px;text-align:center}
    .accept h2{font-family:var(--font);font-weight:800;font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-0.02em;color:#fff;margin:0 0 8px}
    .accept p{color:#cbc6bc;margin:0 0 22px;max-width:52ch;margin-left:auto;margin-right:auto}
    .accept__form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:520px;margin:0 auto}
    .accept__form input{flex:1;min-width:200px;font-family:var(--font);font-size:1rem;padding:13px 15px;border-radius:7px;border:1.5px solid #2a261f;background:#211d17;color:#fff;min-height:48px}
    .accept__form input::placeholder{color:#8a857b}
    .accept__form input:focus{outline:none;border-color:var(--clay)}
    .accept-btn{background:var(--clay);color:#fff;white-space:nowrap}
    .accept-btn:hover{background:var(--clay-deep);transform:translateY(-2px)}
    .accept--soft{background:var(--fog);color:var(--ink-soft)}
    .accept--soft h2{color:var(--ink)}
    .accept--soft p{color:var(--muted)}
    .accept--soft a{color:var(--clay-deep);font-weight:700}
    .expiry-bar{display:flex;align-items:flex-start;gap:12px;background:var(--clay-wash);border:1px solid #EBC7B7;border-left:4px solid var(--clay);border-radius:10px;padding:14px 18px;margin:0 0 34px;color:var(--ink-soft);font-size:.92rem;line-height:1.55}
    .expiry-bar .clock{font-size:1.15rem;line-height:1.3;flex-shrink:0}
    .expiry-bar b{color:var(--clay-deep)}
    /* Optional per-proposal incentive. Sits directly under the expiry bar so the
       offer deadline and the quote deadline read as one date, not two clocks. */
    .promo-bar{display:flex;align-items:flex-start;gap:13px;background:var(--ink);border-radius:10px;padding:16px 20px;margin:0 0 34px;color:#fff;font-size:.95rem;line-height:1.55}
    .expiry-bar + .promo-bar{margin-top:-22px}   /* same deadline — keep them paired */
    .promo-bar .gift{font-size:1.25rem;line-height:1.25;flex-shrink:0}
    .promo-bar .tag{display:block;font-size:.62rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);margin-bottom:3px}
    .expired-card{background:#fff;border:1.5px solid var(--line);border-top:5px solid var(--clay);border-radius:14px;padding:clamp(26px,4vw,42px);margin-top:12px;text-align:center}
    .expired-card .badge{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--clay-deep);background:var(--clay-wash);padding:6px 13px;border-radius:100px;margin-bottom:16px}
    .expired-card h2{font-family:var(--font);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.2rem);letter-spacing:-0.02em;margin:0 0 14px;color:var(--ink)}
    .expired-card p{color:var(--ink-soft);font-size:1.03rem;line-height:1.62;max-width:56ch;margin:0 auto 14px}
    .expired-card textarea{width:100%;max-width:520px;margin:18px auto 0;display:block;font-family:var(--font);font-size:.98rem;padding:12px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-height:84px;resize:vertical;box-sizing:border-box}
    .expired-card .btn{background:var(--clay);color:#fff;margin-top:18px}
    .expired-card .btn:hover{background:var(--clay-deep);transform:translateY(-2px)}
    .status{padding:28px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--clay);border-radius:10px;margin-top:34px}
    .status h2{font-family:var(--font);font-weight:800;font-size:1.4rem;letter-spacing:-0.02em;margin:0 0 8px;color:var(--ink)}
    .status p{color:var(--ink-soft);margin:0}
    .doc-foot{margin-top:48px;padding-top:22px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.85rem;line-height:1.7}
    .doc-foot a{color:var(--clay-deep);text-decoration:none;font-weight:600}
    .spin{display:inline-block;width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--clay);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .err{color:var(--clay-deep);text-align:center;padding:48px 20px;font-weight:600}
  </style>
</head>
<body>
<main class="doc" id="root"><p style="text-align:center;color:var(--muted);padding:60px 0"><span class="spin"></span></p></main>
<script>
const token = new URLSearchParams(location.search).get("t");
if (!token) document.getElementById("root").innerHTML = `<p class="err">Missing proposal link.</p>`;
else load();

let proposal = null;
async function load() {
  try {
    const data = await (await fetch("/api/public/proposal/" + token)).json();
    if (data.error) throw new Error(data.error);
    proposal = data.proposal;
    render(data.proposal, data.tiers, data.attachments || []);
  } catch (e) { document.getElementById("root").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

const EXPIRY_DAYS = 2;
function isExpired(p) {
  if (p.status === "accepted" || p.status === "declined") return false;
  if (p.expired === true || p.status === "expired") return true;
  if (!p.valid_until) return false;
  const s = String(p.valid_until).trim();
  const iso = s.includes("T") ? s : s.replace(" ", "T") + (s.length <= 10 ? "T00:00:00Z" : "Z");
  const d = new Date(iso);
  return !isNaN(d.getTime()) && d.getTime() <= Date.now();
}
function expiryDateStr(p) {
  if (!p.valid_until) return "";
  const s = String(p.valid_until).trim();
  const iso = s.includes("T") ? s : s.replace(" ", "T") + (s.length <= 10 ? "T00:00:00Z" : "Z");
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "America/Chicago" });
}

function renderExpired(p) {
  document.title = `${p.number} · Proposal expired · National Closet Company`;
  document.getElementById("root").innerHTML = `
    <div class="doc-mast">
      <div class="doc-brand">
        <img src="/img/ncc-logo-nc.png" alt="National Closet Company"/>
        <div><b>National Closet Co.</b><small>Custom Closets &amp; Closet Systems</small></div>
      </div>
      <div class="doc-num">${esc(p.number)}</div>
    </div>
    <div class="expired-card">
      <div class="badge">Proposal expired</div>
      <h2>This proposal has expired</h2>
      <p>Prices for materials, shipping, and labor can change from week to week, so we're only able to guarantee a quote for <strong>${EXPIRY_DAYS} days</strong> from the day it's sent. This proposal (<strong>${esc(p.number)}</strong>) has now passed that window.</p>
      <p>No problem at all — we'd be glad to put together fresh pricing for you. Tell us anything that's changed (optional) and we'll send an updated proposal right away.</p>
      <textarea id="req-msg" placeholder="Anything you'd like us to know? (optional)"></textarea>
      <button class="btn" type="button" onclick="requestUpdate()">Request an updated proposal</button>
      <p style="margin-top:22px;font-size:.9rem;color:var(--muted)">Prefer to talk it through? Call or text <a href="tel:+16292988241">629-298-8241</a>.</p>
    </div>
    <div class="doc-foot">
      National Closet Company · Custom Closets &amp; Closet Systems<br/>
      <a href="tel:+16292988241">629-298-8241</a> · <a href="mailto:hello@nationalclosetco.com">hello@nationalclosetco.com</a> · <a href="https://nationalclosetco.com">nationalclosetco.com</a>
    </div>`;
}

async function requestUpdate() {
  const btn = document.querySelector(".expired-card .btn");
  const msg = (document.getElementById("req-msg") || {}).value || "";
  if (btn) { btn.disabled = true; btn.textContent = "Sending…"; }
  try {
    const res = await fetch("/api/public/proposal/" + token, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "request_update", message: msg }) });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || "Could not send your request."); }
    document.querySelector(".expired-card").innerHTML = `
      <div class="badge">Request sent</div>
      <h2>Thanks — we're on it.</h2>
      <p>We've got your request and will send over an updated proposal shortly. Keep an eye on your inbox, or call/text us at <a href="tel:+16292988241">629-298-8241</a> if you'd like to chat sooner.</p>`;
  } catch (e) { alert(e.message); if (btn) { btn.disabled = false; btn.textContent = "Request an updated proposal"; } }
}

function render(p, tiers, attachments) {
  attachments = attachments || [];
  if (isExpired(p)) { renderExpired(p); return; }
  const isAccepted = p.status === "accepted";
  const many = (tiers || []).length > 1;
  // Never claim "no discount" on a quote that has one: a discount shows up as
  // the gap between an option's pre-discount subtotal and what the client pays.
  const anyDiscount = (tiers || []).some((t) => (t.subtotal_cents || 0) > (t.total_cents || 0));
  const expDate = expiryDateStr(p);
  document.title = `${p.number} · Your Proposal · National Closet Company`;
  document.getElementById("root").innerHTML = `
    <div class="doc-mast">
      <div class="doc-brand">
        <img src="/img/ncc-logo-nc.png" alt="National Closet Company"/>
        <div><b>National Closet Co.</b><small>Custom Closets &amp; Closet Systems</small></div>
      </div>
      <div class="doc-num">${esc(p.number)}</div>
    </div>

    <h1>Your custom closet <em>proposal</em>.</h1>
    ${p.intro ? `<p class="doc-intro">${esc(p.intro)}</p>` : ""}
    ${(!isAccepted && expDate) ? `<div class="expiry-bar"><span class="clock">⏳</span><span><b>This proposal expires ${expDate}.</b> Prices for materials, shipping, and labor can change from week to week, so we can only hold this pricing for ${EXPIRY_DAYS} days from the day it was sent. Accept before then to lock it in.</span></div>` : ""}
    ${(!isAccepted && p.promo_note) ? `<div class="promo-bar"><span class="gift">🎁</span><span><span class="tag">Limited-time offer</span>${esc(p.promo_note)}</span></div>` : ""}

    <div class="opt-grid">${tiers.map((t, i) => `
      <div class="opt ${p.selected_tier === t.tier ? "is-picked" : ""}" data-tier="${esc(t.tier)}" ${isAccepted ? "" : `onclick="pickTier('${esc(t.tier)}')" role="button" tabindex="0"`}>
        ${p.selected_tier === t.tier ? `<div class="opt__label" style="color:var(--clay-deep)">✓ Your selection</div>` : (t.title ? "" : `<div class="opt__label">${many ? "Option " + (i + 1) : "Your proposal"}</div>`)}
        <h3 class="opt__title">${esc(t.title || (many ? "Option " + (i + 1) : "Your proposal"))}</h3>
        <div class="opt__total">${money(t.total_cents)} ${t.total_cents ? `<span class="sub">total</span>` : ""}</div>
        ${t.description ? `<div class="opt__desc">${esc(t.description)}</div>` : ""}
        ${(t.lines && t.lines.length) ? `<ul class="opt__lines">${t.lines.map((l) => { const disc = (l.line_total_cents || 0) < 0; return `<li${disc ? ` style="color:var(--clay-deep);font-weight:600"` : ""}><span>${esc(l.description)}${l.room ? ` <em style="color:var(--muted);font-size:.85em;font-style:normal">— ${esc(l.room)}</em>` : ""}</span><span class="ln-money">${disc ? "−" + money(Math.abs(l.line_total_cents)) : money(l.line_total_cents)}</span></li>`; }).join("")}</ul>
        <div class="opt__sum">
          <div class="opt__sum-row opt__sum-total"><span>Total</span><span>${money(t.total_cents)}</span></div>
          <div class="opt__sum-row" style="border:0;color:var(--muted);font-size:.82rem;font-weight:500"><span>Includes shipping, tax &amp; installation</span><span></span></div>
          ${(() => {
            const s = scheduleFor((t.subtotal_cents || 0) > (t.total_cents || 0) ? t.subtotal_cents : t.total_cents, t.total_cents);
            const soft = `style="border:0;color:var(--muted);font-size:.82rem;font-weight:500"`;
            return `<div class="opt__sum-row" style="margin-top:6px"><span>Due at signing</span><span>${money(s.deposit)}</span></div>
          <div class="opt__sum-row" ${soft}><span>Due when install is scheduled</span><span>${money(s.atScheduling)}</span></div>
          <div class="opt__sum-row" ${soft}><span>Due day of install</span><span>${money(s.atInstall)}</span></div>
          <div class="opt__sum-row" ${soft}><span>— or pay in full anytime</span><span>${money(t.total_cents)}</span></div>`;
          })()}
        </div>` : `<div class="opt__empty">Itemized details to follow.</div>`}
        ${!isAccepted ? `<button class="btn opt-btn" type="button" onclick="event.stopPropagation();pickTier('${esc(t.tier)}')">${p.selected_tier === t.tier ? "✓ Selected" : (many ? "Choose this option" : "Select")}</button>` : ""}
      </div>`).join("")}
    </div>

    <div class="incl">
      <h3 class="incl__t">Included — at no extra charge</h3>
      <ul class="incl__list">
        <li><span class="tick">✓</span><span>In-home design consultation &amp; measure</span></li>
        <li><span class="tick">✓</span><span>Delivery &amp; shipping</span></li>
        <li><span class="tick">✓</span><span>Sales tax</span></li>
        <li><span class="tick">✓</span><span>Professional installation by our own crew</span></li>
        <li><span class="tick">✓</span><span>1-year workmanship guarantee</span></li>
        <li><span class="tick">✓</span><span>Full manufacturer warranty on components</span></li>
      </ul>
      <p class="incl__foot">Six things other companies quote as add-ons. Your price above already covers all of them — <strong>no hidden fees, nothing billed later</strong>.</p>
    </div>

    ${!anyDiscount ? `
    <div class="nodisc">
      <h3 class="nodisc__t">Why there's no discount on this quote</h3>
      <p>We price the job once, at the number we can actually do it for. There's no inflated &ldquo;before&rdquo; price to knock down, and nothing to unlock by signing tonight. What you see above is our best price &mdash; first time, every time.</p>
    </div>` : ""}

    <p class="pay-note">Your price is all-inclusive, with no hidden fees. You pay in three steps: <strong>50% at signing</strong> (a little more if that's what it takes to cover your materials &amp; shipping) to release your order to the manufacturer, <strong>25% once your materials arrive and we schedule your install</strong>, and the final <strong>25% the day of installation</strong> — or you can pay in full anytime. Pay securely by card, bank transfer (ACH), digital wallet or <strong>Klarna</strong> (buy now, pay later), with no added processing fee.</p>

    ${p.job_notes ? `
      <div style="margin-top:24px;background:var(--fog);border-radius:12px;padding:20px clamp(18px,3vw,26px)">
        <h2 style="font-family:var(--font);font-weight:800;font-size:1.15rem;margin:0 0 8px;color:var(--ink)">What's included</h2>
        <div style="color:var(--ink-soft);font-size:.97rem;line-height:1.6;white-space:pre-wrap">${esc(p.job_notes)}</div>
      </div>` : ""}

    ${isAccepted ? `
      <div class="status">
        <h2>Accepted — thank you!</h2>
        <p>We'll send your contract over shortly to sign and book the job. Questions? Call or text <a href="tel:+16292988241">629-298-8241</a>.</p>
      </div>
    ` : (p.selected_tier ? `
      <div class="accept">
        <h2>Ready to book it?</h2>
        <p>Type your full name to accept this proposal — we'll prepare your contract to sign and reserve your install.</p>
        <div class="accept__form">
          <input id="accept-name" type="text" placeholder="Your full name" autocomplete="name" onkeydown="if(event.key==='Enter')accept()"/>
          <button class="btn accept-btn" type="button" onclick="accept()">Accept &amp; book →</button>
        </div>
      </div>` : `
      <div class="accept accept--soft">
        <h2>${many ? "Choose an option above to continue" : "Select your proposal above to continue"}</h2>
        <p>Or call/text us at <a href="tel:+16292988241">629-298-8241</a> with any questions.</p>
      </div>`)}

    <div class="doc-foot">
      National Closet Company · Custom Closets &amp; Closet Systems<br/>
      <a href="tel:+16292988241">629-298-8241</a> · <a href="mailto:hello@nationalclosetco.com">hello@nationalclosetco.com</a> · <a href="https://nationalclosetco.com">nationalclosetco.com</a>
    </div>
  `;
}

async function pickTier(tier) {
  try {
    const res = await fetch("/api/public/proposal/" + token, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "select_tier", tier }) });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || "Could not select that option."); }
    await load();
  } catch (e) { alert(e.message); }
}

async function accept() {
  const input = document.getElementById("accept-name");
  const name = (input && input.value || "").trim();
  if (!name) { if (input) input.focus(); alert("Please type your full name to accept."); return; }
  const initialsEl = document.getElementById("accept-initials");
  const initials = initialsEl ? initialsEl.value.trim() : "";
  if (initialsEl && !initials) { initialsEl.focus(); alert("Please enter your initials to confirm the attached drawings are of your project."); return; }
  try {
    const res = await fetch("/api/public/proposal/" + token, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "accept", name, initials }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not accept.");
    if (data.contract_token) {
      document.getElementById("root").innerHTML = `
        <div style="text-align:center;padding:90px 20px">
          <div style="font-family:var(--font);font-weight:800;font-size:2.2rem;letter-spacing:-0.03em;color:var(--clay);margin-bottom:12px">Accepted.</div>
          <p style="color:var(--ink-soft);font-size:1.1rem;margin-bottom:26px">Taking you to your contract to book the job…</p>
          <div class="spin"></div>
        </div>`;
      setTimeout(() => { location.href = "/contract/?t=" + data.contract_token + "&from=proposal"; }, 1300);
    } else {
      await load();
    }
  } catch (e) { alert(e.message); }
}

function money(c) { if (c == null) return "—"; return "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
// Deposit = at least 50% of the net, but never less than materials (price ÷ 2.0
// from the gross). Capped at the net. Mirrors _lib/financials.js depositForTotal.
function depositFor(grossCents, netCents) {
  const gross = Math.max(0, grossCents || 0);
  const net = (netCents != null && netCents > 0) ? netCents : gross;
  if (net <= 0) return 0;
  const materials = Math.round(gross / 2.0);
  return Math.min(net, Math.max(Math.round(net * 0.5), materials));
}
// The three payments the customer actually makes: 50% (or whatever covers
// materials + shipping, if that's more) at signing, then the rest split evenly
// between scheduling and install day. Always sums back to the net exactly.
function scheduleFor(grossCents, netCents) {
  const net = (netCents != null && netCents > 0) ? netCents : Math.max(0, grossCents || 0);
  const deposit = depositFor(grossCents, netCents);
  const rest = Math.max(0, net - deposit);
  const atScheduling = Math.round(rest / 2);
  return { deposit, atScheduling, atInstall: rest - atScheduling };
}
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
