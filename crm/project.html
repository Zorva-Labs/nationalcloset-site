<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job · National Closet Company CRM</title>
  <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/crm/crm-app.css?v=ncc18" />
  <link rel="icon" href="/img/favicon-nc.png" />
</head>
<body>
<script src="/crm/crm-app.js?v=ncc18"></script>
<script>
const id = parseInt(new URLSearchParams(location.search).get("id"), 10);
if (!id) location.href = "/crm/projects.html";

let state = null; // { project, windows, estimates, proposals, contracts }

(async () => {
  const user = await SSCrm.mount({
    title: "Job",
    actions: `<a class="btn ghost" href="/crm/projects.html">← All jobs</a>`,
    wide: true,
  });
  if (!user) return;
  await render();
})();

async function render() {
  state = await SSCrm.fetchJSON("/api/projects/" + id);
  const { project, windows, estimates, proposals, contracts, appointments, lead, email_count } = state;
  document.title = `${project.name} · National Closet Company CRM`;

  // Find the "booked-the-job" state
  const fullyExecuted = contracts.find((c) => c.status === "fully_executed");
  const customerSigned = contracts.find((c) => c.status === "signed_by_customer");
  const acceptedProposal = proposals.find((p) => p.status === "accepted");
  const sentContract = contracts.find((c) => c.status === "sent");

  // Booking requires the DEPOSIT to be paid — a signed/executed contract alone
  // is not a booked job. Until then the deal is still a lead in the proposal
  // stage, and the next action is to collect the deposit.
  const JOB_BOOKED = ["contracted", "scheduled_install", "installing", "completed"].includes(project.status);
  const isSigned = !!(fullyExecuted || customerSigned);

  // What's the next best action? Drives the big CTA on the right.
  let bigCta = null;
  if (JOB_BOOKED) {
    bigCta = null; // booked — pipeline + action card drive next steps
  } else if (isSigned) {
    bigCta = { label: "Open deposit invoice", action: "switchTab('invoices')", kind: "primary" };
  } else if (sentContract) {
    bigCta = { label: "Contract sent — awaiting signature", href: `/crm/contract.html?id=${sentContract.id}`, kind: "secondary" };
  } else if (acceptedProposal) {
    bigCta = { label: "Convert proposal → contract", action: `convertProposal(${acceptedProposal.id})`, kind: "primary" };
  } else if (proposals.length && proposals.some((p) => p.status === "tier_selected")) {
    const p = proposals.find((p) => p.status === "tier_selected");
    bigCta = { label: `Customer picked ${p.selected_tier} — request acceptance`, href: `/crm/proposal.html?id=${p.id}`, kind: "primary" };
  } else if (estimates.length || proposals.length) {
    bigCta = { label: "Send a contract", action: `newContract()`, kind: "secondary" };
  } else {
    bigCta = { label: "Start a proposal", action: `newProposal()`, kind: "primary" };
  }

  const initialTab = new URLSearchParams(location.hash.slice(1)).get("tab") || "overview";

  document.getElementById("page").innerHTML = `
    ${fullyExecuted && JOB_BOOKED ? `
      <div class="banner banner--success">
        <div class="banner__icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="banner__body">
          <strong>Job booked.</strong>
          <span>Contract ${SSCrm.esc(fullyExecuted.number)} fully executed · ${SSCrm.fmtMoney(fullyExecuted.total_cents)}${fullyExecuted.deposit_paid ? " · Deposit received" : ""}</span>
        </div>
      </div>` : ""}
    ${isSigned && !JOB_BOOKED ? `
      <div class="banner" style="background:linear-gradient(135deg,#FEF3C7,#FFFBEB);border-color:#FDE68A;color:#92400E">
        <div class="banner__icon" style="color:#B45309">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
        </div>
        <div class="banner__body">
          <strong>Contract signed — awaiting deposit.</strong>
          <span>Still a lead in the proposal stage until the deposit is paid. <a href="#" onclick="switchTab('invoices');return false;" style="color:#B45309;font-weight:700">Open deposit invoice →</a></span>
        </div>
      </div>` : ""}

    <div class="job">
      <header class="job__head">
        <div>
          <div class="job__title">${SSCrm.esc(project.name)}</div>
          <div class="job__customer">
            <a href="/crm/contact.html?id=${project.contact_id}">${SSCrm.esc(project.contact_name)}</a>
            · ${SSCrm.esc(project.contact_email)}
            ${project.contact_phone ? ` · ${SSCrm.esc(project.contact_phone)}` : ""}
            ${project.site_address ? ` · ${SSCrm.esc(project.site_address)}` : ""}
          </div>
        </div>
        <div class="job__status-actions">
          ${SSCrm.pill(project.status)}
          ${bigCta ? renderCta(bigCta) : ""}
        </div>
      </header>

      ${renderJobPipeline(project)}
      ${renderJobActions(project)}

      <nav class="job__tabs" id="tabs">
        ${tab("overview", "Overview")}
        ${tab("messages", "Messages")}
        ${tab("proposals", "Proposals", proposals.length)}
        ${tab("contracts", "Contracts", contracts.length)}
        ${tab("invoices", "Invoices")}
        ${tab("activity", "Activity")}
      </nav>

      <div class="job__body" id="tab-body"></div>
    </div>
  `;

  switchTab(initialTab);
  document.querySelectorAll(".job__tab").forEach((t) => {
    t.addEventListener("click", () => switchTab(t.dataset.tab));
  });
}

function tab(key, label, count) {
  return `<button class="job__tab" data-tab="${key}">${SSCrm.esc(label)}${count != null ? `<span class="job__tab-count">${count}</span>` : ""}</button>`;
}

// Post-signature job pipeline. Once a contract is signed the project enters
// 'contracted' (Booked) and advances Booked → Scheduled → Installing → Completed.
// Each step routes to the appropriate workflow action so the stage is never set
// without its prerequisite (e.g. "Scheduled" always captures an install date).
const JOB_PIPELINE = [
  { key: "contracted",        label: "Booked",     action: "quickStatus('contracted')" },
  { key: "scheduled_install", label: "Scheduled",  action: "scheduleInstall()" },
  { key: "installing",        label: "Installing", action: "quickStatus('installing')" },
  { key: "completed",         label: "Completed",  action: "completeJob()" },
];
function renderJobPipeline(project) {
  const keys = JOB_PIPELINE.map((s) => s.key);
  const cur = keys.indexOf(project.status);
  if (cur < 0) return ""; // Not a booked job yet — pre-contract projects don't show the job pipeline.
  return `
    <div class="pipeline-bar" style="margin:0 0 14px">
      ${JOB_PIPELINE.map((s, i) => {
        const stateCls = i < cur ? "done" : i === cur ? "current" : "future";
        return `<button class="pipeline-step ${stateCls}" type="button" onclick="${s.action}" title="${s.label}">
          <span class="pipeline-step__dot">${i + 1}</span>
          <span class="pipeline-step__label">${s.label}</span>
        </button>`;
      }).join("")}
    </div>`;
}

// Contextual action card under the pipeline — the single next step for the job.
function renderJobActions(project) {
  const s = project.status;
  if (!["contracted", "scheduled_install", "installing", "completed"].includes(s)) return "";
  const when = project.install_date ? SSCrm.fmtDay(project.install_date) : "";
  let body = "";
  if (s === "contracted") {
    body = `
      <div class="job-action__text"><strong>Job booked.</strong> Schedule the installation to move it forward.</div>
      <button class="btn primary" onclick="scheduleInstall()">📅 Schedule install</button>`;
  } else if (s === "scheduled_install") {
    body = `
      <div class="job-action__text"><strong>Install scheduled${when ? ` for ${when}` : ""}.</strong> It moves to <em>Installing</em> automatically on that date.</div>
      <div class="job-action__btns">
        <button class="btn secondary" onclick="scheduleInstall()">Reschedule</button>
        <button class="btn ghost" onclick="quickStatus('installing')">Start install now</button>
      </div>`;
  } else if (s === "installing") {
    body = `
      <div class="job-action__text"><strong>Installation in progress${when ? ` — install date ${when}` : ""}.</strong> Mark it complete when the work is finished.</div>
      <button class="btn primary" onclick="completeJob()">✓ Complete job</button>`;
  } else if (s === "completed") {
    body = `<div class="job-action__text"><strong>Job completed 🎉</strong>${when ? ` &nbsp;Installed ${when}.` : ""}</div>`;
  }
  return `<div class="job-action card">${body}</div>`;
}

async function quickStatus(key) {
  try {
    await SSCrm.fetchJSON("/api/projects/" + id, { method: "PATCH", body: JSON.stringify({ status: key }) });
    SSCrm.toast("Status updated", "success");
    await render();
  } catch (e) { SSCrm.toast(e.message || "Could not update status", "error"); }
}

// Local calendar date as YYYY-MM-DD (not UTC — avoids an off-by-one in the
// evening when the browser is behind UTC).
function localToday() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
}

// Date-picker modal → set install_date + move the job to Scheduled.
function promptInstallDate(current) {
  return new Promise((resolve) => {
    const today = localToday();
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `
      <div class="modal" style="max-width:380px">
        <div class="modal-head">Schedule installation</div>
        <div class="modal-body">
          <label style="display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px">Install date</label>
          <input id="install-date-input" type="date" value="${current || ""}" min="${today}"
            style="width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:8px;font:inherit;box-sizing:border-box"/>
        </div>
        <div class="modal-foot">
          <button class="btn ghost" data-cancel>Cancel</button>
          <button class="btn primary" data-save>Schedule</button>
        </div>
      </div>`;
    document.body.appendChild(bg);
    const input = bg.querySelector("#install-date-input");
    setTimeout(() => input.focus(), 30);
    const close = (v) => { bg.remove(); resolve(v); };
    bg.querySelector("[data-cancel]").onclick = () => close(null);
    bg.querySelector("[data-save]").onclick = () => {
      if (!input.value) { input.style.borderColor = "#D2683F"; input.focus(); return; }
      close(input.value);
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && input.value) close(input.value); });
    bg.addEventListener("click", (e) => { if (e.target === bg) close(null); });
  });
}

async function scheduleInstall() {
  const date = await promptInstallDate(state?.project?.install_date || "");
  if (!date) return;
  // If the install date is today (or earlier), the job is installing right now —
  // move it straight to "installing" instead of waiting for the cron sweep.
  // Future dates go to "scheduled_install" and auto-advance on the day.
  const isNow = date <= localToday();
  try {
    await SSCrm.fetchJSON("/api/projects/" + id, {
      method: "PATCH",
      body: JSON.stringify({ status: isNow ? "installing" : "scheduled_install", install_date: date }),
    });
    SSCrm.toast(isNow ? "Install started" : "Install scheduled", "success");
    await render();
  } catch (e) { SSCrm.toast(e.message || "Could not schedule", "error"); }
}

async function completeJob() {
  if (!(await SSCrm.confirmDialog("Mark this job as completed?"))) return;
  try {
    await SSCrm.fetchJSON("/api/projects/" + id, { method: "PATCH", body: JSON.stringify({ status: "completed" }) });
    SSCrm.toast("Job completed", "success");
    await render();
  } catch (e) { SSCrm.toast(e.message || "Could not complete", "error"); }
}

function renderCta(c) {
  const cls = c.kind === "primary" ? "primary" : "secondary";
  if (c.href) return `<a class="btn lg ${cls} job__big-cta" href="${c.href}">${SSCrm.esc(c.label)}</a>`;
  return `<button class="btn lg ${cls} job__big-cta" onclick="${c.action}">${SSCrm.esc(c.label)}</button>`;
}

function switchTab(tab) {
  document.querySelectorAll(".job__tab").forEach((t) => t.classList.toggle("is-active", t.dataset.tab === tab));
  location.hash = `tab=${tab}`;
  const body = document.getElementById("tab-body");
  const { project, windows, estimates, proposals, contracts } = state;

  if (tab === "overview") {
    body.innerHTML = renderOverview(state);
    loadFinancials();
  }
  else if (tab === "messages") {
    body.innerHTML = `<div id="email-timeline"></div>`;
    const emailHost = document.getElementById("email-timeline");
    const refresh = () => SSCrm.renderEmailTimeline(emailHost, {
      project_id: project.id,
      onCompose: async () => {
        const res = await SSCrm.composeEmail({
          contact: { id: project.contact_id, name: project.contact_name, email: project.contact_email, phone: project.contact_phone, address_street: project.site_address || "" },
          project,
        });
        if (res?.ok) refresh();
      },
    });
    refresh();
  }
  else if (tab === "proposals") body.innerHTML = renderDocTab(proposals, "proposal", "PROP", newProposal);
  else if (tab === "contracts") body.innerHTML = renderDocTab(contracts, "contract", "C", newContract);
  else if (tab === "invoices") { body.innerHTML = `<div id="invoices-host" class="muted">Loading…</div>`; loadInvoices(); }
  else if (tab === "activity") body.innerHTML = `<div id="activity-feed" class="muted">Loading…</div>`, loadActivity();
}

// ───────── Invoices tab (Stripe-backed deposit/balance/custom invoices) ─────────
const INV_STATUS = {
  open:  { label: "Awaiting payment", cls: "" },
  paid:  { label: "Paid", cls: "completed" },
  void:  { label: "Void", cls: "lost" },
  draft: { label: "Draft", cls: "draft" },
};
const INV_TYPE = { deposit: "Deposit", balance: "Final balance", full: "Full", custom: "Custom" };

async function loadInvoices() {
  const host = document.getElementById("invoices-host");
  try {
    const { invoices } = await SSCrm.fetchJSON(`/api/invoices?project_id=${id}`);
    renderInvoices(host, invoices || []);
  } catch (e) { host.innerHTML = `<div class="empty">Couldn't load invoices.</div>`; }
}

// Job (contract) value, from the most authoritative contract on the project.
function jobTotalCents() {
  const ks = (state?.contracts || []).slice();
  if (!ks.length) return null;
  const rank = { fully_executed: 0, signed_by_customer: 1, sent: 2 };
  ks.sort((a, b) => ((rank[a.status] ?? 3) - (rank[b.status] ?? 3)) || (b.id - a.id));
  return ks[0].total_cents != null ? ks[0].total_cents : null;
}

function renderInvoices(host, invoices) {
  const m = SSCrm.fmtMoney, e = SSCrm.esc;
  const phone = (state?.project?.contact_phone || "").replace(/[^0-9+]/g, "");

  const open   = invoices.filter((iv) => iv.status === "open");
  const paid   = invoices.filter((iv) => iv.status === "paid");
  const voided = invoices.filter((iv) => iv.status === "void");

  const paidCents = paid.reduce((s, iv) => s + (iv.amount_cents || 0), 0);
  const openCents = open.reduce((s, iv) => s + (iv.amount_cents || 0), 0);
  const jobTotal  = jobTotalCents();
  const balanceDue = jobTotal != null ? Math.max(0, jobTotal - paidCents) : openCents;

  const stat = (label, val, color) => `<div style="min-width:110px">
      <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em">${label}</div>
      <div style="font-size:22px;font-weight:800;${color ? `color:${color}` : ""}">${val}</div></div>`;

  const summary = `<div class="card" style="display:flex;gap:22px;flex-wrap:wrap;align-items:center">
      ${stat("Job total", jobTotal != null ? m(jobTotal) : "—")}
      ${stat("Paid", m(paidCents), "#10B981")}
      ${stat("Balance due", m(balanceDue), balanceDue > 0 ? "#B45309" : "#10B981")}
      <div style="flex:1;min-width:200px;text-align:right;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">
        <button class="btn secondary sm" onclick="createInvoiceUI('deposit')">+ Deposit</button>
        <button class="btn secondary sm" onclick="createInvoiceUI('balance')">+ Balance</button>
        <button class="btn primary sm" onclick="createInvoiceUI('custom')">+ Custom</button>
      </div>
    </div>`;

  const numLink = (iv) => `<a href="/crm/invoice.html?id=${iv.id}" style="color:inherit"><strong>${e(iv.number)}</strong></a>`;
  const openBtn = (iv) => `<a class="btn primary sm" href="/crm/invoice.html?id=${iv.id}">Open →</a>`;

  const openRows = open.map((iv) => `<tr>
      <td>${numLink(iv)}<div class="muted" style="font-size:12px">${e(INV_TYPE[iv.type] || iv.type)}${iv.description ? " · " + e(iv.description) : ""}</div></td>
      <td class="money">${m(iv.amount_cents)}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" onclick="copyPayLink('https://nationalclosetco.com/invoice/?t=${e(iv.view_token)}')">Copy link</button> ${openBtn(iv)}</td>
    </tr>`).join("");

  const paidRows = paid.map((iv) => `<tr>
      <td>${numLink(iv)}<div class="muted" style="font-size:12px">${e(INV_TYPE[iv.type] || iv.type)} · paid ${e(SSCrm.fmtDate(iv.paid_at))}${iv.paid_method ? ` · ${e(iv.paid_method)}` : ""}</div></td>
      <td class="money">${m(iv.amount_cents)}</td>
      <td style="text-align:right">${openBtn(iv)}</td>
    </tr>`).join("");

  const voidRows = voided.map((iv) => `<tr style="opacity:.55">
      <td>${numLink(iv)} <span class="muted" style="font-size:12px">${e(INV_TYPE[iv.type] || iv.type)}</span></td>
      <td class="money">${m(iv.amount_cents)}</td>
      <td style="text-align:right">${openBtn(iv)}</td>
    </tr>`).join("");

  const section = (title, rows, n, color) => rows ? `<div class="card">
      <div class="card-head"><h3>${title} <span class="muted" style="font-weight:500">· ${n}</span></h3></div>
      <div class="tbl" style="border:0"><table><tbody>${rows}</tbody></table></div>
    </div>` : "";

  host.innerHTML = invoices.length
    ? summary
      + section("Outstanding", openRows, open.length)
      + section("Paid", paidRows, paid.length)
      + section("Voided", voidRows, voided.length)
    : summary + `<div class="card"><div class="empty">No invoices yet. Create a deposit or balance invoice — the customer pays by card online.</div></div>`;
}

async function createInvoiceUI(type) {
  let amountCents, description;
  if (type === "custom") {
    const amt = prompt("Invoice amount (USD):", "");
    if (amt == null) return;
    const dollars = parseFloat(String(amt).replace(/[^0-9.]/g, ""));
    if (!dollars || dollars <= 0) { SSCrm.toast("Enter a valid amount", "error"); return; }
    amountCents = Math.round(dollars * 100);
    description = prompt("Description (optional):", "Custom invoice") || "Custom invoice";
  }
  try {
    const body = { project_id: id, type };
    if (amountCents != null) body.amount_cents = amountCents;
    if (description) body.description = description;
    const r = await SSCrm.fetchJSON("/api/invoices", { method: "POST", body: JSON.stringify(body) });
    SSCrm.toast(r.deduped ? "Invoice already existed" : "Invoice created & emailed", "success");
    loadInvoices();
  } catch (e) { SSCrm.toast(e.message || "Could not create invoice", "error"); }
}
async function resendInvoice(iid) {
  try { await SSCrm.fetchJSON(`/api/invoices/${iid}`, { method: "POST", body: JSON.stringify({ action: "resend" }) }); SSCrm.toast("Invoice re-sent", "success"); }
  catch (e) { SSCrm.toast(e.message || "Could not resend", "error"); }
}
async function voidInvoice(iid) {
  if (!(await SSCrm.confirmDialog("Void this invoice? The customer will no longer be able to pay it."))) return;
  try { await SSCrm.fetchJSON(`/api/invoices/${iid}`, { method: "POST", body: JSON.stringify({ action: "void" }) }); SSCrm.toast("Invoice voided", "success"); loadInvoices(); }
  catch (e) { SSCrm.toast(e.message || "Could not void", "error"); }
}
async function markInvoicePaid(iid) {
  if (!(await SSCrm.confirmDialog("Mark this invoice paid (e.g. cash/check received)?"))) return;
  try { await SSCrm.fetchJSON(`/api/invoices/${iid}`, { method: "POST", body: JSON.stringify({ action: "mark_paid", method: "manual" }) }); SSCrm.toast("Marked paid", "success"); loadInvoices(); }
  catch (e) { SSCrm.toast(e.message || "Could not update", "error"); }
}
function copyPayLink(url) { navigator.clipboard.writeText(url).then(() => SSCrm.toast("Pay link copied", "success"), () => SSCrm.toast(url, "info")); }

// Consolidated Overview tab — surfaces everything that used to live on the
// separate Lead screen so the job page is the single place to see the whole
// customer history at a glance.
function renderOverview(s) {
  const { project, contracts, appointments, lead, lead_notes, email_count } = s;
  const e = SSCrm.esc;
  const fmtMoney = SSCrm.fmtMoney;
  const fmtDate = SSCrm.fmtDate;
  const fmtDateTime = SSCrm.fmtDateTime;

  // Pick the most relevant contract to highlight
  const signedContract = contracts.find((c) => c.status === "fully_executed") ||
                         contracts.find((c) => c.status === "signed_by_customer");
  const draftContract  = contracts.find((c) => c.status === "draft" || c.status === "sent");

  // Sort appointments: upcoming first (asc), then past (desc). Only show 4.
  const now = new Date().toISOString();
  const upcoming = appointments.filter((a) => a.start_at >= now).sort((a, b) => a.start_at.localeCompare(b.start_at)).slice(0, 3);
  const recentPast = appointments.filter((a) => a.start_at <  now).slice(0, 2);
  const apptList = [...upcoming, ...recentPast];

  return `
    <div class="lead-grid">
      <div class="lead-grid__main" style="display:flex;flex-direction:column;gap:14px">

        <!-- Customer + origin — pulled from the linked lead row -->
        <div class="card">
          <div class="card-head">
            <h3>Customer</h3>
            <a class="btn ghost sm" href="/crm/contact.html?id=${project.contact_id}">Open contact →</a>
          </div>
          <div style="display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:13px;color:var(--ink-soft)">
            <div class="muted">Name</div><div><strong style="color:var(--ink)">${e(project.contact_name)}</strong></div>
            <div class="muted">Email</div><div><a href="mailto:${e(project.contact_email)}">${e(project.contact_email)}</a></div>
            ${project.contact_phone ? `<div class="muted">Phone</div><div><a href="tel:${e(project.contact_phone)}">${e(project.contact_phone)}</a> · <a href="sms:${e(project.contact_phone)}">Text</a></div>` : ""}
            ${project.site_address ? `<div class="muted">Site</div><div><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(project.site_address)}" target="_blank" rel="noopener">${e(project.site_address)} ↗</a></div>` : ""}

// Compose helper called from the Overview Quick-actions panel
async function composeFromOverview() {
  const { project } = state;
  const res = await SSCrm.composeEmail({
    contact: { id: project.contact_id, name: project.contact_name, email: project.contact_email, phone: project.contact_phone, address_street: project.site_address || "" },
    project,
  });
  if (res?.ok) render();
}

// ───────── Expenses & profit (cost model mirrors functions/_lib/financials.js) ─────────
let finState = null;
const finDollars = (cents) => (Math.max(0, cents || 0) / 100).toFixed(2);
const finToCents = (v) => Math.max(0, Math.round((parseFloat(v) || 0) * 100));

function finCalc(priceCents) {
  const base = priceCents * 0.65;                            // remove 35% markup first
  const b = base / 100;
  const disc = b >= 4500 ? 0.30 : b >= 2500 ? 0.25 : 0.20;   // tier from the remaining number
  const materials = Math.round(base * (1 - disc));
  const shipping = Math.round(materials * 0.05);
  const tax = Math.round((materials + shipping) * 0.0975);
  const labor = Math.round(materials * 0.15);
  return { disc, materials, shipping, tax, labor };
}

async function loadFinancials() {
  const host = document.getElementById("fin-host");
  if (!host || !state.project) return;
  try {
    const r = await SSCrm.fetchJSON(`/api/projects/${state.project.id}/financials`);
    finState = r.financials;
    finRender();
  } catch (err) {
    host.innerHTML = `<span class="muted">Couldn't load: ${SSCrm.esc(err.message)}</span>`;
  }
}

function finRow(key, label) {
  const auto = finState[key + "_auto"];
  return `<tr>
    <td style="padding:6px 0">${label}</td>
    <td style="text-align:right;white-space:nowrap">
      <label style="font-size:11px;color:var(--ink-soft);margin-right:8px;cursor:pointer"><input type="checkbox" id="fin-${key}-auto" ${auto ? "checked" : ""} onchange="finToggle('${key}')"/> auto</label>
      <span style="color:var(--ink-soft)">$</span>
      <input id="fin-${key}" value="${finDollars(finState[key + "_cents"])}" ${auto ? "readonly" : ""} oninput="finRecalc()" inputmode="decimal" style="width:96px;text-align:right;${auto ? "background:var(--bg-soft);color:var(--ink-soft)" : ""}"/>
    </td></tr>`;
}

function finRender() {
  const f = finState;
  const host = document.getElementById("fin-host");
  if (!host) return;
  host.innerHTML = `
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <tr>
        <td style="padding:6px 0"><strong>Client price</strong> <span class="muted" style="font-size:11px">· <span id="fin-tier">${Math.round(f.discount * 100)}</span>% tier</span></td>
        <td style="text-align:right;white-space:nowrap">
          <label style="font-size:11px;color:var(--ink-soft);margin-right:8px;cursor:pointer"><input type="checkbox" id="fin-price-auto" ${f.price_auto ? "checked" : ""} onchange="finToggle('price')"/> auto</label>
          <span style="color:var(--ink-soft)">$</span>
          <input id="fin-price" value="${finDollars(f.price_cents)}" ${f.price_auto ? "readonly" : ""} oninput="finRecalc()" inputmode="decimal" style="width:96px;text-align:right;font-weight:600;${f.price_auto ? "background:var(--bg-soft);color:var(--ink-soft)" : ""}"/>
        </td>
      </tr>
      <tr><td colspan="2"><hr style="border:0;border-top:1px solid var(--line);margin:6px 0"/></td></tr>
      ${finRow("materials", "Materials")}
      ${finRow("shipping", "Shipping <span class='muted' style='font-size:11px'>· 5%</span>")}
      ${finRow("tax", "Taxes <span class='muted' style='font-size:11px'>· 9.75%</span>")}
      ${finRow("labor", "Labor <span class='muted' style='font-size:11px'>· 15%</span>")}
      <tr><td style="padding:6px 0">Misc</td><td style="text-align:right;white-space:nowrap"><span style="color:var(--ink-soft)">$</span><input id="fin-misc" value="${finDollars(f.misc_cents)}" oninput="finRecalc()" inputmode="decimal" style="width:96px;text-align:right"/></td></tr>
      <tr><td colspan="2"><hr style="border:0;border-top:1px solid var(--line);margin:6px 0"/></td></tr>
      <tr><td style="padding:4px 0">Total expenses</td><td style="text-align:right" id="fin-expenses">${SSCrm.fmtMoney(f.expenses_cents)}</td></tr>
      <tr style="font-weight:700"><td style="padding:4px 0">Profit</td><td style="text-align:right" id="fin-profit">${SSCrm.fmtMoney(f.profit_cents)}</td></tr>
      <tr><td style="padding:0 0 8px;color:var(--ink-soft);font-size:11px">Margin</td><td style="text-align:right;color:var(--ink-soft);font-size:11px" id="fin-margin">${f.price_cents ? Math.round((f.profit_cents / f.price_cents) * 100) : 0}%</td></tr>
    </table>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn primary sm" onclick="saveFinancials()">Save</button>
      <button class="btn ghost sm" onclick="resetFinancials()">Reset to formula</button>
    </div>
    <p class="muted" style="font-size:11px;margin:8px 0 0">Materials = (price − 35% markup) × (1 − tier discount). Uncheck “auto” to override any line. Feeds Reports → P&amp;L.</p>`;
}

function finReadPrice() {
  return document.getElementById("fin-price-auto").checked
    ? (finState.default_price_cents || 0)
    : finToCents(document.getElementById("fin-price").value);
}

function finToggle(key) {
  const auto = document.getElementById(`fin-${key}-auto`).checked;
  const input = document.getElementById(`fin-${key}`);
  input.readOnly = auto;
  input.style.background = auto ? "var(--bg-soft)" : "";
  input.style.color = auto ? "var(--ink-soft)" : "";
  finRecalc();
}

function finRecalc() {
  const price = finReadPrice();
  if (document.getElementById("fin-price-auto").checked) document.getElementById("fin-price").value = finDollars(price);
  const calc = finCalc(price);
  const tierEl = document.getElementById("fin-tier");
  if (tierEl) tierEl.textContent = Math.round(calc.disc * 100);
  ["materials", "shipping", "tax", "labor"].forEach((k) => {
    if (document.getElementById(`fin-${k}-auto`).checked) document.getElementById(`fin-${k}`).value = finDollars(calc[k]);
  });
  const sum = ["materials", "shipping", "tax", "labor", "misc"].reduce((a, k) => a + finToCents(document.getElementById(`fin-${k}`).value), 0);
  document.getElementById("fin-expenses").textContent = SSCrm.fmtMoney(sum);
  document.getElementById("fin-profit").textContent = SSCrm.fmtMoney(price - sum);
  document.getElementById("fin-margin").textContent = (price ? Math.round(((price - sum) / price) * 100) : 0) + "%";
}

async function saveFinancials() {
  const priceAuto = document.getElementById("fin-price-auto").checked;
  const body = { price_auto: priceAuto, misc_cents: finToCents(document.getElementById("fin-misc").value) };
  if (!priceAuto) body.price_cents = finToCents(document.getElementById("fin-price").value);
  ["materials", "shipping", "tax", "labor"].forEach((k) => {
    const auto = document.getElementById(`fin-${k}-auto`).checked;
    body[`${k}_auto`] = auto;
    if (!auto) body[`${k}_cents`] = finToCents(document.getElementById(`fin-${k}`).value);
  });
  try {
    const r = await SSCrm.fetchJSON(`/api/projects/${state.project.id}/financials`, { method: "PUT", body: JSON.stringify(body) });
    finState = r.financials;
    finRender();
    SSCrm.toast("Saved", "success");
  } catch (err) { SSCrm.toast(err.message || "Save failed", "error"); }
}

async function resetFinancials() {
  try {
    const r = await SSCrm.fetchJSON(`/api/projects/${state.project.id}/financials`, { method: "PUT", body: JSON.stringify({ price_auto: true, misc_cents: 0 }) });
    finState = r.financials;
    finRender();
    SSCrm.toast("Reset to formula", "success");
  } catch (err) { SSCrm.toast(err.message || "Reset failed", "error"); }
}

// Two-step purge: show a count summary of every dependent that'll be wiped
// (windows, proposals, contracts, emails, appointments, lead notes), require
// the admin to type the job's name to confirm, then hit DELETE …?purge=1.
async function purgeJob() {
  const { project, windows, proposals, contracts, appointments, lead, lead_notes, email_count } = state;
  const counts = {
    Windows:      windows.length,
    Proposals:    proposals.length,
    Contracts:    contracts.length,
    Appointments: (appointments || []).length,
    Emails:       (email_count?.sent || 0) + (email_count?.received || 0),
    "Lead notes": (lead_notes || []).length,
  };
  const items = Object.entries(counts).filter(([, n]) => n > 0).map(([k, n]) =>
    `<li style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px"><span>${SSCrm.esc(k)}</span><strong>${n}</strong></li>`
  ).join("");
  const leadLine = lead ? `<li style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px"><span>Originating lead (#${lead.id})</span><strong>1</strong></li>` : "";

  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal" style="max-width:520px">
      <div class="modal-head" style="background:#FEF2F2;color:#991B1B;border-bottom:1px solid #FEE2E2">🗑 Delete &amp; purge "${SSCrm.esc(project.name)}"</div>
      <div class="modal-body">
        <p style="margin:0 0 14px;font-size:14px;line-height:1.55">This permanently removes the job AND every related record. <strong>Cannot be undone.</strong></p>
        <ul style="list-style:none;padding:0;margin:0 0 16px;border-top:1px solid var(--line-soft)">
          ${items || `<li class="muted" style="padding:8px 0;font-style:italic">Nothing additional — just the project itself.</li>`}
          ${leadLine}
        </ul>
        <p class="muted" style="font-size:12px;margin:0 0 8px">The contact <strong>${SSCrm.esc(project.contact_name)}</strong> stays — they may have other jobs or come back later.</p>
        <p style="font-size:13px;margin:14px 0 6px">Type <code style="background:var(--bg-soft);padding:2px 6px;border-radius:3px;font-family:var(--font-mono,monospace);font-size:12px">${SSCrm.esc(project.name)}</code> to confirm:</p>
        <input id="purge-confirm" autocomplete="off"
               style="width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font:inherit;font-size:14px"
               placeholder="${SSCrm.esc(project.name)}"/>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="px-cancel">Cancel</button>
        <button class="btn danger" id="px-confirm" disabled>Permanently delete</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const input = bg.querySelector("#purge-confirm");
  const btn   = bg.querySelector("#px-confirm");
  input.focus();
  input.addEventListener("input", () => { btn.disabled = input.value.trim() !== project.name; });
  bg.querySelector("#px-cancel").onclick = () => bg.remove();
  bg.addEventListener("click", (e) => { if (e.target === bg) bg.remove(); });
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Deleting…";
    try {
      const res = await SSCrm.fetchJSON(`/api/projects/${project.id}?purge=1`, { method: "DELETE" });
      bg.remove();
      const summary = res.summary || {};
      const parts = [];
      if (summary.windows)      parts.push(`${summary.windows} window${summary.windows === 1 ? "" : "s"}`);
      if (summary.proposals)    parts.push(`${summary.proposals} proposal${summary.proposals === 1 ? "" : "s"}`);
      if (summary.contracts)    parts.push(`${summary.contracts} contract${summary.contracts === 1 ? "" : "s"}`);
      if (summary.emails)       parts.push(`${summary.emails} email${summary.emails === 1 ? "" : "s"}`);
      if (summary.appointments) parts.push(`${summary.appointments} appt${summary.appointments === 1 ? "" : "s"}`);
      if (summary.lead_removed) parts.push("lead");
      SSCrm.toast(`Purged — wiped ${parts.length ? parts.join(" · ") : "just the project"}`, "success");
      setTimeout(() => { location.href = "/crm/projects.html"; }, 600);
    } catch (e) {
      btn.disabled = false; btn.textContent = "Permanently delete";
      SSCrm.toast(e.message || "Delete failed", "error");
    }
  };
}

function renderDocTab(docs, kind, prefix, addFn) {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h3 style="font-size:14px;color:var(--ink-soft)">${docs.length} ${kind}${docs.length === 1 ? "" : "s"}</h3>
      <button class="btn primary sm" onclick="${addFn.name}()">+ New ${kind}</button>
    </div>
    ${docs.length ? `<div class="tbl"><table>
      <thead><tr><th>${prefix}-#</th><th>Status</th><th class="num">Total</th><th>Activity</th><th></th></tr></thead>
      <tbody>${docs.map((d) => `
        <tr class="clickable" onclick="location.href='/crm/${kind}.html?id=${d.id}'">
          <td><strong>${SSCrm.esc(d.number || "")}</strong></td>
          <td>${SSCrm.pill(d.status)}</td>
          <td class="money">${SSCrm.fmtMoney(d.total_cents || d.selected_total_cents || 0)}</td>
          <td class="muted" style="font-size:12px">${SSCrm.fmtDate(d.updated_at || d.created_at)}</td>
          <td><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></td>
        </tr>`).join("")}
      </tbody></table></div>` : `<p class="muted" style="padding:30px;text-align:center">No ${kind}s yet.</p>`}
  `;
}


async function saveProject() {
  try {
    await SSCrm.fetchJSON("/api/projects/" + id, { method: "PATCH", body: JSON.stringify({
      name: document.getElementById("p-name").value.trim(),
      status: document.getElementById("p-status").value,
      site_address: document.getElementById("p-addr").value.trim(),
      description: document.getElementById("p-desc").value.trim(),
    })});
    SSCrm.toast("Saved", "success");
    await render();
  } catch (e) { SSCrm.toast(e.message, "error"); }
}

async function loadActivity() {
  try {
    // ?project_id= triggers the unified feed — pulls activity for the
    // project itself + its originating lead + every proposal/contract/
    // appointment/email_message tied to it. The legacy entity_type/entity_id
    // strict-match was only returning rows where entity_type='project'.
    const { activity } = await SSCrm.fetchJSON(`/api/activity?project_id=${id}&limit=120`);
    const feed = document.getElementById("activity-feed");
    if (!activity.length) { feed.innerHTML = `<p style="text-align:center;color:var(--ink-soft);padding:40px">No activity yet.</p>`; return; }
    feed.innerHTML = `<ul class="activity">${activity.map((a) => `
      <li>
        <span class="activity__icon" data-k="${SSCrm.esc(a.action)}">·</span>
        <div class="activity__body">
          <strong>${SSCrm.esc(a.action.replace(/-/g, " "))}</strong>
          ${a.actor_name ? `· by ${SSCrm.esc(a.actor_name)}` : ""}
          <div class="activity__time">${SSCrm.fmtDateTime(a.created_at)}</div>
        </div>
      </li>`).join("")}</ul>`;
  } catch (e) { document.getElementById("activity-feed").innerHTML = `<p class="muted">${SSCrm.esc(e.message)}</p>`; }
}

async function newEstimate() {
  try { const { id: nid } = await SSCrm.fetchJSON("/api/estimates", { method: "POST", body: JSON.stringify({ project_id: id }) }); location.href = "/crm/estimate.html?id=" + nid; }
  catch (e) { SSCrm.toast(e.message, "error"); }
}
async function newProposal() {
  const kind = await pickProposalKind();
  if (!kind) return;
  try { const { id: nid } = await SSCrm.fetchJSON("/api/proposals", { method: "POST", body: JSON.stringify({ project_id: id, proposal_kind: kind }) }); location.href = "/crm/proposal.html?id=" + nid; }
  catch (e) { SSCrm.toast(e.message, "error"); }
}
function pickProposalKind() {
  return new Promise((resolve) => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `
      <div class="modal" style="max-width:480px">
        <div class="modal-head">New proposal — choose a type</div>
        <div class="modal-body" style="display:grid;gap:10px">
          <button class="btn secondary" data-k="custom" style="justify-content:flex-start;text-align:left;padding:12px 14px">🚪 Custom closet — 2 options (walls as-is / wall repair &amp; paint)</button>
          <button class="btn secondary" data-k="install_only" style="justify-content:flex-start;text-align:left;padding:12px 14px">🔧 BYO install — customer-supplied closets</button>
          <button class="btn secondary" data-k="repair" style="justify-content:flex-start;text-align:left;padding:12px 14px">🛠️ Repair / service</button>
        </div>
        <div class="modal-foot"><button class="btn ghost" data-cancel>Cancel</button></div>
      </div>`;
    document.body.appendChild(bg);
    bg.querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => { bg.remove(); resolve(b.dataset.k); }));
    bg.querySelector("[data-cancel]").onclick = () => { bg.remove(); resolve(null); };
    bg.addEventListener("click", (e) => { if (e.target === bg) { bg.remove(); resolve(null); } });
  });
}
async function newContract() {
  // Ask which contract type
  const type = await pickContractType();
  if (!type) return;
  try {
    const { id: nid } = await SSCrm.fetchJSON("/api/contracts", { method: "POST", body: JSON.stringify({ project_id: id, contract_type: type }) });
    location.href = "/crm/contract.html?id=" + nid;
  } catch (e) { SSCrm.toast(e.message, "error"); }
}

function pickContractType() {
  return new Promise((resolve) => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `
      <div class="modal" style="max-width:520px">
        <div class="modal-head">What kind of contract?</div>
        <div class="modal-body" style="display:grid;gap:10px">
          <button class="btn secondary" data-t="custom_order" style="justify-content:flex-start;padding:14px;text-align:left;flex-direction:column;align-items:flex-start;gap:4px">
            <strong style="font-size:14px">Custom Order</strong>
            <span style="font-size:12px;color:var(--ink-soft);font-weight:400">We supply &amp; install custom-made treatments. 50% deposit. Manufacturer warranty + 90-day workmanship.</span>
          </button>
          <button class="btn secondary" data-t="install_only" style="justify-content:flex-start;padding:14px;text-align:left;flex-direction:column;align-items:flex-start;gap:4px">
            <strong style="font-size:14px">Install Only · BYO Blinds</strong>
            <span style="font-size:12px;color:var(--ink-soft);font-weight:400">Customer supplies blinds (Lowes, Home Depot, Costco, etc.). We install them. No deposit. Pay on completion. 90-day workmanship.</span>
          </button>
          <button class="btn secondary" data-t="repair" style="justify-content:flex-start;padding:14px;text-align:left;flex-direction:column;align-items:flex-start;gap:4px">
            <strong style="font-size:14px">Repair / Service Call</strong>
            <span style="font-size:12px;color:var(--ink-soft);font-weight:400">Repair an existing blind, shutter, or shade. Service-call fee + parts. Pay on completion. 90-day workmanship.</span>
          </button>
        </div>
        <div class="modal-foot"><button class="btn ghost" data-no>Cancel</button></div>
      </div>
    `;
    document.body.appendChild(bg);
    bg.querySelectorAll("[data-t]").forEach((b) => { b.onclick = () => { bg.remove(); resolve(b.dataset.t); }; });
    bg.querySelector("[data-no]").onclick = () => { bg.remove(); resolve(null); };
    bg.addEventListener("click", (e) => { if (e.target === bg) { bg.remove(); resolve(null); } });
  });
}
async function convertProposal(propId) {
  if (!(await SSCrm.confirmDialog("Create a contract from the accepted tier of this proposal?"))) return;
  try {
    const { id: nid } = await SSCrm.fetchJSON(`/api/proposals/${propId}/convert`, { method: "POST" });
    SSCrm.toast("Contract drafted from proposal", "success");
    location.href = "/crm/contract.html?id=" + nid;
  } catch (e) { SSCrm.toast(e.message, "error"); }
}
