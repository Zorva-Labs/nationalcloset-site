<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job · National Closet Company CRM</title>
  <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/crm/crm-app.css?v=ncc110" />
  <link rel="icon" href="/img/favicon-nc.png" />
</head>
<body>
<script src="/crm/crm-app.js?v=ncc106"></script>
<script>
const id = parseInt(new URLSearchParams(location.search).get("id"), 10);
if (!id) location.href = "/crm/projects.html";

let state = null; // { project, windows, estimates, proposals, contracts }

(async () => {
  const user = await SSCrm.mount({
    title: "Job",
    actions: `<a class="btn ghost" href="/crm/projects.html">← All jobs</a>`,
    wide: true,
  });
  if (!user) return;
  await render();
})();

async function render() {
  state = await SSCrm.fetchJSON("/api/projects/" + id);
  const { project, windows, estimates, proposals, contracts, appointments, lead, email_count } = state;
  document.title = `${project.name} · National Closet Company CRM`;

  // Find the "booked-the-job" state
  const fullyExecuted = contracts.find((c) => c.status === "fully_executed");
  const customerSigned = contracts.find((c) => c.status === "signed_by_customer");
  const acceptedProposal = proposals.find((p) => p.status === "accepted");
  const sentContract = contracts.find((c) => c.status === "sent");

  // Booking requires the DEPOSIT to be paid — a signed/executed contract alone
  // is not a booked job. Until then the deal is still a lead in the proposal
  // stage, and the next action is to collect the deposit.
  const JOB_BOOKED = ["contracted", "scheduled_install", "installing", "completed"].includes(project.status);
  const isSigned = !!(fullyExecuted || customerSigned);

  // What's the next best action? Drives the big CTA on the right.
  let bigCta = null;
  if (JOB_BOOKED) {
    bigCta = null; // booked — pipeline + action card drive next steps
  } else if (isSigned) {
    bigCta = { label: "Open deposit invoice", action: "switchTab('invoices')", kind: "primary" };
  } else if (sentContract) {
    bigCta = { label: "Contract sent — awaiting signature", href: `/crm/contract.html?id=${sentContract.id}`, kind: "secondary" };
  } else if (acceptedProposal) {
    bigCta = { label: "Convert proposal → contract", action: `convertProposal(${acceptedProposal.id})`, kind: "primary" };
  } else if (proposals.length && proposals.some((p) => p.status === "tier_selected")) {
    const p = proposals.find((p) => p.status === "tier_selected");
    bigCta = { label: `Customer picked ${p.selected_tier} — request acceptance`, href: `/crm/proposal.html?id=${p.id}`, kind: "primary" };
  } else if (estimates.length || proposals.length) {
    bigCta = { label: "Send a contract", action: `newContract()`, kind: "secondary" };
  } else {
    bigCta = { label: "Start a proposal", action: `newProposal()`, kind: "primary" };
  }

  const initialTab = new URLSearchParams(location.hash.slice(1)).get("tab") || "overview";

  document.getElementById("page").innerHTML = `
    ${fullyExecuted && JOB_BOOKED ? `
      <div class="banner banner--success">
        <div class="banner__icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="banner__body">
          <strong>Job booked.</strong>
          <span>Contract ${SSCrm.esc(fullyExecuted.number)} fully executed · ${SSCrm.fmtMoney(fullyExecuted.total_cents)}${(state.billing && state.billing.paid_in_full) ? " · Paid in full" : (fullyExecuted.deposit_paid ? " · Deposit received" : "")}</span>
        </div>
      </div>` : ""}
    ${isSigned && !JOB_BOOKED ? `
      <div class="banner" style="background:linear-gradient(135deg,#FEF3C7,#FFFBEB);border-color:#FDE68A;color:#92400E">
        <div class="banner__icon" style="color:#B45309">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
        </div>
        <div class="banner__body">
          <strong>Contract signed — awaiting deposit.</strong>
          <span>Still a lead in the proposal stage until the deposit is paid. <a href="#" onclick="switchTab('invoices');return false;" style="color:#B45309;font-weight:700">Open deposit invoice →</a></span>
        </div>
      </div>` : ""}

    <div class="job">
      <header class="job__head">
        <div>
          <div class="job__title">${SSCrm.esc(project.name)}</div>
          <div class="job__customer">
            <a href="/crm/contact.html?id=${project.contact_id}">${SSCrm.esc(project.contact_name)}</a>
            · ${SSCrm.esc(project.contact_email)}
            ${project.contact_phone ? ` · ${SSCrm.esc(project.contact_phone)}` : ""}
            ${project.site_address ? ` · ${SSCrm.esc(project.site_address)}` : ""}
          </div>
        </div>
        <div class="job__status-actions">
          ${SSCrm.pill(project.status)}
          ${bigCta ? renderCta(bigCta) : ""}
        </div>
      </header>

      ${renderJobPipeline(project)}
      ${renderJobActions(project)}

      <nav class="job__tabs" id="tabs">
        ${tab("overview", "Overview")}
        ${tab("messages", "Messages")}
        ${tab("proposals", "Proposals", proposals.length)}
        ${tab("contracts", "Contracts", contracts.length)}
        ${tab("invoices", "Invoices")}
        ${tab("activity", "Activity")}
      </nav>

      <div class="job__body" id="tab-body"></div>
    </div>
  `;

  switchTab(initialTab);
  document.querySelectorAll(".job__tab").forEach((t) => {
    t.addEventListener("click", () => switchTab(t.dataset.tab));
  });
}

function tab(key, label, count) {
  return `<button class="job__tab" data-tab="${key}">${SSCrm.esc(label)}${count != null ? `<span class="job__tab-count">${count}</span>` : ""}</button>`;
}

// Post-signature job pipeline. Once a contract is signed the project enters
// 'contracted' (Booked) and advances Booked → Scheduled → Installing → Completed.
// Each step routes to the appropriate workflow action so the stage is never set
// without its prerequisite (e.g. "Scheduled" always captures an install date).
const JOB_PIPELINE = [
  { key: "contracted",        label: "Booked",     action: "quickStatus('contracted')" },
  { key: "scheduled_install", label: "Scheduled",  action: "scheduleInstall()" },
  { key: "installing",        label: "Installing", action: "quickStatus('installing')" },
  { key: "completed",         label: "Completed",  action: "completeJob()" },
];
function renderJobPipeline(project) {
  const keys = JOB_PIPELINE.map((s) => s.key);
  const cur = keys.indexOf(project.status);
  if (cur < 0) return ""; // Not a booked job yet — pre-contract projects don't show the job pipeline.
  return `
    <div class="pipeline-bar" style="margin:0 0 14px">
      ${JOB_PIPELINE.map((s, i) => {
        const stateCls = i < cur ? "done" : i === cur ? "current" : "future";
        return `<button class="pipeline-step ${stateCls}" type="button" onclick="${s.action}" title="${s.label}">
          <span class="pipeline-step__dot">${i + 1}</span>
          <span class="pipeline-step__label">${s.label}</span>
        </button>`;
      }).join("")}
    </div>`;
}

// Contextual action card under the pipeline — the single next step for the job.
// Inline install-date picker — set or change the date right here; it saves the
// moment a date is chosen (no modal), and moves the job forward automatically.
function installDateField(project) {
  return `<label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);font-weight:600">
    📅 Install date
    <input type="date" value="${project.install_date || ""}" onchange="setInstallDate(this.value)"
      style="padding:7px 10px;border:2px solid var(--line);border-radius:8px;font:inherit;color:var(--ink)"/>
  </label>`;
}

function renderJobActions(project) {
  const s = project.status;
  if (!["contracted", "scheduled_install", "installing", "completed"].includes(s)) return "";
  const when = project.install_date ? SSCrm.fmtDay(project.install_date) : "";
  const dateField = installDateField(project);
  let body = "";
  if (s === "contracted") {
    body = `
      <div class="job-action__text"><strong>Job booked.</strong> Pick an install date to schedule it.</div>
      <div class="job-action__btns">${dateField}</div>`;
  } else if (s === "scheduled_install") {
    body = `
      <div class="job-action__text"><strong>Install scheduled${when ? ` for ${when}` : ""}.</strong> It moves to <em>Installing</em> automatically on that date.</div>
      <div class="job-action__btns">${dateField}<button class="btn ghost" onclick="quickStatus('installing')">Start install now</button></div>`;
  } else if (s === "installing") {
    body = `
      <div class="job-action__text"><strong>Installation in progress${when ? ` — install date ${when}` : ""}.</strong> Mark it complete when the work is finished.</div>
      <div class="job-action__btns">${dateField}<button class="btn primary" onclick="completeJob()">✓ Complete job</button></div>`;
  } else if (s === "completed") {
    body = `
      <div class="job-action__text"><strong>Job completed 🎉</strong>${when ? ` &nbsp;Installed ${when}.` : ""}</div>
      <div class="job-action__btns">${dateField}</div>`;
  }
  return `<div class="job-action card">${body}</div>`;
}

// Save the picked install date and advance the job. Setting a date on a booked
// (or scheduled) job moves it to Scheduled, or straight to Installing if the
// date is today/past. On an already-installing/completed job it just corrects
// the date without changing the status.
async function setInstallDate(date) {
  if (!date) return;
  const s = state?.project?.status;
  const body = { install_date: date };
  if (s === "contracted" || s === "scheduled_install") {
    body.status = (date <= localToday()) ? "installing" : "scheduled_install";
  }
  try {
    await SSCrm.fetchJSON("/api/projects/" + id, { method: "PATCH", body: JSON.stringify(body) });
    SSCrm.toast("Install date saved", "success");
    await render();
  } catch (e) { SSCrm.toast(e.message || "Could not save the date", "error"); }
}

async function quickStatus(key) {
  try {
    await SSCrm.fetchJSON("/api/projects/" + id, { method: "PATCH", body: JSON.stringify({ status: key }) });
    SSCrm.toast("Status updated", "success");
    await render();
  } catch (e) { SSCrm.toast(e.message || "Could not update status", "error"); }
}

// Local calendar date as YYYY-MM-DD (not UTC — avoids an off-by-one in the
// evening when the browser is behind UTC).
function localToday() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
}

// Date-picker modal → set install_date + move the job to Scheduled.
function promptInstallDate(current) {
  return new Promise((resolve) => {
    const today = localToday();
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `
      <div class="modal" style="max-width:380px">
        <div class="modal-head">Schedule installation</div>
        <div class="modal-body">
          <label style="display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px">Install date</label>
          <input id="install-date-input" type="date" value="${current || ""}" min="${today}"
            style="width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:8px;font:inherit;box-sizing:border-box"/>
        </div>
        <div class="modal-foot">
          <button class="btn ghost" data-cancel>Cancel</button>
          <button class="btn primary" data-save>Schedule</button>
        </div>
      </div>`;
    document.body.appendChild(bg);
    const input = bg.querySelector("#install-date-input");
    setTimeout(() => input.focus(), 30);
    const close = (v) => { bg.remove(); resolve(v); };
    bg.querySelector("[data-cancel]").onclick = () => close(null);
    bg.querySelector("[data-save]").onclick = () => {
      if (!input.value) { input.style.borderColor = "#D2683F"; input.focus(); return; }
      close(input.value);
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && input.value) close(input.value); });
    bg.addEventListener("click", (e) => { if (e.target === bg) close(null); });
  });
}

async function scheduleInstall() {
  const date = await promptInstallDate(state?.project?.install_date || "");
  if (!date) return;
  // If the install date is today (or earlier), the job is installing right now —
  // move it straight to "installing" instead of waiting for the cron sweep.
  // Future dates go to "scheduled_install" and auto-advance on the day.
  const isNow = date <= localToday();
  try {
    await SSCrm.fetchJSON("/api/projects/" + id, {
      method: "PATCH",
      body: JSON.stringify({ status: isNow ? "installing" : "scheduled_install", install_date: date }),
    });
    SSCrm.toast(isNow ? "Install started" : "Install scheduled", "success");
    await render();
  } catch (e) { SSCrm.toast(e.message || "Could not schedule", "error"); }
}

async function completeJob() {
  if (!(await SSCrm.confirmDialog("Mark this job as completed?"))) return;
  try {
    await SSCrm.fetchJSON("/api/projects/" + id, { method: "PATCH", body: JSON.stringify({ status: "completed" }) });
    SSCrm.toast("Job completed", "success");
    await render();
  } catch (e) { SSCrm.toast(e.message || "Could not complete", "error"); }
}

function renderCta(c) {
  const cls = c.kind === "primary" ? "primary" : "secondary";
  if (c.href) return `<a class="btn lg ${cls} job__big-cta" href="${c.href}">${SSCrm.esc(c.label)}</a>`;
  return `<button class="btn lg ${cls} job__big-cta" onclick="${c.action}">${SSCrm.esc(c.label)}</button>`;
}

function switchTab(tab) {
  document.querySelectorAll(".job__tab").forEach((t) => t.classList.toggle("is-active", t.dataset.tab === tab));
  location.hash = `tab=${tab}`;
  const body = document.getElementById("tab-body");
  const { project, windows, estimates, proposals, contracts } = state;

  if (tab === "overview") {
    body.innerHTML = renderOverview(state);
    loadFinancials();
  }
  else if (tab === "messages") {
    body.innerHTML = `<div id="email-timeline"></div>`;
    const emailHost = document.getElementById("email-timeline");
    const refresh = () => SSCrm.renderEmailTimeline(emailHost, {
      project_id: project.id,
      onCompose: async () => {
        const res = await SSCrm.composeEmail({
          contact: { id: project.contact_id, name: project.contact_name, email: project.contact_email, phone: project.contact_phone, address_street: project.site_address || "" },
          project,
        });
        if (res?.ok) refresh();
      },
    });
    refresh();
  }
  else if (tab === "proposals") body.innerHTML = renderDocTab(proposals, "proposal", "PROP", newProposal);
  else if (tab === "contracts") body.innerHTML = renderDocTab(contracts, "contract", "C", newContract);
  else if (tab === "invoices") { body.innerHTML = `<div id="invoices-host" class="muted">Loading…</div>`; loadInvoices(); }
  else if (tab === "activity") body.innerHTML = `<div id="activity-feed" class="muted">Loading…</div>`, loadActivity();
}

// ───────── Invoices tab (Stripe-backed deposit/balance/custom invoices) ─────────
const INV_STATUS = {
  open:  { label: "Awaiting payment", cls: "" },
  processing: { label: "Processing", cls: "" },
  paid:  { label: "Paid", cls: "completed" },
  void:  { label: "Void", cls: "lost" },
  draft: { label: "Draft", cls: "draft" },
};
const INV_TYPE = { deposit: "Deposit", scheduling: "Scheduling", balance: "Final", full: "Full", custom: "Custom" };

let _jobInvoices = [];
async function loadInvoices() {
  const host = document.getElementById("invoices-host");
  try {
    const { invoices } = await SSCrm.fetchJSON(`/api/invoices?project_id=${id}`);
    _jobInvoices = invoices || [];
    renderInvoices(host, _jobInvoices);
  } catch (e) { host.innerHTML = `<div class="empty">Couldn't load invoices.</div>`; }
}
async function jobRecordPayment(invId) {
  const inv = _jobInvoices.find((x) => x.id === invId);
  if (!inv) return;
  // Pass the whole-job balance so the modal can offer a one-tap "Full job
  // balance" — the common case of a customer settling everything at once
  // instead of paying this milestone only.
  const jobTotal = jobTotalCents();
  const paid = (state.billing && state.billing.paid_cents) || 0;
  const jobBalanceCents = jobTotal != null ? Math.max(0, jobTotal - paid) : undefined;
  const r = await SSCrm.recordPayment(inv, { jobBalanceCents });
  if (r) loadInvoices();
}

// Record money taken outside the normal 50/25/25 milestones — cash, check, a
// card run in person, a Klarna payout. No invoice needs to exist first.
// Routing: if the job has open invoices, the payment lands on the oldest one
// and the server cascades any surplus down the rest (so a single $5,000 check
// settles deposit + scheduling + part of the balance in one shot). If nothing
// is open, a custom invoice is created (never emailed) and settled at once, so
// the money still shows in the ledger, the job balance and Reports.
async function jobRecordAnyPayment() {
  const m = SSCrm.fmtMoney, e = SSCrm.esc;
  const jobTotal = jobTotalCents();
  const paidSoFar = (state.billing && state.billing.paid_cents) || 0;
  const balance = jobTotal != null ? Math.max(0, jobTotal - paidSoFar) : 0;
  const today = new Date().toISOString().slice(0, 10);

  let invoices = [];
  try { invoices = (await SSCrm.fetchJSON("/api/invoices?project_id=" + id)).invoices || []; } catch (err) {}
  // Oldest still-owing invoice: the payment lands here and the server rolls any
  // surplus down the rest. Null when the job has nothing outstanding billed.
  const target = invoices
    .filter((iv) => (iv.status === "open" || iv.status === "processing") && (iv.amount_cents || 0) > (iv.amount_paid_cents || 0))
    .sort((a, b) => String(a.created_at || "").localeCompare(String(b.created_at || "")) || (a.id - b.id))[0];

  const chips = [];
  if (balance > 0) {
    chips.push({ cents: balance, label: "Full balance · " + m(balance) });
    const half = Math.round(balance / 2);
    if (half > 0 && half !== balance) chips.push({ cents: half, label: "Half · " + m(half) });
  }
  if (target) {
    const rem = (target.amount_cents || 0) - (target.amount_paid_cents || 0);
    if (rem > 0 && !chips.some((c) => c.cents === rem)) chips.push({ cents: rem, label: `${target.number} · ${m(rem)}` });
  }

  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal" style="max-width:460px">
      <div class="modal-head">Record a payment</div>
      <div class="modal-body">
        <p class="muted" style="font-size:12px;margin:0 0 12px">
          Balance due on this job: <strong style="color:var(--ink)">${balance > 0 ? m(balance) : "$0.00 — paid in full"}</strong>
        </p>
        <div class="form">
          <label><span>Amount</span><input id="jp-amt" type="text" inputmode="decimal" value="${balance > 0 ? m(balance) : ""}" placeholder="0.00"/></label>
          ${chips.length ? `<div id="jp-quick" style="display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 2px">
            ${chips.map((c) => `<button type="button" class="btn ghost sm" data-amt="${c.cents}" style="font-size:12px;padding:4px 10px">${e(c.label)}</button>`).join("")}
          </div>` : ""}
          <div class="row">
            <label><span>Method</span><select id="jp-method"><option>Check</option><option>Cash</option><option>Card</option><option>Bank transfer</option><option>Klarna</option><option>Other</option></select></label>
            <label><span>Reference <span class="muted" style="font-weight:400">(check #, etc.)</span></span><input id="jp-ref" placeholder="optional"/></label>
          </div>
          <label><span>Date received</span><input id="jp-date" type="date" value="${today}"/></label>
          <label><span>What it's for</span><input id="jp-desc" value="Payment received" placeholder="Payment received"/></label>
          <label style="flex-direction:row;align-items:center;gap:8px;margin-top:2px"><input id="jp-receipt" type="checkbox" style="width:16px;height:16px"/> <span>Email the customer a receipt</span></label>
        </div>
        <p class="muted" style="font-size:11px;margin:10px 0 0;line-height:1.5">
          ${target
            ? `Applied to ${e(target.number)} first — anything above it rolls down to this job's other open invoices.`
            : `No open invoices on this job, so this is logged on its own and counts toward the balance.`}
        </p>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" data-cancel>Cancel</button>
        <button class="btn primary" data-save>Record payment</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelector("[data-cancel]").onclick = close;
  bg.addEventListener("click", (ev) => { if (ev.target === bg) close(); });
  const amtI = bg.querySelector("#jp-amt");
  bg.querySelectorAll("#jp-quick [data-amt]").forEach((b) => {
    b.onclick = () => { amtI.value = m(parseInt(b.dataset.amt, 10)); amtI.focus(); };
  });
  amtI.focus();

  bg.querySelector("[data-save]").onclick = async () => {
    const btn = bg.querySelector("[data-save]");
    const amt = SSCrm.parseMoney(amtI.value);
    if (!amt || amt <= 0) { SSCrm.toast("Enter a valid amount", "error"); return; }
    const method = bg.querySelector("#jp-method").value;
    const ref = bg.querySelector("#jp-ref").value.trim();
    const paid_at = bg.querySelector("#jp-date").value;
    const send_receipt = bg.querySelector("#jp-receipt").checked;
    const desc = bg.querySelector("#jp-desc").value.trim() || "Payment received";
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      let msg;
      if (target) {
        const r = await SSCrm.fetchJSON(`/api/invoices/${target.id}`, { method: "POST", body: JSON.stringify({
          action: "mark_paid", amount_cents: amt, method, reference: ref, paid_at, send_receipt,
        })});
        const extra = (r.applied || []).length ? ` · also applied to ${r.applied.length} more invoice${r.applied.length === 1 ? "" : "s"}` : "";
        const over = r.unapplied_cents > 0 ? ` · ${m(r.unapplied_cents)} over the job total` : "";
        msg = [(r.paid ? "Paid in full" : "Payment recorded") + extra + over, over ? "error" : "success"];
      } else {
        // Nothing outstanding is billed — create the invoice and settle it in
        // the same call so the money lands in the ledger and Reports.
        await SSCrm.fetchJSON("/api/invoices", { method: "POST", body: JSON.stringify({
          project_id: id, type: "custom", amount_cents: amt, description: desc,
          send: false, mark_paid: true, method: ref ? `${method} · ${ref}` : method, paid_at, send_receipt,
        })});
        msg = ["Payment recorded", "success"];
      }
      close();
      SSCrm.toast(msg[0], msg[1]);
      loadInvoices();
      // Refresh the cached billing totals without re-rendering (and losing the tab).
      SSCrm.fetchJSON("/api/projects/" + id).then((s) => { if (s && s.billing) state.billing = s.billing; }).catch(() => {});
    } catch (err) {
      SSCrm.toast(err.message || "Could not record payment", "error");
      btn.disabled = false; btn.textContent = "Record payment";
    }
  };
}

// Job (contract) value, from the most authoritative contract on the project.
function jobTotalCents() {
  const ks = (state?.contracts || []).slice();
  if (!ks.length) return null;
  const rank = { fully_executed: 0, signed_by_customer: 1, sent: 2 };
  ks.sort((a, b) => ((rank[a.status] ?? 3) - (rank[b.status] ?? 3)) || (b.id - a.id));
  return ks[0].total_cents != null ? ks[0].total_cents : null;
}

function renderInvoices(host, invoices) {
  const m = SSCrm.fmtMoney, e = SSCrm.esc;
  const phone = (state?.project?.contact_phone || "").replace(/[^0-9+]/g, "");

  const open       = invoices.filter((iv) => iv.status === "open");
  const processing = invoices.filter((iv) => iv.status === "processing");
  const paid       = invoices.filter((iv) => iv.status === "paid");
  const voided     = invoices.filter((iv) => iv.status === "void");

  const paidCents = paid.reduce((s, iv) => s + (iv.amount_cents || 0), 0);
  const openCents = open.reduce((s, iv) => s + (iv.amount_cents || 0), 0);
  const jobTotal  = jobTotalCents();
  const balanceDue = jobTotal != null ? Math.max(0, jobTotal - paidCents) : openCents;

  const stat = (label, val, color) => `<div style="min-width:110px">
      <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em">${label}</div>
      <div style="font-size:22px;font-weight:800;${color ? `color:${color}` : ""}">${val}</div></div>`;

  const summary = `<div class="card" style="display:flex;gap:22px;flex-wrap:wrap;align-items:center">
      ${stat("Job total", jobTotal != null ? m(jobTotal) : "—")}
      ${stat("Paid", m(paidCents), "#10B981")}
      ${stat("Balance due", m(balanceDue), balanceDue > 0 ? "#B45309" : "#10B981")}
      ${(jobTotal && balanceDue === 0 && paidCents >= jobTotal) ? `<div style="background:#ECFDF5;color:#15803D;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px">✓ Paid in full</div>` : ""}
      <div style="flex:1;min-width:200px;text-align:right;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">
        <button class="btn primary sm" onclick="jobRecordAnyPayment()">💵 Record a payment</button>
        <button class="btn secondary sm" onclick="createFullInvoice()">+ Full payment</button>
        <button class="btn secondary sm" onclick="createInvoiceUI('deposit')">+ Deposit</button>
        <button class="btn secondary sm" onclick="createInvoiceUI('balance')">+ Balance</button>
        <button class="btn secondary sm" onclick="createInvoiceUI('custom')">+ Custom</button>
      </div>
    </div>`;

  const numLink = (iv) => `<a href="/crm/invoice.html?id=${iv.id}" style="color:inherit"><strong>${e(iv.number)}</strong></a>`;
  const openBtn = (iv) => `<a class="btn primary sm" href="/crm/invoice.html?id=${iv.id}">Open →</a>`;

  const openRows = open.map((iv) => `<tr>
      <td>${numLink(iv)}<div class="muted" style="font-size:12px">${e(INV_TYPE[iv.type] || iv.type)}${iv.description ? " · " + e(iv.description) : ""}${(iv.amount_paid_cents || 0) > 0 ? ` · ${m(iv.amount_paid_cents)} paid` : ""}</div></td>
      <td class="money">${m(iv.amount_cents)}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn primary sm" onclick="jobRecordPayment(${iv.id})">💵 Record payment</button> <button class="btn ghost sm" onclick="copyPayLink('https://nationalclosetco.com/invoice/?t=${e(iv.view_token)}')">Copy link</button> ${openBtn(iv)}</td>
    </tr>`).join("");

  const procRows = processing.map((iv) => `<tr>
      <td>${numLink(iv)}<div class="muted" style="font-size:12px">${e(INV_TYPE[iv.type] || iv.type)} · <span style="color:#92400E;font-weight:600">⏳ ${iv.paid_method === "us_bank_account" ? "ACH bank transfer" : (e(iv.paid_method) || "payment")} processing</span></div></td>
      <td class="money">${m(iv.amount_cents)}</td>
      <td style="text-align:right;white-space:nowrap"><span class="pill" style="background:#FEF3C7;color:#92400E;border:1px solid #FDE68A">Clearing…</span> <button class="btn ghost sm" onclick="jobRecordPayment(${iv.id})" title="Manually mark this paid (e.g. the bank transfer cleared)">Mark paid</button> ${openBtn(iv)}</td>
    </tr>`).join("");

  const custLink = (iv) => iv.view_token ? `<a class="btn ghost sm" href="https://nationalclosetco.com/invoice/?t=${e(iv.view_token)}" target="_blank" rel="noopener" title="Open the customer-facing invoice">↗ Link</a> ` : "";
  const paidRows = paid.map((iv) => `<tr>
      <td>${numLink(iv)}<div class="muted" style="font-size:12px">${e(INV_TYPE[iv.type] || iv.type)} · paid ${e(SSCrm.fmtDate(iv.paid_at))}${iv.paid_method ? ` · ${e(iv.paid_method)}` : ""}</div></td>
      <td class="money">${m(iv.amount_cents)}</td>
      <td style="text-align:right;white-space:nowrap">${custLink(iv)}${openBtn(iv)}</td>
    </tr>`).join("");

  const voidRows = voided.map((iv) => `<tr style="opacity:.55">
      <td>${numLink(iv)} <span class="muted" style="font-size:12px">${e(INV_TYPE[iv.type] || iv.type)}</span></td>
      <td class="money">${m(iv.amount_cents)}</td>
      <td style="text-align:right">${openBtn(iv)}</td>
    </tr>`).join("");

  const section = (title, rows, n, color) => rows ? `<div class="card">
      <div class="card-head"><h3>${title} <span class="muted" style="font-weight:500">· ${n}</span></h3></div>
      <div class="tbl" style="border:0"><table><tbody>${rows}</tbody></table></div>
    </div>` : "";

  host.innerHTML = invoices.length
    ? summary
      + section("Outstanding", openRows, open.length)
      + section("Processing", procRows, processing.length)
      + section("Paid", paidRows, paid.length)
      + section("Voided", voidRows, voided.length)
    : summary + `<div class="card"><div class="empty">No invoices yet. Create a deposit or balance invoice — the customer pays by card online.</div></div>`;
}

async function createInvoiceUI(type) {
  let amountCents, description;
  if (type === "custom") {
    const amt = prompt("Invoice amount (USD):", "");
    if (amt == null) return;
    const dollars = parseFloat(String(amt).replace(/[^0-9.]/g, ""));
    if (!dollars || dollars <= 0) { SSCrm.toast("Enter a valid amount", "error"); return; }
    amountCents = Math.round(dollars * 100);
    description = prompt("Description (optional):", "Custom invoice") || "Custom invoice";
  }
  try {
    const body = { project_id: id, type };
    if (amountCents != null) body.amount_cents = amountCents;
    if (description) body.description = description;
    const r = await SSCrm.fetchJSON("/api/invoices", { method: "POST", body: JSON.stringify(body) });
    SSCrm.toast(r.deduped ? "Invoice already existed" : "Invoice created & emailed", "success");
    loadInvoices();
  } catch (e) { SSCrm.toast(e.message || "Could not create invoice", "error"); }
}
// Bill the full job total in a single invoice — bypasses the deposit/balance
// split. Voids any open deposit/balance first so the job isn't double-billed.
async function createFullInvoice() {
  const total = jobTotalCents();
  if (total == null || total <= 0) { SSCrm.toast("This job has no contract total to bill.", "error"); return; }
  let invoices = [];
  try { invoices = (await SSCrm.fetchJSON("/api/invoices?project_id=" + id)).invoices || []; } catch (e) {}
  const active = invoices.filter((iv) => iv.status !== "void");
  if (active.some((iv) => iv.status === "paid" || (iv.amount_paid_cents || 0) > 0)) {
    SSCrm.toast("Payments have already started on this job — use “+ Balance” for the remainder.", "error");
    return;
  }
  const openOnes = active.filter((iv) => iv.status === "open");
  const msg = openOnes.length
    ? `Bill the full ${SSCrm.fmtMoney(total)} in one invoice? This voids the ${openOnes.length} open invoice${openOnes.length === 1 ? "" : "s"} (deposit/balance) so the job isn't double-billed.`
    : `Create a single full-payment invoice for ${SSCrm.fmtMoney(total)}?`;
  if (!(await SSCrm.confirmDialog(msg))) return;
  try {
    for (const iv of openOnes) {
      await SSCrm.fetchJSON(`/api/invoices/${iv.id}`, { method: "POST", body: JSON.stringify({ action: "void" }) });
    }
    await SSCrm.fetchJSON("/api/invoices", { method: "POST", body: JSON.stringify({ project_id: id, type: "full" }) });
    SSCrm.toast("Full-payment invoice created & emailed", "success");
    loadInvoices();
  } catch (e) { SSCrm.toast(e.message || "Could not create invoice", "error"); }
}
async function resendInvoice(iid) {
  try { await SSCrm.fetchJSON(`/api/invoices/${iid}`, { method: "POST", body: JSON.stringify({ action: "resend" }) }); SSCrm.toast("Invoice re-sent", "success"); }
  catch (e) { SSCrm.toast(e.message || "Could not resend", "error"); }
}
async function voidInvoice(iid) {
  if (!(await SSCrm.confirmDialog("Void this invoice? The customer will no longer be able to pay it."))) return;
  try { await SSCrm.fetchJSON(`/api/invoices/${iid}`, { method: "POST", body: JSON.stringify({ action: "void" }) }); SSCrm.toast("Invoice voided", "success"); loadInvoices(); }
  catch (e) { SSCrm.toast(e.message || "Could not void", "error"); }
}
async function markInvoicePaid(iid) {
  if (!(await SSCrm.confirmDialog("Mark this invoice paid (e.g. cash/check received)?"))) return;
  try { await SSCrm.fetchJSON(`/api/invoices/${iid}`, { method: "POST", body: JSON.stringify({ action: "mark_paid", method: "manual" }) }); SSCrm.toast("Marked paid", "success"); loadInvoices(); }
  catch (e) { SSCrm.toast(e.message || "Could not update", "error"); }
}
function copyPayLink(url) { navigator.clipboard.writeText(url).then(() => SSCrm.toast("Pay link copied", "success"), () => SSCrm.toast(url, "info")); }

          <div class="card-head">
            <h3>🔒 Internal notes</h3>
            <span class="muted" style="font-size:11px">staff only · never shown to the customer${(s.notes||[]).length ? " · " + s.notes.length : ""}</span>
          </div>
          <div id="pnotes-list">${renderProjectNotes(s.notes || [])}</div>
          <form onsubmit="addProjectNote(event)" style="display:grid;gap:8px;margin-top:10px">
            <textarea id="pnote-body" rows="3" required placeholder="Call summary, install snags, gate code, material delays, what the customer asked for…"
              style="width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font:inherit;font-size:13px;resize:vertical"></textarea>
            <div><button type="submit" class="btn primary sm">+ Add note</button></div>
          </form>
        </div>
      </div>

      <div class="lead-grid__side">
        <div class="card">
          <div class="card-head"><h3>Quick actions</h3></div>
          <div style="display:grid;gap:8px">
            <a class="btn secondary" href="/crm/worksheet.html?id=${project.id}" target="_blank">🖨 Install worksheet</a>
            <button class="btn primary" onclick="newProposal()">+ Proposal</button>
            <button class="btn secondary" onclick="newContract()">+ Contract</button>
            ${project.contact_email ? `<button class="btn secondary" onclick="composeFromOverview()">✉️ Send email</button>` : ""}
            ${project.contact_phone ? `<a class="btn ghost" href="tel:${e(project.contact_phone)}">📞 Call</a>` : ""}
            ${project.contact_phone ? `<a class="btn ghost" href="sms:${e(project.contact_phone)}">💬 Text</a>` : ""}
          </div>
        </div>

        <!-- Destructive action lives apart from the everyday quick-actions card
             so it's harder to mis-click. Confirmation modal shows a count of
             everything that will be wiped before the request fires. -->
        <div class="card" style="margin-top:14px;border-color:#FEE2E2;background:#FEF2F2">
          <div class="card-head"><h3 style="color:#991B1B">Danger zone</h3></div>
          <p class="muted" style="font-size:12px;line-height:1.5;margin:0 0 10px;color:#991B1B">Permanently remove this job and everything tied to it — proposals, contracts, windows, appointments, emails, and the originating lead. The customer's contact record stays. This cannot be undone.</p>
          <button class="btn danger" style="width:100%" onclick="purgeJob()">🗑 Delete &amp; purge this job</button>
        </div>
      </div>
    </div>
  `;
}

// Compose helper called from the Overview Quick-actions panel
async function composeFromOverview() {
  const { project } = state;
  const res = await SSCrm.composeEmail({
    contact: { id: project.contact_id, name: project.contact_name, email: project.contact_email, phone: project.contact_phone, address_street: project.site_address || "" },
    project,
  });
  if (res?.ok) render();
}

// ───────── Materials status (ordered / received / damaged) ─────────
// ───────── Internal notes (staff-only; never customer-facing) ─────────
function renderProjectNotes(arr) {
  if (!arr || !arr.length) {
    return `<p class="muted" style="font-size:13px;margin:0;font-style:italic">No internal notes yet.</p>`;
  }
  return `<ul class="activity">${arr.map((n) => `
    <li>
      <span class="activity__icon">📝</span>
      <div class="activity__body">
        <div style="white-space:pre-wrap">${SSCrm.esc(n.body)}</div>
        <div class="activity__time">${SSCrm.esc(n.author || "—")} · ${SSCrm.fmtDateTime(n.created_at)}
          <a href="#" onclick="deleteProjectNote(event, ${n.id})" style="margin-left:8px;color:#991B1B;font-size:11px">delete</a>
        </div>
      </div>
    </li>`).join("")}</ul>`;
}

async function addProjectNote(ev) {
  ev.preventDefault();
  const ta = document.getElementById("pnote-body");
  const body = (ta.value || "").trim();
  if (!body) return;
  const btn = ev.target.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const r = await SSCrm.fetchJSON(`/api/projects/${state.project.id}/notes`, {
      method: "POST", body: JSON.stringify({ body }),
    });
    state.notes = r.notes;                       // keep local state in step
    document.getElementById("pnotes-list").innerHTML = renderProjectNotes(state.notes);
    ta.value = "";
    SSCrm.toast("Note added", "success");
  } catch (err) {
    SSCrm.toast(err.message || "Could not save the note", "error");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "+ Add note"; }
  }
}

async function deleteProjectNote(ev, noteId) {
  ev.preventDefault();
  if (!confirm("Delete this internal note?")) return;
  try {
    const r = await SSCrm.fetchJSON(`/api/projects/${state.project.id}/notes?note_id=${noteId}`, { method: "DELETE" });
    state.notes = r.notes;
    document.getElementById("pnotes-list").innerHTML = renderProjectNotes(state.notes);
  } catch (err) { SSCrm.toast(err.message || "Could not delete", "error"); }
}

function renderMaterialsCard(project) {
  const row = (key, label, color) => {
    const at = project[key + "_at"];

    </label>`;
  };

async function toggleMaterial(key, checked) {

// ───────── Expenses & profit (cost model mirrors functions/_lib/financials.js) ─────────
let finState = null;
const finDollars = (cents) => (Math.max(0, cents || 0) / 100).toFixed(2);
const finToCents = (v) => Math.max(0, Math.round((parseFloat(String(v).replace(/[^0-9.]/g, "")) || 0) * 100));
// Only install labor auto-computes (10% of gross, min $350). The processing fee
// can be a % of the total or a flat $. Every other line is entered by hand.
const FIN_LABOR_RATE = 0.10, FIN_MIN_LABOR = 35000, FIN_FEE_RATE_DEF = 0.03;

async function loadFinancials() {
  const host = document.getElementById("fin-host");
  if (!host || !state.project) return;
  try {
    const r = await SSCrm.fetchJSON(`/api/projects/${state.project.id}/financials`);
    finState = r.financials;
    finRender();
  } catch (err) {
    host.innerHTML = `<span class="muted">Couldn't load: ${SSCrm.esc(err.message)}</span>`;
  }
}

// A $/% segmented toggle for fields that can be entered either way (the
// discount). Whatever is typed resolves to cents — the percentage is an entry
// convenience, not a stored rate.
const finUnitMode = { discount: "usd", fee: "usd", manufacturer_discount: "usd" };
const finUnitBtn = (on) => `padding:1px 6px;border:1px solid var(--line);font:inherit;font-size:11px;font-weight:700;line-height:16px;cursor:pointer;background:${on ? "var(--ink)" : "#fff"};color:${on ? "#fff" : "var(--ink-soft)"}`;
function finUnitTog(key, disabled) {
  const m = finUnitMode[key];
  return `<span style="margin-right:6px;display:inline-flex;${disabled ? "opacity:.45;pointer-events:none" : ""}">
    <button type="button" id="fin-${key}-usd" onclick="finUnitToggle('${key}','usd')" style="${finUnitBtn(m === "usd")};border-radius:5px 0 0 5px">$</button
    ><button type="button" id="fin-${key}-pct" onclick="finUnitToggle('${key}','pct')" style="${finUnitBtn(m === "pct")};border-left:0;border-radius:0 5px 5px 0">%</button>
  </span>`;
}
function finUnitToggle(key, mode) {
  finUnitMode[key] = mode === "pct" ? "pct" : "usd";
  const auto = document.getElementById(`fin-${key}-auto`);
  // Switching units on an auto field would be meaningless — the value is
  // overwritten from the proposal on every recalc. Flip it to manual.
  if (auto && auto.checked) { auto.checked = false; finToggle(key); }
  document.getElementById(`fin-${key}-usd`).setAttribute("style", finUnitBtn(finUnitMode[key] === "usd") + ";border-radius:5px 0 0 5px");
  document.getElementById(`fin-${key}-pct`).setAttribute("style", finUnitBtn(finUnitMode[key] === "pct") + ";border-left:0;border-radius:0 5px 5px 0");
  finRecalc();
}
// Resolve a $-or-% field to cents against `base`. capToBase clamps to the base
// (used for the discount, which can't exceed the price).
function finUnitCents(key, base, capToBase) {
  const el = document.getElementById(`fin-${key}`);
  const v = parseFloat(String(el?.value || "").replace(/[^0-9.]/g, "")) || 0;
  if (v <= 0) return 0;
  const cents = finUnitMode[key] === "pct" ? Math.round(base * v / 100) : Math.round(v * 100);
  return capToBase ? Math.min(Math.max(0, cents), Math.max(0, base || 0)) : Math.max(0, cents);
}

// A plain manual $ expense line (default $0).
function finExpRow(key, label) {
  return `<tr>
    <td style="padding:6px 0">${label}</td>
    <td style="text-align:right;white-space:nowrap"><span style="color:var(--ink-soft)">$</span>
      <input id="fin-${key}" value="${finDollars(finState[key + "_cents"])}" oninput="finRecalc()" inputmode="decimal" style="width:104px;text-align:right"/>
    </td></tr>`;
}

function finRender() {

  finUnitMode.fee = feeManual ? "usd" : "pct";  // stored as a flat $ (manual) or a % (auto)
  const feePctVal = f.fee_rate != null ? +(((f.fee_rate) * 100).toFixed(4)) : 3;
  const feeVal = feeManual ? finDollars(f.processing_fee_cents) : String(feePctVal);
  const sect = (t) => `<tr><td colspan="2" style="padding:10px 0 3px"><div style="border-top:1px solid var(--line);margin-bottom:${t ? "6px" : "0"}"></div>${t ? `<span class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">${t}</span>` : ""}</td></tr>`;
  const calcRow = (label, id, val, o) => `<tr${o && o.bold ? ' style="font-weight:700"' : ""}><td style="padding:4px 0${o && o.muted ? ";color:var(--ink-soft);font-size:11px" : ""}">${label}</td><td style="text-align:right${o && o.muted ? ";color:var(--ink-soft);font-size:11px" : ""}" id="${id}">${val}</td></tr>`;
  host.innerHTML = `
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <tr>
        <td style="padding:6px 0"><strong>Gross amount</strong> <span class="muted" style="font-size:11px">· all-inclusive · pre-discount</span></td>
        <td style="text-align:right;white-space:nowrap">
          <label style="font-size:11px;color:var(--ink-soft);margin-right:8px;cursor:pointer"><input type="checkbox" id="fin-price-auto" ${f.price_auto ? "checked" : ""} onchange="finToggle('price')"/> auto</label>
          <span style="color:var(--ink-soft)">$</span>
          <input id="fin-price" value="${finDollars(f.price_cents)}" ${f.price_auto ? "readonly" : ""} oninput="finRecalc()" inputmode="decimal" style="width:104px;text-align:right;font-weight:600;${f.price_auto ? "background:var(--bg-soft);color:var(--ink-soft)" : ""}"/>
        </td>
      </tr>
      ${finExpRow("materials_charged", "Materials charged <span class='muted' style='font-size:11px'>· of gross</span>")}
      ${finExpRow("accessories_charged", "Accessories charged <span class='muted' style='font-size:11px'>· of gross</span>")}
      ${finExpRow("wall_charged", "Wall repair &amp; paint charged <span class='muted' style='font-size:11px'>· of gross</span>")}
      <tr>
        <td style="padding:8px 0 6px">Client discount <span class='muted' style='font-size:11px'>· from proposal · out of profit</span></td>
        <td style="text-align:right;white-space:nowrap">
          <label style="font-size:11px;color:var(--ink-soft);margin-right:8px;cursor:pointer"><input type="checkbox" id="fin-discount-auto" ${f.discount_auto ? "checked" : ""} onchange="finToggle('discount')"/> auto</label>
          ${finUnitTog("discount")}
          <input id="fin-discount" value="${finDollars(f.discount_cents)}" ${f.discount_auto ? "readonly" : ""} oninput="finRecalc()" inputmode="decimal" style="width:104px;text-align:right;${f.discount_auto ? "background:var(--bg-soft);color:var(--ink-soft)" : ""}"/>
          <div id="fin-discount-eq" class="muted" style="font-size:10px;margin-top:2px;height:12px"></div>
        </td>
      </tr>
      ${calcRow('Net client <span class="muted" style="font-size:11px">· after discount</span>', "fin-net", SSCrm.fmtMoney(f.net_cents))}
      ${sect("Expenses")}
      ${finExpRow("materials", "Materials expense")}
      <tr>
        <td style="padding:6px 0">Manufacturer discount <span class='muted' style='font-size:11px'>· − off materials</span></td>
        <td style="text-align:right;white-space:nowrap">
          ${finUnitTog("manufacturer_discount")}
          <input id="fin-manufacturer_discount" value="${finDollars(f.manufacturer_discount_cents)}" oninput="finRecalc()" inputmode="decimal" style="width:104px;text-align:right"/>
          <div id="fin-manufacturer_discount-eq" class="muted" style="font-size:10px;margin-top:2px;height:12px"></div>
        </td>
      </tr>
      ${finExpRow("accessories", "Accessories expense")}
      <tr>
        <td style="padding:6px 0">Install expense <span class='muted' style='font-size:11px'>· 10% of gross, min $350</span></td>
        <td style="text-align:right;white-space:nowrap">
          <label style="font-size:11px;color:var(--ink-soft);margin-right:8px;cursor:pointer"><input type="checkbox" id="fin-labor-auto" ${f.labor_auto ? "checked" : ""} onchange="finToggle('labor')"/> auto</label>
          <span style="color:var(--ink-soft)">$</span>
          <input id="fin-labor" value="${finDollars(f.labor_cents)}" ${f.labor_auto ? "readonly" : ""} oninput="finRecalc()" inputmode="decimal" style="width:104px;text-align:right;${f.labor_auto ? "background:var(--bg-soft);color:var(--ink-soft)" : ""}"/>
        </td>
      </tr>
      ${finExpRow("wall_expense", "Wall repair &amp; paint expense")}
      ${finExpRow("shipping", "Shipping expense")}
      ${finExpRow("tax", "Tax expense")}
      <tr>
        <td style="padding:6px 0">Processing fee <span class='muted' style='font-size:11px'>· % of total or flat $</span></td>
        <td style="text-align:right;white-space:nowrap">
          ${finUnitTog("fee")}
          <input id="fin-fee" value="${feeVal}" oninput="finRecalc()" inputmode="decimal" style="width:104px;text-align:right;color:#B45309"/>
          <div id="fin-fee-eq" class="muted" style="font-size:10px;margin-top:2px;height:12px"></div>
        </td>
      </tr>
      ${finExpRow("misc", "Misc")}
      ${sect("")}
      ${calcRow("Total expenses", "fin-expenses", SSCrm.fmtMoney(f.expenses_cents))}
      ${calcRow('Total net <span class="muted" style="font-size:11px">· profit</span>', "fin-profit", SSCrm.fmtMoney(f.profit_cents), { bold: true })}
      ${calcRow("Profit margin", "fin-margin", (f.net_cents ? Math.round((f.profit_cents / f.net_cents) * 100) : 0) + "%", { muted: true })}
    </table>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn primary sm" onclick="saveFinancials()">Save</button>
      <button class="btn ghost sm" onclick="resetFinancials()">Reset</button>
    </div>
    <p class="muted" style="font-size:11px;margin:8px 0 0"><strong>Gross amount</strong> is the all-inclusive price; the three <em>charged</em> lines break it down for reference (they don't change the total). Enter each <strong>expense</strong> as a dollar amount — only <strong>install</strong> is calculated (10% of gross, min $350). <strong>Manufacturer discount</strong> comes off materials. <strong>Processing fee</strong> is a % of the total or a flat $. Feeds Reports → P&amp;L.</p>`;
  finRecalc();
}

function finReadPrice() {
  return document.getElementById("fin-price-auto").checked
    ? (finState.default_price_cents || 0)
    : finToCents(document.getElementById("fin-price").value);
}

function finToggle(key) {
  const auto = document.getElementById(`fin-${key}-auto`).checked;
  const input = document.getElementById(`fin-${key}`);
  input.readOnly = auto;
  input.style.background = auto ? "var(--bg-soft)" : "";
  input.style.color = auto ? "var(--ink-soft)" : "";
  finRecalc();
}

function finRecalc() {
  const price = finReadPrice();
  if (document.getElementById("fin-price-auto").checked) document.getElementById("fin-price").value = finDollars(price);
  // Discount (auto = the proposal's $ discount) comes out of profit.
  const discAutoOn = document.getElementById("fin-discount-auto").checked;
  if (discAutoOn) { finUnitMode.discount = "usd"; document.getElementById("fin-discount").value = finDollars(finState.default_discount_cents || 0); }
  const discount = finUnitCents("discount", price, true);
  const discEq = document.getElementById("fin-discount-eq");
  if (discEq) discEq.textContent = discount > 0 && price > 0
    ? (finUnitMode.discount === "pct" ? "= " + SSCrm.fmtMoney(discount) : "= " + Math.round((discount / price) * 100) + "% off")
    : "";
  const net = price - discount;                 // gross is all-inclusive; discount out of profit
  document.getElementById("fin-net").textContent = SSCrm.fmtMoney(net);
  // Manual expense lines.
  const g = (id) => finToCents((document.getElementById(id) || {}).value || 0);
  const materials = g("fin-materials"),
        shipping = g("fin-shipping"), tax = g("fin-tax"),
        wall = g("fin-wall_expense"), accessories = g("fin-accessories"), misc = g("fin-misc");
  // Manufacturer discount ($ or % of materials) reduces the materials expense.
  const mfr = finUnitCents("manufacturer_discount", materials, true);
  const mfrEq = document.getElementById("fin-manufacturer_discount-eq");
  if (mfrEq) mfrEq.textContent = mfr > 0 && materials > 0
    ? (finUnitMode.manufacturer_discount === "pct" ? "= " + SSCrm.fmtMoney(mfr) : "= " + Math.round((mfr / materials) * 100) + "% of materials")
    : "";
  const materialsNet = Math.max(0, materials - mfr);   // mfr discount reduces materials only
  // Install expense: auto 10% of gross (min $350), overridable.
  const installAuto = document.getElementById("fin-labor-auto").checked;
  const install = installAuto ? (price > 0 ? Math.max(Math.round(price * FIN_LABOR_RATE), FIN_MIN_LABOR) : 0) : g("fin-labor");
  if (installAuto) document.getElementById("fin-labor").value = finDollars(install);
  // Processing fee: a % of the total (net) or a flat $.
  const fee = finUnitCents("fee", net, false);
  const feeEq = document.getElementById("fin-fee-eq");
  if (feeEq) feeEq.textContent = fee > 0
    ? (finUnitMode.fee === "pct" ? "= " + SSCrm.fmtMoney(fee) : (net > 0 ? "= " + (Math.round((fee / net) * 1000) / 10) + "% of total" : ""))
    : "";
  const expenses = materialsNet + accessories + install + wall + shipping + tax + fee + misc;
  document.getElementById("fin-expenses").textContent = SSCrm.fmtMoney(expenses);
  document.getElementById("fin-profit").textContent = SSCrm.fmtMoney(net - expenses);
  document.getElementById("fin-margin").textContent = (net ? Math.round(((net - expenses) / net) * 100) : 0) + "%";
}

async function saveFinancials() {
  const g = (id) => finToCents((document.getElementById(id) || {}).value || 0);
  const priceAuto = document.getElementById("fin-price-auto").checked;
  const body = {
    price_auto: priceAuto,
    materials_auto: false, shipping_auto: false, tax_auto: false,
    // revenue breakdown (informational)
    materials_charged_cents: g("fin-materials_charged"),
    accessories_charged_cents: g("fin-accessories_charged"),
    wall_charged_cents: g("fin-wall_charged"),
    // expenses
    materials_cents: g("fin-materials"),
    manufacturer_discount_cents: finUnitCents("manufacturer_discount", g("fin-materials"), true),
    accessories_cents: g("fin-accessories"),
    wall_expense_cents: g("fin-wall_expense"),
    shipping_cents: g("fin-shipping"),
    tax_cents: g("fin-tax"),
    misc_cents: g("fin-misc"),
  };
  if (!priceAuto) body.price_cents = finToCents(document.getElementById("fin-price").value);
  const discAuto = document.getElementById("fin-discount-auto").checked;
  body.discount_auto = discAuto;
  if (!discAuto) body.discount_cents = finUnitCents("discount", finReadPrice(), true);
  const laborAuto = document.getElementById("fin-labor-auto").checked;
  body.labor_auto = laborAuto;
  if (!laborAuto) body.labor_cents = g("fin-labor");
  // Processing fee: % → store a rate (auto); flat $ → store cents (manual).
  if (finUnitMode.fee === "pct") {
    const pct = parseFloat(String(document.getElementById("fin-fee").value).replace(/[^0-9.]/g, "")) || 0;
    body.fee_auto = true; body.fee_rate = Math.max(0, pct / 100);
  } else {
    body.fee_auto = false; body.fee_cents = g("fin-fee");
  }
  try {
    const r = await SSCrm.fetchJSON(`/api/projects/${state.project.id}/financials`, { method: "PUT", body: JSON.stringify(body) });
    finState = r.financials;
    finRender();
    SSCrm.toast("Saved", "success");
  } catch (err) { SSCrm.toast(err.message || "Save failed", "error"); }
}

async function resetFinancials() {
  try {
    const r = await SSCrm.fetchJSON(`/api/projects/${state.project.id}/financials`, { method: "PUT", body: JSON.stringify({
      price_auto: true, discount_auto: true, labor_auto: true, fee_auto: true, fee_rate: FIN_FEE_RATE_DEF,
      materials_auto: false, shipping_auto: false, tax_auto: false,
      materials_cents: 0, shipping_cents: 0, tax_cents: 0, accessories_cents: 0, wall_expense_cents: 0, misc_cents: 0,
      manufacturer_discount_cents: 0, materials_charged_cents: 0, accessories_charged_cents: 0, wall_charged_cents: 0,
    }) });
    finState = r.financials;
    finRender();
    SSCrm.toast("Reset", "success");
  } catch (err) { SSCrm.toast(err.message || "Reset failed", "error"); }
}

async function purgeJob() {
  const { project, windows, proposals, contracts, appointments, lead, lead_notes, email_count } = state;
  const counts = {
    Windows:      windows.length,
    Proposals:    proposals.length,
    Contracts:    contracts.length,
    Appointments: (appointments || []).length,
    Emails:       (email_count?.sent || 0) + (email_count?.received || 0),
    "Lead notes": (lead_notes || []).length,
  };
  const items = Object.entries(counts).filter(([, n]) => n > 0).map(([k, n]) =>
    `<li style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px"><span>${SSCrm.esc(k)}</span><strong>${n}</strong></li>`
  ).join("");
  const leadLine = lead ? `<li style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px"><span>Originating lead (#${lead.id})</span><strong>1</strong></li>` : "";

  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal" style="max-width:520px">
      <div class="modal-head" style="background:#FEF2F2;color:#991B1B;border-bottom:1px solid #FEE2E2">🗑 Delete &amp; purge "${SSCrm.esc(project.name)}"</div>
      <div class="modal-body">
        <p style="margin:0 0 14px;font-size:14px;line-height:1.55">This permanently removes the job AND every related record. <strong>Cannot be undone.</strong></p>
        <ul style="list-style:none;padding:0;margin:0 0 16px;border-top:1px solid var(--line-soft)">
          ${items || `<li class="muted" style="padding:8px 0;font-style:italic">Nothing additional — just the project itself.</li>`}
          ${leadLine}
        </ul>
        <p class="muted" style="font-size:12px;margin:0 0 8px">The contact <strong>${SSCrm.esc(project.contact_name)}</strong> stays — they may have other jobs or come back later.</p>
        <p style="font-size:13px;margin:14px 0 6px">Type <code style="background:var(--bg-soft);padding:2px 6px;border-radius:3px;font-family:var(--font-mono,monospace);font-size:12px">${SSCrm.esc(project.name)}</code> to confirm:</p>
        <input id="purge-confirm" autocomplete="off"
               style="width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font:inherit;font-size:14px"
               placeholder="${SSCrm.esc(project.name)}"/>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="px-cancel">Cancel</button>
        <button class="btn danger" id="px-confirm" disabled>Permanently delete</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const input = bg.querySelector("#purge-confirm");
  const btn   = bg.querySelector("#px-confirm");
  input.focus();
  input.addEventListener("input", () => { btn.disabled = input.value.trim() !== project.name; });
  bg.querySelector("#px-cancel").onclick = () => bg.remove();
  bg.addEventListener("click", (e) => { if (e.target === bg) bg.remove(); });
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Deleting…";
    try {
      const res = await SSCrm.fetchJSON(`/api/projects/${project.id}?purge=1`, { method: "DELETE" });
      bg.remove();
      const summary = res.summary || {};
      const parts = [];
      if (summary.windows)      parts.push(`${summary.windows} window${summary.windows === 1 ? "" : "s"}`);
      if (summary.proposals)    parts.push(`${summary.proposals} proposal${summary.proposals === 1 ? "" : "s"}`);
      if (summary.contracts)    parts.push(`${summary.contracts} contract${summary.contracts === 1 ? "" : "s"}`);
      if (summary.emails)       parts.push(`${summary.emails} email${summary.emails === 1 ? "" : "s"}`);
      if (summary.appointments) parts.push(`${summary.appointments} appt${summary.appointments === 1 ? "" : "s"}`);
      if (summary.lead_removed) parts.push("lead");
      SSCrm.toast(`Purged — wiped ${parts.length ? parts.join(" · ") : "just the project"}`, "success");
      setTimeout(() => { location.href = "/crm/projects.html"; }, 600);
    } catch (e) {
      btn.disabled = false; btn.textContent = "Permanently delete";
      SSCrm.toast(e.message || "Delete failed", "error");
    }
  };
}

function renderDocTab(docs, kind, prefix, addFn) {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h3 style="font-size:14px;color:var(--ink-soft)">${docs.length} ${kind}${docs.length === 1 ? "" : "s"}</h3>
      <button class="btn primary sm" onclick="${addFn.name}()">+ New ${kind}</button>
    </div>
    ${docs.length ? `<div class="tbl"><table>
      <thead><tr><th>${prefix}-#</th><th>Status</th><th class="num">Total</th><th>Activity</th><th></th></tr></thead>
      <tbody>${docs.map((d) => `
        <tr class="clickable" onclick="location.href='/crm/${kind}.html?id=${d.id}'">
          <td><strong>${SSCrm.esc(d.number || "")}</strong></td>
          <td>${SSCrm.pill(d.status)}</td>
          <td class="money">${SSCrm.fmtMoney(d.total_cents || d.selected_total_cents || 0)}</td>
          <td class="muted" style="font-size:12px">${SSCrm.fmtDate(d.updated_at || d.created_at)}</td>
          <td style="text-align:right;white-space:nowrap">${d.view_token ? `<a class="btn ghost sm" href="https://nationalclosetco.com/${kind}/?t=${SSCrm.esc(d.view_token)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open the customer-facing ${kind}">↗ Link</a> ` : ""}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle"><polyline points="9 18 15 12 9 6"/></svg></td>
        </tr>`).join("")}
      </tbody></table></div>` : `<p class="muted" style="padding:30px;text-align:center">No ${kind}s yet.</p>`}
  `;
}


async function saveProject() {
  try {
    await SSCrm.fetchJSON("/api/projects/" + id, { method: "PATCH", body: JSON.stringify({
      name: document.getElementById("p-name").value.trim(),
      status: document.getElementById("p-status").value,
      site_address: document.getElementById("p-addr").value.trim(),
      po_number: document.getElementById("p-po").value.trim(),
      description: document.getElementById("p-desc").value.trim(),
    })});
    SSCrm.toast("Saved", "success");
    await render();
  } catch (e) { SSCrm.toast(e.message, "error"); }
}

async function loadActivity() {
  try {
    // ?project_id= triggers the unified feed — pulls activity for the
    // project itself + its originating lead + every proposal/contract/
    // appointment/email_message tied to it. The legacy entity_type/entity_id
    // strict-match was only returning rows where entity_type='project'.
    const { activity } = await SSCrm.fetchJSON(`/api/activity?project_id=${id}&limit=120`);
    const feed = document.getElementById("activity-feed");
    if (!activity.length) { feed.innerHTML = `<p style="text-align:center;color:var(--ink-soft);padding:40px">No activity yet.</p>`; return; }
    feed.innerHTML = `<ul class="activity">${activity.map((a) => `
      <li>
        <span class="activity__icon" data-k="${SSCrm.esc(a.action)}">·</span>
        <div class="activity__body">
          <strong>${SSCrm.esc(a.action.replace(/-/g, " "))}</strong>
          ${a.actor_name ? `· by ${SSCrm.esc(a.actor_name)}` : ""}
          <div class="activity__time">${SSCrm.fmtDateTime(a.created_at)}</div>
        </div>
      </li>`).join("")}</ul>`;
  } catch (e) { document.getElementById("activity-feed").innerHTML = `<p class="muted">${SSCrm.esc(e.message)}</p>`; }
}

async function newEstimate() {
  try { const { id: nid } = await SSCrm.fetchJSON("/api/estimates", { method: "POST", body: JSON.stringify({ project_id: id }) }); location.href = "/crm/estimate.html?id=" + nid; }
  catch (e) { SSCrm.toast(e.message, "error"); }
}
async function newProposal() {
  const kind = await pickProposalKind();
  if (!kind) return;
  try { const { id: nid } = await SSCrm.fetchJSON("/api/proposals", { method: "POST", body: JSON.stringify({ project_id: id, proposal_kind: kind }) }); location.href = "/crm/proposal.html?id=" + nid; }
  catch (e) { SSCrm.toast(e.message, "error"); }
}
function pickProposalKind() {
  return new Promise((resolve) => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `
      <div class="modal" style="max-width:480px">
        <div class="modal-head">New proposal — choose a type</div>
        <div class="modal-body" style="display:grid;gap:10px">
          <button class="btn secondary" data-k="custom" style="justify-content:flex-start;text-align:left;padding:12px 14px">🚪 Custom closet — 2 options (walls as-is / wall repair &amp; paint)</button>
          <button class="btn secondary" data-k="install_only" style="justify-content:flex-start;text-align:left;padding:12px 14px">🔧 BYO install — customer-supplied closets</button>
          <button class="btn secondary" data-k="repair" style="justify-content:flex-start;text-align:left;padding:12px 14px">🛠️ Repair / service</button>
        </div>
        <div class="modal-foot"><button class="btn ghost" data-cancel>Cancel</button></div>
      </div>`;
    document.body.appendChild(bg);
    bg.querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => { bg.remove(); resolve(b.dataset.k); }));
    bg.querySelector("[data-cancel]").onclick = () => { bg.remove(); resolve(null); };
    bg.addEventListener("click", (e) => { if (e.target === bg) { bg.remove(); resolve(null); } });
  });
}
async function newContract() {
  // Ask which contract type
  const type = await pickContractType();
  if (!type) return;
  try {
    const { id: nid } = await SSCrm.fetchJSON("/api/contracts", { method: "POST", body: JSON.stringify({ project_id: id, contract_type: type }) });
    location.href = "/crm/contract.html?id=" + nid;
  } catch (e) { SSCrm.toast(e.message, "error"); }
}

function pickContractType() {
  return new Promise((resolve) => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `
      <div class="modal" style="max-width:520px">
        <div class="modal-head">What kind of contract?</div>
        <div class="modal-body" style="display:grid;gap:10px">
          <button class="btn secondary" data-t="custom_order" style="justify-content:flex-start;padding:14px;text-align:left;flex-direction:column;align-items:flex-start;gap:4px">
            <strong style="font-size:14px">Custom Order</strong>
            <span style="font-size:12px;color:var(--ink-soft);font-weight:400">We supply &amp; install custom-made treatments. Deposit covers materials, shipping &amp; tax. Manufacturer warranty + 90-day workmanship.</span>
          </button>
          <button class="btn secondary" data-t="install_only" style="justify-content:flex-start;padding:14px;text-align:left;flex-direction:column;align-items:flex-start;gap:4px">
            <strong style="font-size:14px">Install Only · BYO Blinds</strong>
            <span style="font-size:12px;color:var(--ink-soft);font-weight:400">Customer supplies blinds (Lowes, Home Depot, Costco, etc.). We install them. No deposit. Pay on completion. 90-day workmanship.</span>
          </button>
          <button class="btn secondary" data-t="repair" style="justify-content:flex-start;padding:14px;text-align:left;flex-direction:column;align-items:flex-start;gap:4px">
            <strong style="font-size:14px">Repair / Service Call</strong>
            <span style="font-size:12px;color:var(--ink-soft);font-weight:400">Repair an existing blind, shutter, or shade. Service-call fee + parts. Pay on completion. 90-day workmanship.</span>
          </button>
        </div>
        <div class="modal-foot"><button class="btn ghost" data-no>Cancel</button></div>
      </div>
    `;
    document.body.appendChild(bg);
    bg.querySelectorAll("[data-t]").forEach((b) => { b.onclick = () => { bg.remove(); resolve(b.dataset.t); }; });
    bg.querySelector("[data-no]").onclick = () => { bg.remove(); resolve(null); };
    bg.addEventListener("click", (e) => { if (e.target === bg) { bg.remove(); resolve(null); } });
  });
}
async function convertProposal(propId) {
  if (!(await SSCrm.confirmDialog("Create a contract from the accepted tier of this proposal?"))) return;
  try {
    const { id: nid } = await SSCrm.fetchJSON(`/api/proposals/${propId}/convert`, { method: "POST" });
    SSCrm.toast("Contract drafted from proposal", "success");
    location.href = "/crm/contract.html?id=" + nid;
  } catch (e) { SSCrm.toast(e.message, "error"); }
}
