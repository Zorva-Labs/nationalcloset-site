<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead · National Closet Company CRM</title>
  <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/crm/crm-app.css?v=ncc88" />
  <link rel="icon" href="/img/favicon-nc.png" />
</head>
<body>
<script src="/crm/crm-app.js?v=ncc88"></script>
<script>
// Lead pipeline ends at "Proposal" or "Lost". Once the contract is signed
// the lead is auto-bumped to "booked" by the contract-sign handler — at
// that point it becomes a Job and disappears from the leads UI.
const LEAD_STATUSES = [
  { key: "new",       label: "New" },
  { key: "contacted", label: "Contacted" },
  { key: "replied",   label: "Replied" },
  { key: "consult",   label: "Consult" },
  { key: "proposal",  label: "Proposal" },
  { key: "lost",      label: "Lost" },
];

const id = parseInt(new URLSearchParams(location.search).get("id"), 10);
if (!id) location.href = "/crm/leads.html";

let state = null;       // { lead, notes }
let workspace = null;   // { project, windows, proposals, contracts, invoices }

(async () => {
  const user = await SSCrm.mount({
    title: "Lead",
    actions: `<a class="btn ghost" href="/crm/leads.html">← All leads</a>`,
    wide: true,
  });
  if (!user) return;
  state = await SSCrm.fetchJSON("/api/leads/" + id);
  await loadWorkspace();
  render();
})();

async function loadWorkspace() {
  try { workspace = await SSCrm.fetchJSON(`/api/leads/${id}/project`); }
  catch (e) { workspace = null; }
}

// ───────── Shell: header + pipeline + tab bar ─────────
function render() {
  const l = state.lead;
  document.getElementById("page-title").textContent = l.name;
  const ws = workspace || {};
  const props = ws.proposals || [];
  const contracts = ws.contracts || [];
  const invoices = ws.invoices || [];
  const notes = state.notes || [];

  const flow = ["new", "contacted", "replied", "consult", "proposal"];
  const isTerminal = l.status === "lost" || l.status === "booked" || l.status === "installed";
  const currentIdx = flow.indexOf(l.status);
  const stepper = `
    <div class="pipeline-bar">
      ${flow.map((key, i) => {
        const meta = LEAD_STATUSES.find((s) => s.key === key);
        const st = isTerminal ? "future" : (i < currentIdx ? "done" : i === currentIdx ? "current" : "future");
        return `<button class="pipeline-step ${st}" type="button" onclick="updateStatus('${key}')" title="Set status to ${meta.label}">
          <span class="pipeline-step__dot">${i + 1}</span><span class="pipeline-step__label">${meta.label}</span></button>`;
      }).join("")}
      <div class="pipeline-bar__terminal">
        <select id="status-select" onchange="updateStatus(this.value)" title="Change status">
          ${LEAD_STATUSES.map((s) => `<option value="${s.key}" ${s.key === l.status ? "selected" : ""}>${s.label}</option>`).join("")}
        </select>
      </div>
    </div>`;

  const tab = (key, label, count) => `<button class="job__tab" data-tab="${key}">${SSCrm.esc(label)}${count != null ? `<span class="job__tab-count">${count}</span>` : ""}</button>`;

  document.getElementById("page").innerHTML = `
    <div class="lead-header">
      <div class="lead-header__id">
        ${SSCrm.pill(l.status)}
        <span class="muted" style="font-size:13px">Lead #${l.id} · ${SSCrm.fmtDate(l.created_at)}</span>
      </div>
      <div class="lead-header__actions">
        <button class="btn primary" onclick="sendProposal()">+ Send proposal</button>
        ${l.contact_id ? `<a class="btn secondary" href="/crm/contact.html?id=${l.contact_id}">View contact →</a>` : `<button class="btn secondary" onclick="convertToContact()">Convert to contact + job</button>`}
        <button class="btn danger" onclick="del()">Delete</button>
      </div>
    </div>
    ${stepper}
    <nav class="job__tabs" id="tabs">
      ${tab("overview", "Overview")}
      ${tab("proposal", "Proposal", props.length)}
      ${tab("contract", "Contract", contracts.length)}
      ${tab("invoices", "Invoices", invoices.length)}
      ${tab("messages", "Messages")}
      ${tab("notes", "Notes", notes.length)}
    </nav>
    <div class="job__body" id="tab-body"></div>`;

  const initialTab = new URLSearchParams(location.hash.slice(1)).get("tab") || "overview";
  switchTab(initialTab);
  document.querySelectorAll(".job__tab").forEach((t) => t.addEventListener("click", () => switchTab(t.dataset.tab)));
}

function switchTab(tabName) {
  document.querySelectorAll(".job__tab").forEach((t) => t.classList.toggle("is-active", t.dataset.tab === tabName));
  location.hash = `tab=${tabName}`;
  const body = document.getElementById("tab-body");
  if (tabName === "proposal") body.innerHTML = renderProposalTab();
  else if (tabName === "contract") body.innerHTML = renderContractTab();
  else if (tabName === "invoices") body.innerHTML = renderInvoicesTab();
  else if (tabName === "messages") { body.innerHTML = `<div class="card"><div class="card-head"><h2>Messages</h2><span class="muted" style="font-size:12px">${state.lead.email ? "" : "Add an email to enable"}</span></div><div id="email-timeline"></div></div>`; mountTimeline(); }
  else if (tabName === "notes") body.innerHTML = renderNotesTab();
  else body.innerHTML = renderOverviewTab();
}

// ───────── Overview tab: contact details + quick actions ─────────
function renderOverviewTab() {
  const l = state.lead;
  const addrParts = [l.address_street, [l.address_city, l.address_state].filter(Boolean).join(", "), l.address_zip].filter(Boolean);
  const mapUrl = addrParts.length ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addrParts.join(", ")) : null;
  const prop = (workspace?.proposals || [])[0] || null;
  const quotedField = prop
    ? `<label>
        <span>Quoted amount <span class="muted" style="font-weight:400">· auto-linked to proposal</span></span>
        <input id="f-quoted" type="text" value="${l.quoted_amount_cents != null ? SSCrm.fmtMoney(l.quoted_amount_cents) : "—"}" readonly disabled style="background:var(--bg-soft);color:var(--ink);font-weight:600"/>
        <span class="muted" style="font-size:11px;margin-top:4px;display:block">From <a href="/crm/proposal.html?id=${prop.id}" style="color:var(--accent-ink)">${SSCrm.esc(prop.number)}</a> · <strong>${prop.selected_tier || "best"}</strong> tier · ${SSCrm.esc(prop.status)}</span>
      </label>`
    : `<label>
        <span>Quoted amount ($, optional)</span>
        <input id="f-quoted" type="text" value="${l.quoted_amount_cents ? SSCrm.fmtMoney(l.quoted_amount_cents) : ""}" placeholder="$0.00"/>
        <span class="muted" style="font-size:11px;margin-top:4px;display:block">Will auto-link once a proposal is sent.</span>
      </label>`;

  return `<div class="lead-grid">
    <div class="card lead-grid__main">
      <div class="card-head"><h2>Contact details</h2><span class="muted" style="font-size:12px">Click any field to edit</span></div>
      <div class="form">
        <label><span>Name</span><input id="f-name" value="${SSCrm.esc(l.name)}" required/></label>
        <div class="row">
          <label><span>Phone</span><input id="f-phone" type="tel" value="${SSCrm.esc(l.phone || "")}"/></label>
          <label><span>Email</span><input id="f-email" type="email" value="${SSCrm.esc(l.email || "")}"/></label>
        </div>
        <label><span>Street address</span><input id="f-street" value="${SSCrm.esc(l.address_street || "")}"/></label>
        <div class="row-3">
          <label><span>City</span><input id="f-city" value="${SSCrm.esc(l.address_city || "")}"/></label>
          <label><span>State</span><input id="f-state" value="${SSCrm.esc(l.address_state || "")}" maxlength="2"/></label>
          <label><span>ZIP</span><input id="f-zip" value="${SSCrm.esc(l.address_zip || "")}"/></label>
        </div>
        <label><span>Considering / interest</span><input id="f-interest" value="${SSCrm.esc(l.interest || "")}" placeholder="e.g. Walk-in closet, pantry"/></label>
        <label><span>Their message</span><textarea id="f-message" rows="3">${SSCrm.esc(l.message || "")}</textarea></label>
        ${quotedField}
        <div class="form-actions">
          <button class="btn primary" onclick="saveDetails()">Save changes</button>
          ${mapUrl ? `<a class="btn ghost" href="${mapUrl}" target="_blank" rel="noopener">📍 Open address in Maps</a>` : ""}
        </div>
      </div>
      <hr class="sep"/>
      <div style="display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:13px;color:var(--ink-soft)">
        <div class="muted">Submitted</div><div>${SSCrm.fmtDateTime(l.created_at)}</div>
        <div class="muted">Source page</div><div>${SSCrm.esc(l.source_page || "web")}</div>
        ${l.utm_source ? `<div class="muted">UTM source</div><div>${SSCrm.esc(l.utm_source)}${l.utm_medium ? " / " + SSCrm.esc(l.utm_medium) : ""}</div>` : ""}
        ${l.utm_campaign ? `<div class="muted">UTM campaign</div><div>${SSCrm.esc(l.utm_campaign)}</div>` : ""}
        ${l.utm_term ? `<div class="muted">Search term</div><div><strong>${SSCrm.esc(l.utm_term)}</strong></div>` : ""}
        ${l.gclid ? `<div class="muted">Google Ads</div><div><span class="pill" data-s="booked">✓ paid click</span> <span class="muted" style="font-size:11px">${SSCrm.esc(String(l.gclid).slice(0, 18))}…</span></div>` : ""}
        ${l.referrer ? `<div class="muted">Came from</div><div class="muted" style="font-size:12px;word-break:break-all">${SSCrm.esc(l.referrer)}</div>` : ""}
        ${l.landing_page ? `<div class="muted">Landed on</div><div class="muted" style="font-size:12px;word-break:break-all">${SSCrm.esc(l.landing_page)}</div>` : ""}
        ${l.referrer ? `<div class="muted">Referrer</div><div style="font-size:12px;word-break:break-all">${SSCrm.esc(l.referrer.slice(0, 100))}</div>` : ""}
      </div>
    </div>
    <div class="lead-grid__side">
      <div class="card">
        <div class="card-head"><h2>Quick actions</h2></div>
        <div style="display:grid;gap:8px">
          <button class="btn primary" onclick="sendProposal()">📄 Send a proposal</button>
          ${l.phone ? `<a class="btn secondary" href="tel:${SSCrm.esc(l.phone)}">📞 Call ${SSCrm.esc(l.phone)}</a>` : ""}
          ${l.phone ? `<a class="btn secondary" href="sms:${SSCrm.esc(l.phone)}">💬 Text</a>` : ""}
          ${l.email ? `<a class="btn secondary" href="mailto:${SSCrm.esc(l.email)}">✉️ Email</a>` : ""}
          <button class="btn secondary" onclick="bookFromLead()">📅 Book consultation</button>
          ${!l.contact_id ? `<button class="btn ghost" onclick="convertToContact()">Convert to contact (no proposal yet)</button>` : ""}
        </div>
        ${l.quoted_amount_cents ? `<p class="muted" style="font-size:13px;margin:12px 0 0">Quoted: <strong class="money">${SSCrm.fmtMoney(l.quoted_amount_cents)}</strong></p>` : ""}
      </div>
      ${l.contact_id ? `
        <div class="card" style="margin-top:14px">
          <div class="card-head"><h2>Linked contact</h2></div>
          <a class="btn secondary" href="/crm/contact.html?id=${l.contact_id}" style="width:100%;justify-content:center">Open contact →</a>
        </div>` : ""}
    </div>
  </div>`;
}

// ───────── Proposal tab ─────────
function renderProposalTab() {
  const ws = workspace || {};
  const props = ws.proposals || [];
  if (!ws.project) {
    return `<div class="card"><div class="card-head"><h2>Proposal</h2></div>
      <p class="muted" style="font-size:13px;padding:8px 0">Save the lead's email on the Overview tab, then create a proposal.</p>
      <button class="btn primary" onclick="sendProposal()">+ Create proposal</button></div>`;
  }
  return `<div class="card">
    <div class="card-head"><h2>Proposals <span class="muted" style="font-weight:500">· ${props.length}</span></h2><button class="btn primary sm" onclick="sendProposal()">+ New proposal</button></div>
    ${props.length ? `<div class="tbl"><table>
      <thead><tr><th>#</th><th>Status</th><th>Tier</th><th class="num">Total</th><th></th></tr></thead>
      <tbody>${props.map((p) => `<tr>
        <td><strong>${SSCrm.esc(p.number)}</strong></td>
        <td>${SSCrm.pill(p.status)}</td>
        <td>${p.selected_tier ? SSCrm.esc(p.selected_tier) : `<span class="muted">—</span>`}</td>
        <td class="num">${p.selected_total_cents ? SSCrm.fmtMoney(p.selected_total_cents) : `<span class="muted">—</span>`}</td>
        <td style="white-space:nowrap">${p.view_token ? `<a class="btn ghost sm" href="https://nationalclosetco.com/proposal/?t=${SSCrm.esc(p.view_token)}" target="_blank" rel="noopener" title="Customer-facing proposal">↗ Link</a> ` : ""}<a class="btn secondary sm" href="/crm/proposal.html?id=${p.id}">Open →</a></td>
      </tr>`).join("")}</tbody></table></div>`
    : `<p class="muted" style="font-size:13px;margin:10px 0 0">No proposal yet — click “+ New proposal”.</p>`}
  </div>`;
}

// ───────── Contract tab ─────────
function renderContractTab() {
  const contracts = (workspace || {}).contracts || [];
  return `<div class="card">
    <div class="card-head"><h2>Contracts <span class="muted" style="font-weight:500">· ${contracts.length}</span></h2></div>
    ${contracts.length ? `<div class="tbl"><table>
      <thead><tr><th>#</th><th>Status</th><th class="num">Total</th><th class="num">Deposit</th><th></th></tr></thead>
      <tbody>${contracts.map((k) => `<tr>
        <td><strong>${SSCrm.esc(k.number)}</strong></td>
        <td>${SSCrm.pill(k.status)}</td>
        <td class="num">${SSCrm.fmtMoney(k.total_cents)}</td>
        <td class="num">${k.deposit_cents ? SSCrm.fmtMoney(k.deposit_cents) + (k.deposit_paid ? " ✓" : "") : `<span class="muted">—</span>`}</td>
        <td style="white-space:nowrap">${k.view_token ? `<a class="btn ghost sm" href="https://nationalclosetco.com/contract/?t=${SSCrm.esc(k.view_token)}" target="_blank" rel="noopener" title="Customer-facing contract">↗ Link</a> ` : ""}<a class="btn secondary sm" href="/crm/contract.html?id=${k.id}">Open →</a></td>
      </tr>`).join("")}</tbody></table></div>`
    : `<p class="muted" style="font-size:13px;margin:10px 0 0">No contract yet — one is created when the customer accepts a proposal (or convert one from the proposal page).</p>`}
  </div>`;
}

// ───────── Invoices tab (list + record payment) ─────────
function renderInvoicesTab() {
  const ws = workspace || {};
  const invoices = ws.invoices || [];
  const projectId = ws.project ? ws.project.id : null;
  const LAB = { deposit: "Deposit", balance: "Balance", full: "Full", custom: "Custom" };
  return `<div class="card">
    <div class="card-head"><h2>Invoices <span class="muted" style="font-weight:500">· ${invoices.length}</span></h2></div>
    ${invoices.length ? `<div class="tbl"><table>
      <thead><tr><th>#</th><th>Type</th><th>Status</th><th class="num">Amount</th><th class="num">Paid</th><th></th></tr></thead>
      <tbody>${invoices.map((iv) => {
        const paid = iv.amount_paid_cents || 0;
        const open = iv.status === "open";
        return `<tr>
          <td><a href="/crm/invoice.html?id=${iv.id}"><strong>${SSCrm.esc(iv.number)}</strong></a></td>
          <td>${LAB[iv.type] || iv.type}</td>
          <td>${SSCrm.pill(iv.status)}</td>
          <td class="num">${SSCrm.fmtMoney(iv.amount_cents)}</td>
          <td class="num">${paid ? SSCrm.fmtMoney(paid) : `<span class="muted">—</span>`}</td>
          <td style="white-space:nowrap">${iv.view_token ? `<a class="btn ghost sm" href="https://nationalclosetco.com/invoice/?t=${SSCrm.esc(iv.view_token)}" target="_blank" rel="noopener" title="Customer-facing invoice">↗ Link</a> ` : ""}${open ? `<button class="btn primary sm" onclick="leadRecordPayment(${iv.id})">💵 Record payment</button>` : `<a class="btn ghost sm" href="/crm/invoice.html?id=${iv.id}">View</a>`}</td>
        </tr>`;
      }).join("")}</tbody></table></div>`
    : `<p class="muted" style="font-size:13px;margin:10px 0 0">No invoices yet.</p>`}
    ${projectId
      ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">
          <button class="btn primary sm" onclick="createLeadInvoice('full')">+ Full payment</button>
          <button class="btn secondary sm" onclick="createLeadInvoice('deposit')">+ Deposit</button>
          <button class="btn secondary sm" onclick="createLeadInvoice('balance')">+ Balance</button>
          <button class="btn secondary sm" onclick="createLeadInvoice('custom')">+ Custom</button>
        </div>`
      : `<p class="muted" style="font-size:12px;margin:12px 0 0">Send a proposal to create the job before invoicing.</p>`}
  </div>`;
}

async function leadRecordPayment(invId) {
  const inv = ((workspace || {}).invoices || []).find((x) => x.id === invId);
  if (!inv) return;
  const r = await SSCrm.recordPayment(inv);
  if (r) { await loadWorkspace(); switchTab("invoices"); }
}

async function createLeadInvoice(type) {
  const pid = (workspace || {}).project ? workspace.project.id : null;
  if (!pid) { SSCrm.toast("No project yet — send a proposal first.", "error"); return; }
  const body = { project_id: pid, type };
  if (type === "custom") {
    const amt = prompt("Invoice amount (USD):", "");
    if (amt == null) return;
    const dollars = parseFloat(String(amt).replace(/[^0-9.]/g, ""));
    if (!dollars || dollars <= 0) { SSCrm.toast("Enter a valid amount", "error"); return; }
    body.amount_cents = Math.round(dollars * 100);
    body.description = prompt("Description (optional):", "Custom invoice") || "Custom invoice";
  }
  try {
    await SSCrm.fetchJSON("/api/invoices", { method: "POST", body: JSON.stringify(body) });
    SSCrm.toast("Invoice created & emailed", "success");
    await loadWorkspace();
    switchTab("invoices");
  } catch (e) { SSCrm.toast(e.message || "Could not create invoice", "error"); }
}

// ───────── Messages tab ─────────
function mountTimeline() {
  const l = state.lead;
  const emailHost = document.getElementById("email-timeline");
  if (emailHost && l.email) {
    const kindForStatus = {
      new: "lead_new", replied: "lead_new", consult: "consult_confirm",
      proposal: "proposal_followup", booked: "contract_followup", installed: "post_install_thanks",
    }[l.status] || null;
    const refreshTimeline = () => SSCrm.renderEmailTimeline(emailHost, {
      lead_id: l.id,
      onCompose: async () => { const res = await SSCrm.composeEmail({ lead: l, defaultKind: kindForStatus }); if (res?.ok) refreshTimeline(); },
    });
    refreshTimeline();
  } else if (emailHost) {
    emailHost.innerHTML = `<p class="muted" style="font-size:13px;padding:8px 0">Add the lead's email on the Overview tab to email from the CRM.</p>`;
  }
}

// ───────── Notes tab ─────────
function renderNotesTab() {
  const notes = state.notes || [];
  return `<div class="card">
    <div class="card-head"><h2>Notes</h2><span class="muted" style="font-size:12px">${notes.length}</span></div>
    <div id="notes-list">${renderNotes(notes)}</div>
    <hr class="sep"/>
    <form id="note-form" onsubmit="addNote(event)" style="display:grid;gap:8px">
      <textarea name="body" placeholder="Add a note — call summary, follow-up needed, anything to remember…" rows="3" required style="width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font:inherit;font-size:13px;resize:vertical"></textarea>
      <div><button type="submit" class="btn primary sm">+ Add note</button></div>
    </form>
  </div>`;
}

function renderNotes(arr) {
  if (!arr || !arr.length) return `<p class="muted" style="text-align:center;padding:20px 0;font-style:italic">No notes yet.</p>`;
  return `<ul class="activity">${arr.map((n) => `
    <li>
      <span class="activity__icon">📝</span>
      <div class="activity__body">
        ${SSCrm.esc(n.body)}
        <div class="activity__time">${SSCrm.esc(n.author || "—")} · ${SSCrm.fmtDateTime(n.created_at)}</div>
      </div>
    </li>`).join("")}</ul>`;
}

async function sendProposal() {
  const l = state.lead;
  if (!l.email) { SSCrm.toast("Add an email to this lead first", "error"); return; }
  const defaultName = l.interest ? `${l.interest} — ${l.name}` : `Whole house — ${l.name}`;
  const projectName = await new Promise((resolve) => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `
      <div class="modal" style="max-width:480px">
        <div class="modal-head">Send a proposal to ${SSCrm.esc(l.name)}</div>
        <div class="modal-body">
          <div class="form">
            <label><span>Project name (used internally)</span><input id="sp-name" value="${SSCrm.esc(defaultName)}" required autofocus/></label>
            <p class="muted" style="font-size:12px;margin:0">We'll create a contact, a job, and a fresh proposal draft for ${SSCrm.esc(l.name)} in one click. You'll then build the options and click Send to email them the proposal link.</p>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn ghost" data-cancel>Cancel</button>
          <button class="btn primary" data-go>Create proposal draft →</button>
        </div>
      </div>`;
    document.body.appendChild(bg);
    bg.querySelector("[data-cancel]").onclick = () => { bg.remove(); resolve(null); };
    bg.querySelector("[data-go]").onclick = () => { const v = bg.querySelector("#sp-name").value.trim(); bg.remove(); resolve(v || defaultName); };
    bg.addEventListener("click", (e) => { if (e.target === bg) { bg.remove(); resolve(null); } });
    bg.querySelector("#sp-name").addEventListener("keydown", (e) => { if (e.key === "Enter") bg.querySelector("[data-go]").click(); });
  });
  if (!projectName) return;
  try {
    const res = await SSCrm.fetchJSON(`/api/leads/${id}/send-proposal`, { method: "POST", body: JSON.stringify({ project_name: projectName }) });
    SSCrm.toast("Proposal draft created — building it now…", "success");
    setTimeout(() => { location.href = `/crm/proposal.html?id=${res.proposal_id}`; }, 500);
  } catch (e) { SSCrm.toast(e.message, "error"); }
}

async function saveDetails() {
  const v = (fid) => document.getElementById(fid).value.trim();
  const body = {
    name: v("f-name"), phone: v("f-phone") || null, email: v("f-email") || null,
    address_street: v("f-street") || null, address_city: v("f-city") || null,
    address_state: v("f-state") || null, address_zip: v("f-zip") || null,
    interest: v("f-interest") || null, message: v("f-message") || null,
  };
  const qInput = document.getElementById("f-quoted");
  if (qInput && !qInput.disabled) {
    const quotedRaw = qInput.value.trim();
    body.quoted_amount_cents = quotedRaw ? SSCrm.parseMoney(quotedRaw) : null;
  }
  if (!body.name) { SSCrm.toast("Name is required", "error"); return; }
  try {
    const { lead } = await SSCrm.fetchJSON("/api/leads/" + id, { method: "PATCH", body: JSON.stringify(body) });
    state.lead = lead;
    SSCrm.toast("Lead saved", "success");
    await loadWorkspace();
    render();
  } catch (e) { SSCrm.toast(e.message, "error"); }
}

async function updateStatus(status) {
  try {
    await SSCrm.fetchJSON("/api/leads/" + id, { method: "PATCH", body: JSON.stringify({ status }) });
    SSCrm.toast("Status updated", "success");
    state.lead.status = status;
    render();
  } catch (e) { SSCrm.toast(e.message, "error"); }
}

async function addNote(e) {
  e.preventDefault();
  const form = e.target;
  const body = form.body.value.trim();
  if (!body) return;
  const btn = form.querySelector("button");
  btn.disabled = true;
  try {
    const { notes } = await SSCrm.fetchJSON("/api/leads/" + id + "/notes", { method: "POST", body: JSON.stringify({ body }) });
    state.notes = notes;
    render();
    SSCrm.toast("Note added", "success");
  } catch (err) { SSCrm.toast(err.message, "error"); } finally { btn.disabled = false; }
}

async function del() {
  if (!(await SSCrm.confirmDialog(`Delete lead "${state.lead.name}"? This cannot be undone.`))) return;
  await SSCrm.fetchJSON("/api/leads/" + id, { method: "DELETE" });
  SSCrm.toast("Lead deleted", "success");
  setTimeout(() => location.href = "/crm/leads.html", 400);
}

async function convertToContact() {
  const l = state.lead;
  if (!(await SSCrm.confirmDialog(`Create a contact + job for ${l.name}?\n\nThis lets you start an estimate, proposal, or contract.`))) return;
  try {
    const { id: contactId } = await SSCrm.fetchJSON("/api/contacts", {
      method: "POST",
      body: JSON.stringify({ name: l.name, email: l.email, phone: l.phone, address: { street: l.address_street, city: l.address_city, state: l.address_state, zip: l.address_zip } }),
    });
    const jobName = l.interest ? `${l.interest} — ${l.name}` : `Whole house — ${l.name}`;
    const { id: projectId } = await SSCrm.fetchJSON("/api/projects", { method: "POST", body: JSON.stringify({ contact_id: contactId, name: jobName, description: l.message || null }) });
    await SSCrm.fetchJSON("/api/leads/" + id, { method: "PATCH", body: JSON.stringify({ status: "replied" }) });
    SSCrm.toast("Contact + job created", "success");
    location.href = "/crm/project.html?id=" + projectId;
  } catch (e) { SSCrm.toast(e.message, "error"); }
}

async function bookFromLead() {
  const l = state.lead;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  bg.innerHTML = `
    <div class="modal" style="max-width:520px">
      <div class="modal-head">Book consultation for ${SSCrm.esc(l.name)}</div>
      <div class="modal-body">
        <div class="form">
          <div class="row">
            <label><span>Date</span><input id="bk-date" type="date" value="${tomorrow}" required/></label>
            <label><span>Start time</span><input id="bk-time" type="time" value="10:00" required/></label>
          </div>
          <div class="row">
            <label><span>Duration (min)</span><input id="bk-dur" type="number" value="60" min="15" step="15"/></label>
            <label><span>Type</span><select id="bk-type"><option value="consultation">Consultation</option><option value="measure">Measure</option></select></label>
          </div>
          <label><span>Notes (optional)</span><textarea id="bk-notes" rows="2"></textarea></label>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" data-cancel>Cancel</button>
        <button class="btn primary" data-save>Book it</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector("[data-cancel]").onclick = () => bg.remove();
  bg.addEventListener("click", (e) => { if (e.target === bg) bg.remove(); });
  bg.querySelector("[data-save]").onclick = async () => {
    const date = bg.querySelector("#bk-date").value;
    const time = bg.querySelector("#bk-time").value;
    const dur = parseInt(bg.querySelector("#bk-dur").value || "60", 10);
    const [h, m] = time.split(":").map((n) => parseInt(n, 10));
    const totalMin = h * 60 + m + dur;
    const endTime = `${String(Math.floor(totalMin / 60)).padStart(2, "0")}:${String(totalMin % 60).padStart(2, "0")}`;
    const addrParts = [l.address_street, [l.address_city, l.address_state].filter(Boolean).join(", "), l.address_zip].filter(Boolean);
    try {
      await SSCrm.fetchJSON("/api/appointments", { method: "POST", body: JSON.stringify({
        lead_id: l.id, name: l.name, email: l.email, phone: l.phone,
        start_at: `${date}T${time}:00`, end_at: `${date}T${endTime}:00`, duration_min: dur,
        type: bg.querySelector("#bk-type").value,
        site_address: addrParts.join(", ") || null,
        notes: bg.querySelector("#bk-notes").value.trim() || null,
        status: "confirmed", source: "admin",
      })});
      bg.remove();
      SSCrm.toast("Consultation booked", "success");
      state = await SSCrm.fetchJSON("/api/leads/" + id);
      render();
    } catch (e) { SSCrm.toast(e.message, "error"); }
  };
}
</script>
