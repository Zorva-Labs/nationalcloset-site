<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your invoice · National Closet Company</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/img/favicon-nc.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      --white:#FFFFFF; --paper:#FAF9F6; --fog:#EDECE8; --ink:#16140F; --ink-soft:#3A362F; --muted:#6B6457;
      --clay:#D2683F; --clay-deep:#B9542F; --clay-wash:#F6E6DF; --line:#E4E1DA;
      --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
    .wrap{max-width:480px;margin:0 auto;padding:32px 20px 64px}
    .masthead{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:24px}
    .masthead img{height:42px;width:auto}
    .masthead .co{font-weight:800;font-size:18px;letter-spacing:.01em}
    .card{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(22,20,15,.06);overflow:hidden}
    .card__top{padding:24px 24px 0}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--clay-deep)}
    h1{font-size:22px;font-weight:800;margin:6px 0 2px}
    .sub{color:var(--muted);font-size:14px;margin:0}
    .amount{font-size:40px;font-weight:900;letter-spacing:-.02em;margin:18px 0 2px}
    .amount small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
    .desc{color:var(--ink-soft);font-size:14px;margin:0 0 4px}
    .divider{height:1px;background:var(--line);margin:22px 0 0}
    .pay{padding:22px 24px 26px}
    .msg{font-size:13px;margin:12px 2px 0;color:var(--clay-deep);min-height:18px;text-align:center}
    .state{padding:40px 28px;text-align:center}
    .state .ic{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;background:#ECFDF5;color:#10B981}
    .state.void .ic{background:#F1F5F9;color:#64748B}
    .state h2{font-size:20px;font-weight:800;margin:0 0 6px}
    .state p{color:var(--muted);font-size:14px;margin:0}
    .spin{width:34px;height:34px;border:3px solid var(--fog);border-top-color:var(--clay);border-radius:50%;animation:s .8s linear infinite;margin:40px auto}
    @keyframes s{to{transform:rotate(360deg)}}
    .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
    .foot a{color:var(--muted)}
    .plan{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
    .plan-opt{display:flex;align-items:flex-start;gap:11px;padding:14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
    .plan-opt:has(input:checked){border-color:var(--clay);background:var(--clay-wash)}
    .plan-opt input{width:18px;height:18px;margin-top:2px;accent-color:var(--clay);cursor:pointer;flex-shrink:0}
    .plan-opt span{display:flex;flex-direction:column;font-size:15px;font-weight:700;color:var(--ink);line-height:1.35}
    .plan-opt small{font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}
    .check-panel{border:1.5px solid var(--clay);border-radius:12px;padding:20px 22px;background:#fff}
    .check-panel h3{font-size:17px;font-weight:800;margin:0 0 10px;color:var(--ink)}
    .check-panel .payee{background:var(--fog);border-radius:10px;padding:14px 16px;margin:0 0 12px;font-size:15px;line-height:1.5}
    .check-panel .payee strong{font-size:18px;color:var(--clay-deep)}
    .check-panel p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin:0}
    .check-panel a{color:var(--clay-deep);font-weight:600}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="masthead">
      <img src="/img/ncc-logo-nc.png" alt="National Closet Company" />
      <span class="co">National Closet Company</span>
    </div>
    <div id="root"><div class="spin"></div></div>
    <div class="foot">Questions? <a href="mailto:hello@nationalclosetco.com">hello@nationalclosetco.com</a> · <a href="tel:+16154883575">615-488-3575</a> · <a href="/privacy">Privacy</a></div>
  </div>

  <script>
    // Invoices are paid by check (Michael, 2026-10-21: Stripe removed). The page
    // shows what is due and who the check is made out to; the office records
    // the check in the CRM, and the page then reads "Payment received".
    const token = new URLSearchParams(location.search).get("t");
    const root = document.getElementById("root");
    const money = (c) => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

    function checkmark() { return `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`; }

    function paidState(inv) {
      root.innerHTML = `<div class="card"><div class="state">
        <div class="ic">${checkmark()}</div>
        <h2>Payment received</h2>
        <p>Thank you! Invoice <strong>${esc(inv.number)}</strong> for <strong>${money(inv.amount_cents)}</strong> is paid.</p>
      </div></div>`;
    }
    function voidState(inv, nextTok) {
      root.innerHTML = `<div class="card"><div class="state void">
        <div class="ic">—</div>
        <h2>Invoice canceled</h2>
        <p>This invoice (${esc(inv.number)}) is no longer payable.${nextTok ? " It was replaced when your order changed." : " Reach out if you have questions."}</p>
        ${nextTok ? `<p><a href="/invoice/?t=${encodeURIComponent(nextTok)}" style="color:var(--clay,#D2683F);font-weight:700">Open your current invoice →</a></p>` : ""}
      </div></div>`;
    }
    function errorState(msg) {
      root.innerHTML = `<div class="card"><div class="state void"><div class="ic">!</div><h2>Something went wrong</h2><p>${esc(msg)}</p></div></div>`;
    }

    async function init() {
      if (!token) return errorState("Missing invoice link.");
      let data;
      try {
        const res = await fetch(`/api/public/invoice/${encodeURIComponent(token)}`);
        data = await res.json();
        if (!res.ok && !data.invoice) return errorState(data.error || "Invoice not found.");
      } catch (e) { return errorState("Could not load this invoice."); }

      if (data.paid) return paidState(data.invoice);
      if (data.voided) return voidState(data.invoice, data.replaced_by_token);

      const inv = data.invoice;
      // Only the unpaid balance is due; earlier payments may cover part of it.
      const base = data.due_cents != null ? data.due_cents : inv.amount_cents;
      const alreadyPaid = inv.amount_paid_cents || 0;
      const plan = data.plan || null;  // { deposit_cents, full_cents, current_plan } | null

      const typeLabel = { deposit: "Deposit", scheduling: "Scheduling payment", balance: "Final payment", full: "Payment", custom: "Invoice" }[inv.type] || "Invoice";
      root.innerHTML = `
        <div class="card">
          <div class="card__top">
            <div class="eyebrow">${esc(typeLabel)} · Invoice ${esc(inv.number)}${inv.po_number ? ` · PO ${esc(inv.po_number)}` : ""}</div>
            <h1>${esc(inv.project_name || "Custom closet project")}</h1>
            <p class="sub">${esc(inv.contact_name ? "For " + inv.contact_name : "")}</p>
            <div class="amount"><span id="amt-due">${money(base)}</span> <small>due</small></div>
            ${alreadyPaid > 0 ? `<p class="sub" style="margin-top:-2px">${money(alreadyPaid)} of ${money(inv.amount_cents)} already paid — balance shown above.</p>` : ""}
            <p class="desc">${esc(inv.description || "")}</p>
            ${inv.discount_cents > 0 ? `<p class="sub">Includes a ${money(inv.discount_cents)} discount${inv.discount_note ? ` — ${esc(inv.discount_note)}` : ""}.</p>` : ""}
            <div class="divider"></div>
          </div>
          <div class="pay">
            ${plan ? `<div class="plan">
              <label class="plan-opt"><input type="radio" name="plan" value="deposit" ${plan.current_plan !== "full" ? "checked" : ""}/>
                <span><b>Pay deposit</b> · ${money(plan.deposit_cents)}<small>Releases your order to the manufacturer. The rest is billed 25% when your install is scheduled and 25% the day of install.</small></span></label>
              <label class="plan-opt"><input type="radio" name="plan" value="full" ${plan.current_plan === "full" ? "checked" : ""}/>
                <span><b>Pay in full</b> · ${money(plan.full_cents)}<small>Settle the whole project now — nothing due later.</small></span></label>
            </div>` : ""}
            <div class="check-panel" id="check-panel">
              <h3>Pay by check</h3>
              <div class="payee">Make your check payable to<br/><strong>James Blair</strong> &middot; <span id="chk-amt">${money(base)}</span></div>
              <p>Hand your check to your Project Manager, and we'll mark this invoice paid as soon as it's received. Questions? Call or text <a href="tel:+16154883575">615-488-3575</a>.</p>
            </div>
            <div class="msg" id="msg"></div>
            ${data.change_option_token ? `<p style="font-size:13px;color:var(--muted);margin:14px 0 0;text-align:center">Want a different option? You can switch before you pay. <a href="/proposal/?t=${encodeURIComponent(data.change_option_token)}" style="color:var(--clay-deep,#B04F2A);font-weight:700">Change my option →</a></p>` : ""}
          </div>
        </div>`;

      // Deposit / pay-in-full chooser. Switching updates the invoice server-side,
      // then shows the new amount to write the check for.
      function setAmountUI(cents) {
        const a = document.getElementById("amt-due"); if (a) a.textContent = money(cents);
        const c = document.getElementById("chk-amt"); if (c) c.textContent = money(cents);
      }
      async function choosePlan(which) {
        try {
          const r = await fetch(`/api/public/invoice/${encodeURIComponent(token)}`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "set_plan", plan: which }),
          });
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || "Couldn't update the amount.");
          setAmountUI(d.amount_cents);
        } catch (err) { document.getElementById("msg").textContent = err.message; }
      }
      if (plan) {
        document.querySelectorAll('input[name="plan"]').forEach((r) =>
          r.addEventListener("change", () => { if (r.checked) choosePlan(r.value); }));
      }
    }

    init();
  </script>
</body>
</html>
