<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reports · National Closet Company CRM</title><meta name="robots" content="noindex, nofollow"/>
<link rel="stylesheet" href="/crm/crm-app.css?v=ncc74"/>
<style>
  .rpt-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .rpt-presets{display:inline-flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:4px}
  .rpt-preset{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);padding:7px 14px;border-radius:999px;cursor:pointer}
  .rpt-preset:hover{color:var(--ink)}
  .rpt-preset.is-active{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .rpt-dates{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
  .rpt-dates input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm,6px);background:var(--bg);color:var(--ink)}
  .rpt-scope{display:inline-flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:4px}
  .rpt-right{margin-left:auto;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
  .rpt-dl{display:inline-flex;gap:6px}
  .rpt-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .rpt-kpi{background:var(--bg);border:1px solid var(--line);border-radius:var(--r,10px);padding:16px 18px}
  .rpt-kpi .lbl{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
  .rpt-kpi .val{font-size:28px;font-weight:800;margin-top:6px;line-height:1.1}
  .rpt-kpi .sub{font-size:12px;color:var(--ink-soft);margin-top:4px}
  .rpt-kpi.accent .val{color:#15803D}
  .rpt-pnl{width:100%;border-collapse:collapse;font-size:14px}
  .rpt-pnl td{padding:9px 4px;border-bottom:1px solid var(--line)}
  .rpt-pnl td.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .rpt-pnl td.pct{text-align:right;white-space:nowrap;color:var(--ink-soft);font-size:12px;width:64px}
  .rpt-pnl tr.exp td:first-child{padding-left:18px;color:var(--ink-soft)}
  .rpt-pnl tr.sum td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
  .rpt-pnl tr.profit td{font-weight:800;font-size:16px}
  .rpt-pnl tr.profit td.amt{color:#15803D}
  .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .fnl-row{display:grid;grid-template-columns:150px 1fr 52px 46px;align-items:center;gap:12px;padding:7px 0}
  .fnl-row .lab{font-size:13px;font-weight:600}
  .fnl-bar{height:24px;background:var(--bg-soft);border-radius:5px;overflow:hidden}
  .fnl-bar>span{display:block;height:100%;background:linear-gradient(90deg,#E8915E,#C2522F);border-radius:5px;min-width:2px}
  .fnl-row .ct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .fnl-row .pc{text-align:right;color:var(--ink-soft);font-size:12px}
</style></head>
<body>
<script src="/crm/crm-app.js?v=ncc74"></script>
<script>
(async () => {
  const user = await SSCrm.mount({ title: "Reports", subtitle: "Profit & loss and lead performance", wide: true });
  if (!user) return;
  const page = document.getElementById("page");
  const M = SSCrm.fmtMoney;
  const e = SSCrm.esc;

  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  function presetRange(key) {
    const now = new Date();
    if (key === "month") return [iso(new Date(now.getFullYear(), now.getMonth(), 1)), iso(now)];
    if (key === "ytd")   return [iso(new Date(now.getFullYear(), 0, 1)), iso(now)];
    if (key === "30")    return [iso(new Date(now.getTime() - 29 * 864e5)), iso(now)];
    if (key === "12mo")  return [iso(new Date(now.getFullYear() - 1, now.getMonth(), now.getDate())), iso(now)];
    return ["2000-01-01", "2999-12-31"]; // all
  }

  let view = "pnl";        // "pnl" | "leads"
  let preset = "ytd";
  let [from, to] = presetRange(preset);
  let all = false;         // P&L scope toggle
  let data = null;         // P&L payload
  let ldata = null;        // Leads payload
  let rdata = null;        // Receivables (A/R) payload
  let pdata = null;        // Payables (A/P) payload
  let cdata = null;        // Cash flow payload

  const STATUS_LABEL = { contracted: "Booked", scheduled_install: "Scheduled", installing: "Installing", completed: "Completed" };
  const pct = (part, whole) => whole ? Math.round((part / whole) * 100) + "%" : "—";
  const pct1 = (part, whole) => whole ? (Math.round((part / whole) * 1000) / 10) + "%" : "—";

  // Business letterhead for downloaded reports
  const BIZ = {
    name: "National Closet Company",
    loc: "Gallatin, Tennessee · Serving Middle Tennessee",
    phone: "(629) 298-8241",
    email: "hello@nationalclosetco.com",
    web: "NationalClosetCo.com",
    logo: location.origin + "/img/ncc-logo.png",
  };
  const fmtDay = (s) => { const d = new Date(s + "T00:00:00"); return isNaN(d) ? s : d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }); };
  const rangeLabel = () => (from <= "2000-01-01" && to >= "2999-12-31") ? "All time" : `${fmtDay(from)} – ${fmtDay(to)}`;

  const FUNNEL = [["new", "New leads"], ["contacted", "Contacted"], ["replied", "Replied"], ["consult", "Consult booked"], ["proposal", "Proposal stage"], ["booked", "Booked (won)"]];

  // ───────── shared filter bar ─────────
  function barHTML() {
    const snapshot = view === "receivables" || view === "payables";
    return `<div class="rpt-bar">
      <div class="rpt-presets">
        <button class="rpt-preset ${view === "pnl" ? "is-active" : ""}" data-view="pnl">Profit &amp; loss</button>
        <button class="rpt-preset ${view === "leads" ? "is-active" : ""}" data-view="leads">Leads</button>
        <button class="rpt-preset ${view === "receivables" ? "is-active" : ""}" data-view="receivables">Receivables</button>
        <button class="rpt-preset ${view === "payables" ? "is-active" : ""}" data-view="payables">Payables</button>
        <button class="rpt-preset ${view === "cashflow" ? "is-active" : ""}" data-view="cashflow">Cash flow</button>
      </div>
      ${!snapshot ? `<div class="rpt-presets">
        ${[["month", "This month"], ["ytd", "Year to date"], ["30", "Last 30"], ["12mo", "Last 12 mo"], ["all", "All time"]]
          .map(([k, lbl]) => `<button class="rpt-preset ${preset === k ? "is-active" : ""}" data-p="${k}">${lbl}</button>`).join("")}
      </div>
      <div class="rpt-dates"><input type="date" id="rpt-from" value="${from}"/><span>→</span><input type="date" id="rpt-to" value="${to === "2999-12-31" ? "" : to}"/></div>`
      : `<div class="rpt-dates" style="color:var(--ink-soft)">${view === "payables" ? "A/P" : "A/R"} snapshot · as of ${fmtDay(new Date().toISOString().slice(0, 10))}</div>`}
      <div class="rpt-right">
        ${view === "pnl" ? `<div class="rpt-scope">
          <button class="rpt-preset ${!all ? "is-active" : ""}" data-scope="won">Won jobs</button>
          <button class="rpt-preset ${all ? "is-active" : ""}" data-scope="all">All projects</button>
        </div>` : ""}
        <div class="rpt-dl">
          <button class="btn secondary sm" id="rpt-pdf">⤓ Download PDF</button>
          <button class="btn ghost sm" id="rpt-csv">CSV</button>
        </div>
      </div>
    </div>`;
  }
  function wireBar() {
    page.querySelectorAll(".rpt-preset[data-view]").forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; load(); }));
    page.querySelectorAll(".rpt-preset[data-p]").forEach((b) => b.addEventListener("click", () => { preset = b.dataset.p; [from, to] = presetRange(preset); load(); }));
    page.querySelectorAll(".rpt-preset[data-scope]").forEach((b) => b.addEventListener("click", () => { all = b.dataset.scope === "all"; load(); }));
    // Date inputs only exist on the dated views (P&L / Leads / Cash flow); the
    // A/R and A/P snapshots show an "as of" label instead, so guard for null.
    const fEl = document.getElementById("rpt-from"), tEl = document.getElementById("rpt-to");
    if (fEl && tEl) {
      const onDate = () => { from = fEl.value || "2000-01-01"; to = tEl.value || "2999-12-31"; preset = ""; load(); };
      fEl.addEventListener("change", onDate); tEl.addEventListener("change", onDate);
    }
    const pdf = document.getElementById("rpt-pdf"); if (pdf) pdf.addEventListener("click", downloadPDF);
    const csv = document.getElementById("rpt-csv"); if (csv) csv.addEventListener("click", downloadCSV);
  }

  function render() { ({ leads: renderLeads, receivables: renderReceivables, payables: renderPayables, cashflow: renderCashflow }[view] || renderPnl)(); wireBar(); }

  // ───────── P&L view ─────────
  function renderPnl() {
    const t = data ? data.totals : { revenue: 0, materials: 0, shipping: 0, tax: 0, labor: 0, misc: 0, fee: 0, expenses: 0, profit: 0 };
    const rev = t.revenue;
    const expRow = (label, cents) => `<tr class="exp"><td>${label}</td><td class="amt">${cents ? "(" + M(cents) + ")" : "—"}</td><td class="pct">${pct(cents, rev)}</td></tr>`;
    const jobsRows = (data && data.jobs.length) ? data.jobs.map((j) => `
      <tr>
        <td><a href="/crm/project.html?id=${j.id}">${e(j.name || "Job #" + j.id)}</a><div class="muted" style="font-size:12px">${e(j.contact_name || "")} · ${SSCrm.fmtDate(j.created_at)}</div></td>
        <td>${SSCrm.pill(STATUS_LABEL[j.status] || j.status, j.status)}</td>
        <td class="num">${M(j.price_cents)}</td><td class="num">${M(j.materials_cents)}</td>
        <td class="num">${M(j.labor_cents)}</td><td class="num">${M(j.misc_cents)}</td>
        <td class="num" style="font-weight:700;color:#15803D">${M(j.profit_cents)}</td>
      </tr>`).join("")
      : `<tr><td colspan="7" class="empty" style="padding:24px">No jobs in this range.</td></tr>`;

    page.innerHTML = barHTML() + `
      <div class="rpt-cards">
        <div class="rpt-kpi"><div class="lbl">Gross income</div><div class="val">${M(rev)}</div><div class="sub">${data ? data.count : 0} job${(data && data.count === 1) ? "" : "s"}</div></div>
        <div class="rpt-kpi"><div class="lbl">Total expenses</div><div class="val">${M(t.expenses)}</div><div class="sub">${pct(t.expenses, rev)} of revenue</div></div>
        <div class="rpt-kpi accent"><div class="lbl">Net profit</div><div class="val">${M(t.profit)}</div><div class="sub">${pct(t.profit, rev)} margin</div></div>
        <div class="rpt-kpi"><div class="lbl">Avg / job</div><div class="val">${M(data && data.count ? Math.round(t.profit / data.count) : 0)}</div><div class="sub">profit per job</div></div>
      </div>
      <div class="lead-grid" style="grid-template-columns:minmax(280px,360px) 1fr;gap:20px;align-items:start">
        <div class="card">
          <div class="card-head"><h3>Profit &amp; loss</h3></div>
          <table class="rpt-pnl">
            ${t.discounts ? `<tr><td>Gross sales</td><td class="amt">${M(t.gross)}</td><td class="pct"></td></tr>
            <tr class="exp"><td>Discounts</td><td class="amt">(${M(t.discounts)})</td><td class="pct">${pct(t.discounts, t.gross)}</td></tr>` : ""}
            <tr><td><strong>${t.discounts ? "Net revenue" : "Gross income"}</strong></td><td class="amt"><strong>${M(rev)}</strong></td><td class="pct">100%</td></tr>
            ${expRow("Materials", t.materials)}${expRow("Shipping", t.shipping)}${expRow("Taxes", t.tax)}${expRow("Labor", t.labor)}${expRow("Misc", t.misc)}${expRow("Processing fees", t.fee)}
            <tr class="sum"><td>Total expenses</td><td class="amt">(${M(t.expenses)})</td><td class="pct">${pct(t.expenses, rev)}</td></tr>
            <tr class="profit"><td>Net profit</td><td class="amt">${M(t.profit)}</td><td class="pct">${pct(t.profit, rev)}</td></tr>
          </table>
        </div>
        <div class="card">
          <div class="card-head"><h3>By job <span class="muted" style="font-weight:500">· ${data ? data.count : 0}</span></h3></div>
          <div class="tbl"><table>
            <thead><tr><th>Job</th><th>Status</th><th class="num">Price</th><th class="num">Materials</th><th class="num">Labor</th><th class="num">Misc</th><th class="num">Profit</th></tr></thead>
            <tbody>${jobsRows}</tbody>
          </table></div>
        </div>
      </div>
      <p class="muted" style="font-size:12px;margin-top:14px">Revenue counts each job by its created date. Expenses use saved per-job overrides where set, otherwise the cost formula on the job's contract/proposal total.</p>`;
  }

  // ───────── Leads view ─────────
  function renderLeads() {
    const d = ldata || { total: 0, booked: 0, lost: 0, conversion: 0, funnel: {}, sources: [], proposals_sent: 0, proposals_accepted: 0, quoted_total_cents: 0 };
    const total = d.total;
    const fnlRows = FUNNEL.map(([k, lbl]) => {
      const n = d.funnel[k] || 0;
      const w = total ? Math.round((n / total) * 100) : 0;
      return `<div class="fnl-row"><div class="lab">${lbl}</div><div class="fnl-bar"><span style="width:${w}%"></span></div><div class="ct">${n}</div><div class="pc">${pct(n, total)}</div></div>`;
    }).join("");
    const srcRows = (d.sources.length ? d.sources : []).map((s) => `<tr><td>${e(s.source)}</td><td class="num">${s.n}</td><td class="num muted">${pct(s.n, total)}</td></tr>`).join("")
      || `<tr><td colspan="3" class="empty" style="padding:18px">No leads in this range.</td></tr>`;

    page.innerHTML = barHTML() + `
      <div class="rpt-cards">
        <div class="rpt-kpi"><div class="lbl">Total leads</div><div class="val">${total}</div><div class="sub">${d.lost} lost · ${pct(d.lost, total)}</div></div>
        <div class="rpt-kpi accent"><div class="lbl">Conversion rate</div><div class="val">${pct1(d.booked, total)}</div><div class="sub">${d.booked} booked of ${total}</div></div>
        <div class="rpt-kpi"><div class="lbl">Proposals sent</div><div class="val">${d.proposals_sent}</div><div class="sub">${d.proposals_accepted} accepted · ${pct(d.proposals_accepted, d.proposals_sent)}</div></div>
        <div class="rpt-kpi"><div class="lbl">Quoted value</div><div class="val">${M(d.quoted_total_cents)}</div><div class="sub">across ${d.quoted_count || 0} quote${d.quoted_count === 1 ? "" : "s"}</div></div>
      </div>
      <div class="lead-grid" style="grid-template-columns:1fr minmax(260px,340px);gap:20px;align-items:start">
        <div class="card">
          <div class="card-head"><h3>Lead funnel</h3></div>
          ${total ? fnlRows : `<div class="empty" style="padding:24px">No leads in this range.</div>`}
          <p class="muted" style="font-size:12px;margin-top:12px">Each stage counts leads that reached at least that point (current status). Conversion = booked ÷ total leads.</p>
        </div>
        <div class="card">
          <div class="card-head"><h3>Lead sources</h3></div>
          <div class="tbl"><table>
            <thead><tr><th>Source</th><th class="num">Leads</th><th class="num">Share</th></tr></thead>
            <tbody>${srcRows}</tbody>
          </table></div>
        </div>
      </div>`;
  }

  // ───────── Receivables (A/R + aging) view ─────────
  const AR_BUCKETS = [["current", "Current"], ["d1_30", "1–30 days"], ["d31_60", "31–60 days"], ["d61_90", "61–90 days"], ["d90", "90+ days"]];
  const INV_TYPE = { deposit: "Deposit", balance: "Balance", full: "Full", custom: "Custom" };
  function renderReceivables() {
    const d = rdata || { total_cents: 0, overdue_cents: 0, count: 0, oldest_days: 0, buckets: { current: 0, d1_30: 0, d31_60: 0, d61_90: 0, d90: 0 }, invoices: [], unbilled: [], unbilled_total_cents: 0, grand_total_cents: 0 };
    const b = d.buckets;
    const unbilledRows = (d.unbilled || []).length ? d.unbilled.map((u) => `<tr>
        <td><a href="/crm/project.html?id=${u.project_id}">${e(u.name || "Job #" + u.project_id)}</a><div class="muted" style="font-size:12px">${e(u.contact_name || "")}</div></td>
        <td class="num">${M(u.job_total_cents)}</td><td class="num">${M(u.collected_cents)}</td><td class="num" style="font-weight:700;color:#B45309">${M(u.unbilled_cents)}</td></tr>`).join("")
      : `<tr><td colspan="4" class="muted" style="padding:14px">No unbilled job balances — everything booked is invoiced.</td></tr>`;
    const agingCells = AR_BUCKETS.map(([k, lbl]) => {
      const color = (k === "d90" && b[k] > 0) ? "color:#B91C1C" : (k === "current" ? "color:#15803D" : "");
      return `<div class="rpt-kpi" style="padding:12px 14px"><div class="lbl" style="font-size:11px">${lbl}</div><div class="val" style="font-size:20px;${color}">${M(b[k])}</div><div class="sub">${pct(b[k], d.total_cents)}</div></div>`;
    }).join("");
    const rows = d.invoices.length ? d.invoices.map((iv) => `<tr>
        <td><a href="/crm/invoice.html?id=${iv.id}">${e(iv.number)}</a><div class="muted" style="font-size:12px">${e(iv.contact_name || "")}${iv.project_name ? " · " + e(iv.project_name) : ""}</div></td>
        <td>${e(INV_TYPE[iv.type] || iv.type)}</td>
        <td class="num">${M(iv.amount_cents)}</td>
        <td class="num">${iv.paid_cents ? M(iv.paid_cents) : "—"}</td>
        <td class="num" style="font-weight:700">${M(iv.balance_cents)}</td>
        <td class="num">${iv.due_date ? SSCrm.fmtDay(iv.due_date) : "—"}</td>
        <td class="num" style="${iv.days_past > 0 ? "color:#B91C1C;font-weight:600" : "color:#15803D"}">${iv.days_past > 0 ? iv.days_past + "d" : "Current"}</td>
      </tr>`).join("")
      : `<tr><td colspan="7" class="empty" style="padding:24px">No outstanding invoices — everything's collected. 🎉</td></tr>`;

    page.innerHTML = barHTML() + `
      <div class="rpt-cards">
        <div class="rpt-kpi accent"><div class="lbl">Total owed</div><div class="val">${M(d.grand_total_cents)}</div><div class="sub">${M(d.total_cents)} billed + ${M(d.unbilled_total_cents)} unbilled</div></div>
        <div class="rpt-kpi"><div class="lbl">Billed (A/R)</div><div class="val">${M(d.total_cents)}</div><div class="sub">${d.count} open invoice${d.count === 1 ? "" : "s"}</div></div>
        <div class="rpt-kpi"><div class="lbl">Overdue</div><div class="val" style="${d.overdue_cents > 0 ? "color:#B91C1C" : ""}">${M(d.overdue_cents)}</div><div class="sub">${pct(d.overdue_cents, d.total_cents)} of billed</div></div>
        <div class="rpt-kpi"><div class="lbl">Remaining balance</div><div class="val" style="${d.unbilled_total_cents > 0 ? "color:#B45309" : ""}">${M(d.unbilled_total_cents)}</div><div class="sub">due at completion · ${(d.unbilled || []).length} job${(d.unbilled || []).length === 1 ? "" : "s"}</div></div>
      </div>
      <div class="card" style="margin-bottom:18px">
        <div class="card-head"><h3>A/R Aging</h3></div>
        <div class="rpt-cards" style="margin-bottom:0">${agingCells}</div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Open invoices <span class="muted" style="font-weight:500">· ${d.count}</span></h3></div>
        <div class="tbl"><table>
          <thead><tr><th>Invoice</th><th>Type</th><th class="num">Amount</th><th class="num">Paid</th><th class="num">Balance</th><th class="num">Due</th><th class="num">Past due</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>
      <div class="card" style="margin-top:18px">
        <div class="card-head"><h3>Remaining balances <span class="muted" style="font-weight:500">· due at completion · ${(d.unbilled || []).length}</span></h3></div>
        <div class="tbl"><table>
          <thead><tr><th>Job</th><th class="num">Job total</th><th class="num">Collected</th><th class="num">Unbilled</th></tr></thead>
          <tbody>${unbilledRows}</tbody>
        </table></div>
      </div>
      <p class="muted" style="font-size:12px;margin-top:14px">Snapshot as of today. <strong>Billed (A/R)</strong> = open invoices, aged from each due date. <strong>Remaining balance</strong> = the agreed job balance not yet invoiced (e.g. the half due at completion after a deposit). Total owed = both.</p>`;
  }

  // ───────── Payables (A/P + aging) view ─────────
  function renderPayables() {
    const d = pdata || { total_cents: 0, overdue_cents: 0, count: 0, oldest_days: 0, buckets: { current: 0, d1_30: 0, d31_60: 0, d61_90: 0, d90: 0 }, categories: [], bills: [], est_jobs: [], est_labor_total: 0, est_labor_upcoming: 0, est_upfront_total: 0, grand_payable_cents: 0 };
    const b = d.buckets;
    const laborCell = (j) => {
      if (j.installer_billed) return `<span style="color:#15803D">billed ✓</span>`;
      if (j.labor_owed_cents > 0) return `<strong style="color:#B45309">${M(j.labor_owed_cents)}</strong> <span class="muted" style="font-size:11px">owed</span>`;
      if (j.labor_upcoming_cents > 0) return `<span class="muted">${M(j.labor_upcoming_cents)} · after install</span>`;
      return `<span class="muted">—</span>`;
    };
    const estRows = (d.est_jobs || []).length ? d.est_jobs.map((j) => `<tr>
        <td><a href="/crm/project.html?id=${j.project_id}">${e(j.name || "Job #" + j.project_id)}</a></td>
        <td>${SSCrm.pill(j.status)}</td>

          <div class="tbl"><table><thead><tr><th>Month</th><th class="num">In</th><th class="num">Out</th><th class="num">Net</th></tr></thead><tbody>${monthRows}

  function openPrint(html) {
    const w = window.open("", "_blank");

    w.document.open(); w.document.write(html); w.document.close();

    if (view === "leads") { if (ldata) openPrint(brandedLeadsHTML()); }

      </div>
      <h2>By month</h2>
      <table class="pnl"><thead><tr><th style="text-align:left">Month</th><th class="amt">Cash in</th><th class="amt">Cash out</th><th class="amt">Net</th></tr></thead><tbody>${monthRows}
        <tr class="tot"><td>Total</td><td class="amt">${M(d.cash_in)}</td><td class="amt">(${M(d.cash_out)})</td><td class="amt">${M(d.net)}</td></tr></tbody></table>
      <h2>Spending by category</h2>
      <table class="data"><thead><tr><th>Category</th><th>Paid</th></tr></thead><tbody>${catRows}</tbody></table>
      <div class="foot"><span>Generated ${today} · ${e(BIZ.name)}</span><span>Cash basis · est. costs are modeled, not actual</span></div>
      ${PRINT_JS}</body></html>`;
  }

  function brandedReceivablesHTML() {
    const d = rdata, b = d.buckets;
    const agingRow = AR_BUCKETS.map(([k, lbl]) => `<tr><td>${lbl}</td><td class="amt">${M(b[k])}</td><td class="p">${pct(b[k], d.total_cents)}</td></tr>`).join("");
    const rows = d.invoices.length ? d.invoices.map((iv) => `<tr>
        <td>${e(iv.number)}<div class="sub">${e(iv.contact_name || "")}${iv.project_name ? " · " + e(iv.project_name) : ""}</div></td>
        <td>${e(INV_TYPE[iv.type] || iv.type)}</td>
        <td class="amt">${M(iv.amount_cents)}</td><td class="amt">${iv.paid_cents ? M(iv.paid_cents) : "—"}</td>
        <td class="amt strong" style="color:#1a1a1a">${M(iv.balance_cents)}</td>
        <td class="amt">${iv.due_date ? SSCrm.fmtDay(iv.due_date) : "—"}</td>
        <td class="amt">${iv.days_past > 0 ? iv.days_past + "d" : "Current"}</td></tr>`).join("")
      : `<tr><td colspan="7" style="text-align:center;color:#777;padding:20px">No outstanding invoices.</td></tr>`;
    const today = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    return `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>A/R Aging — ${e(BIZ.name)}</title><style>${PRINT_CSS}</style></head><body>
      ${letterhead()}
      <h1>Accounts Receivable &amp; Aging</h1>
      <div class="range">As of ${today} · ${d.count} open invoice${d.count === 1 ? "" : "s"}</div>
      <div class="kpis">
        <div class="kpi"><div class="l">Total A/R</div><div class="v">${M(d.total_cents)}</div></div>
        <div class="kpi"><div class="l">Overdue</div><div class="v">${M(d.overdue_cents)}</div></div>
        <div class="kpi green"><div class="l">Current</div><div class="v">${M(b.current)}</div></div>
        <div class="kpi"><div class="l">Oldest</div><div class="v">${d.oldest_days > 0 ? d.oldest_days + " d" : "—"}</div></div>
      </div>
      <h2>Aging summary</h2>
      <table class="pnl"><thead><tr><th style="text-align:left">Bucket</th><th class="amt">Balance</th><th class="p">%</th></tr></thead><tbody>${agingRow}
        <tr class="tot"><td>Total</td><td class="amt">${M(d.total_cents)}</td><td class="p">100%</td></tr></tbody></table>
      <h2>Open invoices</h2>
      <table class="data"><thead><tr><th>Invoice</th><th>Type</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Due</th><th>Past due</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="foot"><span>Generated ${today} · ${e(BIZ.name)}</span><span>Internal management report</span></div>
      ${PRINT_JS}</body></html>`;
  }

  function csvDownload(rows, name) {
    const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const csv = rows.map((r) => r.map(esc).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function downloadCSV() {
    const tag = `${from}_to_${to === "2999-12-31" ? "all" : to}`;
    if (view === "leads") {
      if (!ldata) return;
      const d = ldata, rows = [["NCC Lead Report", rangeLabel()], [], ["Metric", "Value"],
        ["Total leads", d.total], ["Booked (won)", d.booked], ["Lost", d.lost],
        ["Conversion rate", pct1(d.booked, d.total)], ["Proposals sent", d.proposals_sent], ["Proposals accepted", d.proposals_accepted],
        ["Quoted value", (d.quoted_total_cents / 100).toFixed(2)], [], ["Funnel stage", "Leads", "% of total"]];
      FUNNEL.forEach(([k, lbl]) => rows.push([lbl, d.funnel[k] || 0, pct(d.funnel[k] || 0, d.total)]));
      rows.push([], ["Source", "Leads", "% of total"]);
      d.sources.forEach((s) => rows.push([s.source, s.n, pct(s.n, d.total)]));
      csvDownload(rows, `NCC-Leads-${tag}.csv`);
    } else if (view === "receivables") {
      if (!rdata) return;
      const d = rdata, c = (x) => ((x || 0) / 100).toFixed(2);
      const rows = [["NCC Accounts Receivable — Aging", "As of " + d.as_of], [], ["Bucket", "Balance"]];
      AR_BUCKETS.forEach(([k, lbl]) => rows.push([lbl, c(d.buckets[k])]));
      rows.push(["Total A/R", c(d.total_cents)], [], ["Invoice", "Customer", "Job", "Type", "Amount", "Paid", "Balance", "Due", "Days past due"]);
      d.invoices.forEach((iv) => rows.push([iv.number, iv.contact_name || "", iv.project_name || "", iv.type, c(iv.amount_cents), c(iv.paid_cents), c(iv.balance_cents), iv.due_date || "", iv.days_past > 0 ? iv.days_past : 0]));
      csvDownload(rows, `NCC-AR-Aging-${d.as_of}.csv`);
    } else if (view === "payables") {
      if (!pdata) return;
      const d = pdata, c = (x) => ((x || 0) / 100).toFixed(2);
      const rows = [["NCC Accounts Payable — Aging", "As of " + d.as_of], [], ["Bucket", "Balance"]];
      AR_BUCKETS.forEach(([k, lbl]) => rows.push([lbl, c(d.buckets[k])]));
      rows.push(["Total A/P", c(d.total_cents)], [], ["Vendor", "Description", "Category", "Job", "Amount", "Paid", "Balance", "Due", "Days past due"]);
      d.bills.forEach((x) => rows.push([x.vendor || "", x.description || "", x.category || "", x.project_name || "", c(x.amount_cents), c(x.paid_cents), c(x.balance_cents), x.due_date || "", x.days_past > 0 ? x.days_past : 0]));
      csvDownload(rows, `NCC-AP-Aging-${d.as_of}.csv`);
    } else if (view === "cashflow") {
      if (!cdata) return;
      const d = cdata, c = (x) => ((x || 0) / 100).toFixed(2);
      const rows = [["NCC Cash Flow", rangeLabel()], [], ["Cash in", c(d.cash_in)], ["Cash out", c(d.cash_out)], ["Net", c(d.net)], ["Est. job costs (modeled)", c(d.est_costs)], [], ["Month", "Cash in", "Cash out", "Net"]];
      d.by_month.forEach((x) => rows.push([x.month, c(x.cash_in), c(x.cash_out), c(x.net)]));
      rows.push([], ["Spending by category", "Paid"]);
      d.out_by_category.forEach((x) => rows.push([x.category, c(x.amount)]));
      csvDownload(rows, `NCC-CashFlow-${tag}.csv`);
    } else {
      if (!data) return;
      const t = data.totals, c = (x) => (x / 100).toFixed(2);
      const rows = [["Job", "Contact", "Status", "Created", "Price", "Materials", "Shipping", "Taxes", "Labor", "Misc", "Fees", "Expenses", "Profit"]];
      data.jobs.forEach((j) => rows.push([j.name || "Job #" + j.id, j.contact_name || "", j.status, (j.created_at || "").slice(0, 10), c(j.price_cents), c(j.materials_cents), c(j.shipping_cents), c(j.tax_cents), c(j.labor_cents), c(j.misc_cents), c(j.fee_cents), c(j.expenses_cents), c(j.profit_cents)]));
      rows.push([], ["TOTALS", "", "", "", c(t.revenue), c(t.materials), c(t.shipping), c(t.tax), c(t.labor), c(t.misc), c(t.fee), c(t.expenses), c(t.profit)]);
      csvDownload(rows, `NCC-PnL-${tag}.csv`);
    }
  }

  async function load() {
    page.innerHTML = barHTML() + `<div class="muted" style="padding:24px">Loading…</div>`;
    wireBar();
    try {
      if (view === "leads") ldata = await SSCrm.fetchJSON(`/api/reports/leads?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
      else if (view === "receivables") rdata = await SSCrm.fetchJSON(`/api/reports/receivables`);
      else if (view === "payables") pdata = await SSCrm.fetchJSON(`/api/reports/payables`);
      else if (view === "cashflow") cdata = await SSCrm.fetchJSON(`/api/reports/cashflow?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
      else data = await SSCrm.fetchJSON(`/api/reports?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&all=${all ? 1 : 0}`);
    } catch (err) {
      page.innerHTML = barHTML() + `<div class="tbl"><div class="empty">Couldn't load: ${e(err.message)}</div></div>`;
      wireBar();
      return;
    }
    render();
  }

  load();
})();
</script></body></html>
