<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Invoices · National Closet Company CRM</title><meta name="robots" content="noindex, nofollow"/>
<link rel="stylesheet" href="/crm/crm-app.css?v=ncc41"/>
<style>
  .inv-stats { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; }
  .inv-stat { flex: 1 1 160px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
  .inv-stat__label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
  .inv-stat__value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .inv-stat--open .inv-stat__value { color: #B45309; }
  .inv-stat--paid .inv-stat__value { color: #047857; }
  .inv-filters { display: inline-flex; gap: 4px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 16px; }
  .inv-filter { border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-soft); padding: 7px 16px; border-radius: 999px; cursor: pointer; transition: background 120ms ease, color 120ms ease; }
  .inv-filter:hover { color: var(--ink); }
  .inv-filter.is-active { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .inv-filter .n { color: var(--ink-soft); font-weight: 600; margin-left: 5px; }
  .inv-filter.is-active .n { color: var(--clay, #B9542F); }
  .inv-del { border: 1px solid var(--line); background: var(--bg); color: #B91C1C; font: inherit; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: var(--r-sm, 6px); cursor: pointer; transition: background 120ms ease, border-color 120ms ease; }
  .inv-del:hover { background: #FEF2F2; border-color: #FECACA; }
  .tbl td.inv-act { text-align: right; white-space: nowrap; }
</style></head>
<body>
<script src="/crm/crm-app.js?v=ncc41"></script>
<script>
(async () => {
  const user = await SSCrm.mount({ title: "Invoices", subtitle: "Every invoice across all jobs", wide: true });
  if (!user) return;
  const page = document.getElementById("page");

  let invoices = [];
  try {
    invoices = (await SSCrm.fetchJSON("/api/invoices")).invoices || [];
  } catch (e) {
    page.innerHTML = `<div class="tbl"><div class="empty">Couldn't load invoices: ${SSCrm.esc(e.message)}</div></div>`;
    return;
  }

  let filter = "all";
  const init = new URLSearchParams(location.search).get("filter");
  if (init === "open" || init === "paid") filter = init;

  const isOpen = (i) => i.status === "open" || i.status === "draft" || i.status === "processing";
  const isPaid = (i) => i.status === "paid";
  const TYPE_LABEL = { deposit: "Deposit", balance: "Balance", full: "Full", custom: "Custom" };

  function statusPill(s) {
    if (s === "paid")  return `<span class="pill" data-s="completed">Paid</span>`;
    if (s === "processing") return `<span class="pill" style="background:#FEF3C7;color:#92400E;border:1px solid #FDE68A">⏳ Processing</span>`;
    if (s === "void")  return `<span class="pill" data-s="lost">Void</span>`;
    if (s === "draft") return `<span class="pill" data-s="new">Draft</span>`;
    return `<span class="pill" data-s="sent">Open</span>`; // open
  }
  function rowsFor(f) {
    return invoices.filter((i) => f === "all" ? true : f === "open" ? isOpen(i) : isPaid(i));
  }

  function render() {
    const counts = { all: invoices.length, open: invoices.filter(isOpen).length, paid: invoices.filter(isPaid).length };
    const outstanding = invoices.filter(isOpen).reduce((s, i) => s + (i.amount_cents || 0), 0);
    const collected   = invoices.filter(isPaid).reduce((s, i) => s + (i.amount_cents || 0), 0);
    const rows = rowsFor(filter);
    const table = !rows.length
      ? `<div class="tbl"><div class="empty">No ${filter === "all" ? "" : filter + " "}invoices.</div></div>`
      : `<div class="tbl"><table>
          <thead><tr><th>#</th><th>Customer / Job</th><th>Type</th><th>Status</th><th class="num">Amount</th><th>Created</th><th>Paid</th><th></th></tr></thead>
          <tbody>${rows.map((i) => `<tr class="clickable" data-href="/crm/invoice.html?id=${i.id}">
            <td><strong>${SSCrm.esc(i.number)}</strong></td>
            <td>${SSCrm.esc(i.contact_name || "—")}<div class="muted" style="font-size:12px">${SSCrm.esc(i.project_name || "")}</div></td>
            <td class="muted">${SSCrm.esc(TYPE_LABEL[i.type] || i.type || "—")}</td>
            <td>${statusPill(i.status)}${(i.status !== "paid" && i.status !== "void" && (i.amount_paid_cents || 0) > 0) ? ` <span class="pill" data-s="proposal" title="${SSCrm.fmtMoney(i.amount_paid_cents)} paid">Partial</span>` : ""}</td>
            <td class="money">${SSCrm.fmtMoney(i.amount_cents)}</td>
            <td class="muted">${SSCrm.fmtDate(i.created_at)}</td>
            <td class="muted">${i.paid_at ? SSCrm.fmtDate(i.paid_at) : "—"}</td>
            <td class="inv-act"><button class="inv-del" data-id="${i.id}" data-num="${SSCrm.esc(i.number)}" data-status="${i.status}">Delete</button></td>
          </tr>`).join("")}</tbody></table></div>`;

    page.innerHTML = `
      <div class="inv-stats">
        <div class="inv-stat"><div class="inv-stat__label">All invoices</div><div class="inv-stat__value">${counts.all}</div></div>
        <div class="inv-stat inv-stat--open"><div class="inv-stat__label">Outstanding · ${counts.open}</div><div class="inv-stat__value">${SSCrm.fmtMoney(outstanding)}</div></div>
        <div class="inv-stat inv-stat--paid"><div class="inv-stat__label">Collected · ${counts.paid}</div><div class="inv-stat__value">${SSCrm.fmtMoney(collected)}</div></div>
      </div>
      <div class="inv-filters" role="tablist">
        <button class="inv-filter ${filter === "all" ? "is-active" : ""}" data-f="all">All <span class="n">${counts.all}</span></button>
        <button class="inv-filter ${filter === "open" ? "is-active" : ""}" data-f="open">Open <span class="n">${counts.open}</span></button>
        <button class="inv-filter ${filter === "paid" ? "is-active" : ""}" data-f="paid">Paid <span class="n">${counts.paid}</span></button>
      </div>
      <div id="inv-table">${table}</div>`;

    // Filter tabs
    page.querySelectorAll(".inv-filter").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.f; render(); }));
    // Row click → detail (ignore clicks on the Delete button)
    page.querySelectorAll("tr.clickable").forEach((tr) => tr.addEventListener("click", (e) => {
      if (e.target.closest(".inv-del")) return;
      location.href = tr.dataset.href;
    }));
    // Delete buttons
    page.querySelectorAll(".inv-del").forEach((btn) => btn.addEventListener("click", (e) => { e.stopPropagation(); delInvoice(btn); }));
  }

  async function delInvoice(btn) {
    const id = parseInt(btn.dataset.id, 10);
    const num = btn.dataset.num;
    const paid = btn.dataset.status === "paid";
    const msg = paid
      ? `Delete invoice ${num}? It is marked PAID — deleting it removes the payment record and adjusts the job's billing totals. This cannot be undone.`
      : `Delete invoice ${num}? This cannot be undone.`;
    if (!(await SSCrm.confirmDialog(msg))) return;
    btn.disabled = true; btn.textContent = "Deleting…";
    try {
      await SSCrm.fetchJSON("/api/invoices/" + id, { method: "DELETE" });
      invoices = invoices.filter((i) => i.id !== id);
      SSCrm.toast("Invoice deleted", "success");
      render();
    } catch (e) {
      SSCrm.toast(e.message || "Couldn't delete", "error");
      btn.disabled = false; btn.textContent = "Delete";
    }
  }

  render();
})();
</script></body></html>
