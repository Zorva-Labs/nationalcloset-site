<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proposal · National Closet Company CRM</title><meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/crm/crm-app.css?v=ncc18" />
</head>
<body>
<script src="/crm/crm-app.js?v=ncc18"></script>
<script>
const id = parseInt(new URLSearchParams(location.search).get("id"), 10);
if (!id) location.href = "/crm/proposals.html";
let state;
const CONTRACT_LABEL = { custom_order: "Walls as-is contract", wallprep: "Wall repair & paint contract", install_only: "Install-only (BYO) contract", repair: "Repair / service contract" };

// Switch the proposal type — rebuilds the options (and their contracts).
async function retype(kind) {
  if (!confirm("Change the proposal type? This rebuilds the options below and clears any line items you've added.")) {
    render(); return; // revert the dropdown
  }
  try {
    await SSCrm.fetchJSON("/api/proposals/" + id + "/retype", { method: "POST", body: JSON.stringify({ proposal_kind: kind }) });
    state = await SSCrm.fetchJSON("/api/proposals/" + id);
    render();
    SSCrm.toast("Proposal type updated", "success");
  } catch (e) { SSCrm.toast(e.message, "error"); render(); }
}

(async () => {
  const user = await SSCrm.mount({ title: "Proposal", actions: `<a class="btn ghost" href="/crm/proposals.html">← Proposals</a>` });
  if (!user) return;
  state = await SSCrm.fetchJSON("/api/proposals/" + id);
  render();
})();

function render() {
  const { proposal: p, tiers, comments } = state;
  // Derive the proposal "kind" from its options' contract types.
  const cts = (tiers || []).map((t) => t.contract_type);
  const currentKind = cts.includes("install_only") ? "install_only" : cts.includes("repair") ? "repair" : "custom";
  document.getElementById("page-title").textContent = `${p.number} · ${p.project_name}`;
  const canSend = ["draft"].includes(p.status);
  const isAccepted = p.status === "accepted";
  const customerUrl = `${location.origin}/proposal/?t=${p.view_token}`;

  document.getElementById("page").innerHTML = `
    ${isAccepted ? `
      <div class="banner">
        <div class="banner__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="banner__body">
          <strong>Customer accepted the ${SSCrm.esc(p.selected_tier)} tier.</strong>
          <span>Next: convert to a contract and send for signature to book the job.</span>
        </div>
      </div>` : ""}

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div style="display:flex;gap:10px;align-items:center">
        ${SSCrm.pill(p.status)}
        ${p.selected_tier ? `<span class="pill" data-s="accepted">Customer picked: ${SSCrm.esc(p.selected_tier)}</span>` : ""}
        <span class="muted" style="font-size:13px"><a href="/crm/contact.html?id=${p.contact_id}">${SSCrm.esc(p.contact_name)}</a></span>
      </div>
      <div style="display:flex;gap:8px">
        ${isAccepted ? `<button class="btn success" onclick="convertToContract()">Convert to Contract →</button>` : ""}
        ${canSend ? `<button class="btn primary" onclick="sendProposal()">Send to customer</button>` : ""}
        ${(p.status !== "draft" && p.status !== "accepted") ? `<button class="btn primary" onclick="resendProposal()">↻ Resend to customer</button>` : ""}
        ${p.status !== "draft" ? `<button class="btn secondary" onclick="editProposal()">✎ Edit proposal</button>` : ""}
        ${p.status !== "draft" ? `<a class="btn secondary" href="${customerUrl}" target="_blank">Customer link ↗</a>` : ""}
        <button class="btn danger" onclick="del()">Delete</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Proposal type &amp; intro</h2></div>
      <div class="form">
        <label><span>Proposal type — sets the options below and the contract each one attaches</span>
          <select id="proposal-kind" onchange="retype(this.value)" ${p.status !== "draft" ? "disabled" : ""}>
            <option value="custom"       ${currentKind === "custom" ? "selected" : ""}>Custom closet — 2 options: walls as-is + wall repair &amp; paint</option>
            <option value="install_only" ${currentKind === "install_only" ? "selected" : ""}>BYO install — customer-supplied closets (1 option)</option>
            <option value="repair"       ${currentKind === "repair" ? "selected" : ""}>Repair / service (1 option)</option>
          </select>
        </label>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:-2px">
          <p style="font-size:11px;color:var(--ink-muted);margin:0">Each option below auto-attaches its matching contract when the customer accepts. ${p.status !== "draft" ? "(Locked — proposal already sent.)" : ""}</p>
          ${p.status === "draft" ? `<button class="btn ghost sm" type="button" onclick="retype(document.getElementById('proposal-kind').value)">↻ Rebuild options</button>` : ""}
        </div>
        <label><span>This text appears at the top of the proposal page</span>
          <textarea id="intro" rows="3">${SSCrm.esc(p.intro || "")}</textarea>
        </label>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head"><h2>Job drawings (PDF)</h2></div>
      <p class="muted" style="font-size:12px;margin:0 0 12px">Attach drawings of the job. On the proposal, the customer must initial to confirm the drawings are of the project they want. These follow the client into the job folder.</p>
      <div id="drawings-list">${renderDrawings(state.attachments || [])}</div>
      <label class="btn secondary sm" style="margin-top:10px;display:inline-block;cursor:pointer">
        + Add PDF<input type="file" accept="application/pdf,.pdf" style="display:none" onchange="uploadDrawing(this)"/>
      </label>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head"><h2>Job notes</h2></div>
      <p class="muted" style="font-size:12px;margin:0 0 10px">Extra details promised to the client — shown on the proposal and on the job screen.</p>
      <textarea id="job-notes" rows="4" placeholder="e.g. Includes soft-close hinges on all drawers, crown molding, and paint touch-up after install." style="width:100%;border:1px solid var(--line-soft);padding:8px 10px;border-radius:var(--r-sm);font:inherit;font-size:13px;box-sizing:border-box">${SSCrm.esc(p.job_notes || "")}</textarea>
      <div class="form-actions" style="margin-top:8px"><button class="btn secondary sm" onclick="saveAll()">💾 Save</button></div>
    </div>

    <!-- Tiers stacked vertically so each card has the full page width
         for line items, dimensions, color, and pricing columns -->
    <div style="display:flex;flex-direction:column;gap:16px;margin-top:16px">
      ${tiers.map(renderTier).join("")}
    </div>

    <div class="form-actions" style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn secondary" onclick="saveAll()">💾 Save proposal</button>
      ${canSend ? `<button class="btn primary" onclick="saveThenSend()">📧 Save &amp; Send to customer →</button>` : ""}
      ${isAccepted ? `<button class="btn success" onclick="convertToContract()">Convert to Contract →</button>` : ""}
      ${p.status !== "draft" && p.status !== "accepted" ? `<span class="muted" style="font-size:13px">Status: <strong>${SSCrm.esc(p.status)}</strong> — re-open the proposal in Drafts to send again.</span>` : ""}
    </div>

    ${comments.length ? `
      <div class="card" style="margin-top:20px">
        <div class="card-head"><h2>Customer comments</h2></div>
        <ul class="activity">${comments.map((c) => `
          <li><span class="activity__icon">💬</span>
          <div class="activity__body">${c.tier ? `<span class="pill" data-s="${SSCrm.esc(c.tier)}">${SSCrm.esc(c.tier)}</span> ` : ""}<strong>${SSCrm.esc(c.author_name || c.author_kind)}</strong> ${SSCrm.esc(c.body)}
            <div class="activity__time">${SSCrm.fmtDateTime(c.created_at)}</div>
          </div></li>`).join("")}
        </ul>
      </div>` : ""}
  `;
  // After the DOM is in place, size each tier-title textarea to its content
  requestAnimationFrame(autoGrowAllTitles);
}

// Auto-grow the tier-title textarea so long titles ("The Smart-Home Package") wrap
// to a second line instead of getting clipped at the right edge of the card.
function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = (el.scrollHeight) + "px";
}
function autoGrowAllTitles() {
  document.querySelectorAll(".t-title").forEach(autoGrow);
}

function renderTier(t) {
  return `<div class="card" data-tier-id="${t.id}" data-tier="${t.tier}" style="${state.proposal.selected_tier === t.tier ? "border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)" : ""};min-width:0;overflow:hidden">
    <div class="card-head" style="display:block">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
        <span style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:var(--ink-soft)">${SSCrm.esc(t.tier)}</span>
        ${t.contract_type ? `<span class="pill" style="font-size:10px;background:var(--accent-soft);color:var(--accent-ink);border-color:transparent">→ ${SSCrm.esc(CONTRACT_LABEL[t.contract_type] || t.contract_type)}</span>` : ""}
      </div>
      <textarea class="t-title" data-f="title" rows="1" placeholder="Tier title" style="font-size:15px;font-weight:600;border:0;padding:4px 0;width:100%;box-sizing:border-box;resize:none;font-family:inherit;line-height:1.25;color:var(--ink);overflow:hidden;background:transparent" oninput="autoGrow(this)">${SSCrm.esc(t.title || "")}</textarea>
    </div>
    <textarea class="t-desc" data-f="description" rows="2" placeholder="Brief description (optional)" style="width:100%;border:1px solid var(--line-soft);padding:6px;border-radius:var(--r-sm);font-size:12px;margin-bottom:10px">${SSCrm.esc(t.description || "")}</textarea>
    <table class="lines"><thead><tr>
      <th>Item</th>
      <th style="width:110px">Room</th>
      <th class="num" style="width:54px">Qty</th>
      <th class="num" style="width:110px">Unit price</th>
      <th class="num" style="width:110px">Total</th><th style="width:32px"></th>
    </tr></thead>
    <tbody class="tier-lines">${(t.lines || []).map(tierLineRow).join("") || tierLineRow({})}</tbody></table>
    <div class="add" style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="addTierLine(this)">+ Add line</button><button onclick="addDiscountLine(this)" title="Add a discount — comes out of profit; the cost basis stays on the pre-discount price">− Add discount</button>${t.tier !== "good" ? `<button onclick="copyFromOption1(this)" title="Copy Option 1's line items here and add a Wall Finishing line">⧉ Copy Option 1 + Wall Finishing</button>` : ""}</div>
    <div style="border-top:1px solid var(--line-soft);margin-top:10px;padding-top:10px">
      <div style="display:flex;justify-content:space-between;font-weight:700"><span>Total <span style="font-weight:400;color:var(--ink-soft);font-size:12px">· incl. shipping, tax &amp; install</span></span><span class="tier-total money">${SSCrm.fmtMoney(t.total_cents || 0)}</span></div>
    </div>
  </div>`;
}
function tierLineRow(l) {
  // Discounts are stored as negative line items (come out of profit; the cost
  // basis stays on the pre-discount gross). Render them as a distinct row.
  if (l && (l.__discount || (l.line_total_cents != null && l.line_total_cents < 0) || (l.unit_price_cents != null && l.unit_price_cents < 0))) {
    const unit = (l && l.unit_price_cents != null) ? l.unit_price_cents : 0;
    return `<tr data-discount="1">
      <td><input data-f="description" value="${SSCrm.esc(l?.description || "Discount")}" placeholder="Discount"/><input type="hidden" data-f="product_id" value=""/></td>
      <td><input data-f="room" value="" placeholder="—" disabled style="opacity:.4"/></td>
      <td><input class="num" data-f="quantity" value="1" type="number" readonly tabindex="-1" style="opacity:.5"/></td>
      <td><input class="num" data-f="unit" value="${unit ? SSCrm.fmtMoney(unit) : ""}" placeholder="-$0.00" onchange="fmtUnitNeg(this)" onblur="fmtUnitNeg(this)" style="color:#B91C1C;font-weight:600"/></td>
      <td class="num money tier-line-money" style="color:#B91C1C">${SSCrm.fmtMoney(unit)}</td>
      <td><button class="rm" onclick="this.closest('tr').remove();recalcTierEl(this.closest('.card'))" title="Remove">×</button></td>
    </tr>`;
  }
  const productId = l?.product_id || "";
  return `<tr>
    <td>
      <input data-f="description" value="${SSCrm.esc(l?.description || "")}" placeholder="Product / item"/>
      <input type="hidden" data-f="product_id" value="${productId}"/>
    </td>
    <td><input data-f="room" value="${SSCrm.esc(l?.room || "")}" placeholder="Room"/></td>
    <td><input class="num" data-f="quantity" value="${l?.quantity || 1}" type="number" step="1" min="1" onchange="recalcTier(this)"/></td>
    <td><input class="num" data-f="unit" value="${l?.unit_price_cents != null ? SSCrm.fmtMoney(l.unit_price_cents) : ""}" placeholder="$0.00" onchange="fmtUnit(this)" onblur="fmtUnit(this)"/></td>
    <td class="num money tier-line-money">${SSCrm.fmtMoney((l?.quantity || 1) * (l?.unit_price_cents || 0))}</td>
    <td><button class="rm" onclick="this.closest('tr').remove();recalcTierEl(this.closest('.card'))" title="Remove">×</button></td>
  </tr>`;
}
function addTierLine(btn) {
  const card = btn.closest(".card");
  card.querySelector(".tier-lines").insertAdjacentHTML("beforeend", tierLineRow({}));
}
function addDiscountLine(btn) {
  const card = btn.closest(".card");
  card.querySelector(".tier-lines").insertAdjacentHTML("beforeend", tierLineRow({ __discount: true, description: "Discount" }));
}

function recalcTier(input) {
  const tr = input.closest("tr");
  const qty = Number(tr.querySelector("[data-f=quantity]").value || 0);
  const unit = SSCrm.parseMoney(tr.querySelector("[data-f=unit]").value);
  tr.querySelector(".tier-line-money").textContent = SSCrm.fmtMoney(qty * unit);
  recalcTierEl(input.closest(".card"));
}
// Always show the unit price as $X.XX. Reformats whatever was typed ("500",
// "500.5", "$500") into "$500.00" on change/blur, then recalculates the line.
function fmtUnit(input) {
  const v = (input.value || "").trim();
  input.value = v ? SSCrm.fmtMoney(SSCrm.parseMoney(v)) : "";
  recalcTier(input);
}
// Discount unit field — always negative (a discount never adds to the price).
function fmtUnitNeg(input) {
  const v = (input.value || "").trim();
  const cents = -Math.abs(SSCrm.parseMoney(v));
  input.value = cents ? SSCrm.fmtMoney(cents) : "";
  recalcTier(input);
}
const QUOTE_TAX_RATE = 0; // all-inclusive pricing — no separate tax line (matches recomputeTierTotals)
function recalcTierEl(card) {
  let sub = 0;
  card.querySelectorAll(".tier-lines tr").forEach((tr) => {
    const qty = Number(tr.querySelector("[data-f=quantity]").value || 0);
    const unit = SSCrm.parseMoney(tr.querySelector("[data-f=unit]").value);
    sub += qty * unit;
  });
  const tax = sub > 0 ? Math.round(sub * QUOTE_TAX_RATE) : 0;
  const subEl = card.querySelector(".tier-subtotal"); if (subEl) subEl.textContent = SSCrm.fmtMoney(sub);
  const taxEl = card.querySelector(".tier-tax"); if (taxEl) taxEl.textContent = SSCrm.fmtMoney(tax);
  card.querySelector(".tier-total").textContent = SSCrm.fmtMoney(sub + tax);
}

// Copy Option 1's (the "good" tier) line items into this option, then append a
// Wall Finishing line — Option 2 is typically "everything in Option 1 + wall
// repair & fresh paint". Prices stay editable; the Wall Finishing line is added
// blank for the admin to price.
function copyFromOption1(btn) {
  const card = btn.closest(".card");
  const src = document.querySelector('.card[data-tier="good"]');
  if (!src) { SSCrm.toast("No Option 1 to copy from.", "error"); return; }
  const rows = [...src.querySelectorAll(".tier-lines tr")].map((tr) => ({
    description: tr.querySelector("[data-f=description]").value.trim(),
    product_id: (tr.querySelector("[data-f=product_id]")?.value || "") ? parseInt(tr.querySelector("[data-f=product_id]").value, 10) : null,
    room: tr.querySelector("[data-f=room]")?.value || "",
    quantity: Number(tr.querySelector("[data-f=quantity]").value || 1),
    unit_price_cents: SSCrm.parseMoney(tr.querySelector("[data-f=unit]").value),
  })).filter((r) => r.description);
  const hasExisting = [...card.querySelectorAll(".tier-lines tr")].some((tr) => tr.querySelector("[data-f=description]").value.trim());
  if (hasExisting && !confirm("Replace this option's line items with a copy of Option 1 (plus a Wall Finishing line)?")) return;
  if (!rows.length && !confirm("Option 1 has no line items yet. Add just the Wall Finishing line?")) return;
  const tbody = card.querySelector(".tier-lines");
  tbody.innerHTML = rows.map(tierLineRow).join("");
  tbody.insertAdjacentHTML("beforeend", tierLineRow({ description: "Wall Finishing — wall repair & fresh paint", room: "Whole project", quantity: 1 }));
  recalcTierEl(card);
  SSCrm.toast("Copied Option 1 and added a Wall Finishing line.", "success");
}

async function saveAll() {
  const tiers = [...document.querySelectorAll("[data-tier-id]")].map((card) => ({
    id: parseInt(card.dataset.tierId, 10),
    title: card.querySelector(".t-title").value.trim(),
    description: card.querySelector(".t-desc").value.trim(),
    lines: [...card.querySelectorAll(".tier-lines tr")].map((tr) => {
      const productIdRaw = tr.querySelector("[data-f=product_id]")?.value || "";
      return {
        description: tr.querySelector("[data-f=description]").value.trim(),
        room: tr.querySelector("[data-f=room]")?.value.trim() || null,
        quantity: Math.max(1, Math.round(Number(tr.querySelector("[data-f=quantity]").value || 1))),
        unit_price_cents: SSCrm.parseMoney(tr.querySelector("[data-f=unit]").value),
        product_id: productIdRaw ? parseInt(productIdRaw, 10) : null,
      };
    }).filter((l) => l.description),
  }));
  try {
    const jn = document.getElementById("job-notes");
    await SSCrm.fetchJSON("/api/proposals/" + id, { method: "PATCH", body: JSON.stringify({
      intro: document.getElementById("intro").value.trim(),
      job_notes: jn ? jn.value.trim() : "",
      tiers,
    })});
    SSCrm.toast("Saved", "success");
    state = await SSCrm.fetchJSON("/api/proposals/" + id);
    render();
  } catch (e) { SSCrm.toast(e.message, "error"); }
}
function fmtSize(b) { b = b || 0; return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }
function renderDrawings(list) {
  if (!list.length) return `<p class="muted" style="font-size:13px;margin:0">No drawings attached yet.</p>`;
  return list.map((a) => `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft)">
    <span style="font-size:18px">📄</span>
    <a href="/api/attachments/${a.id}" target="_blank" rel="noopener" style="font-weight:600;flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${SSCrm.esc(a.filename)}</a>
    <span class="muted" style="font-size:12px;white-space:nowrap">${fmtSize(a.size_bytes)}</span>
    <a class="btn ghost sm" href="/api/attachments/${a.id}?dl=1">Download</a>
    <button class="btn ghost sm" onclick="deleteDrawing(${a.id})" title="Remove">×</button>
  </div>`).join("");
}
async function uploadDrawing(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { SSCrm.toast("File too large (max 20 MB)", "error"); input.value = ""; return; }
  const fd = new FormData(); fd.append("file", file);
  SSCrm.toast("Uploading…", "info");
  try {
    const res = await fetch(`/api/proposals/${id}/attachments`, { method: "POST", body: fd, credentials: "same-origin" });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Upload failed");
    SSCrm.toast("Drawing attached", "success");
    state = await SSCrm.fetchJSON("/api/proposals/" + id);
    render();
  } catch (e) { SSCrm.toast(e.message || "Upload failed", "error"); }
  input.value = "";
}
async function deleteDrawing(aid) {
  if (!(await SSCrm.confirmDialog("Remove this drawing?"))) return;
  try {
    await SSCrm.fetchJSON(`/api/attachments/${aid}`, { method: "DELETE" });
    SSCrm.toast("Removed", "success");
    state = await SSCrm.fetchJSON("/api/proposals/" + id);
    render();
  } catch (e) { SSCrm.toast(e.message, "error"); }
}
async function sendProposal() {
  if (!(await SSCrm.confirmDialog("Send this proposal to the customer?"))) return;
  try { await SSCrm.fetchJSON(`/api/proposals/${id}/send`, { method: "POST" }); SSCrm.toast("Proposal sent", "success"); state = await SSCrm.fetchJSON("/api/proposals/" + id); render(); }
  catch (e) { SSCrm.toast(e.message, "error"); }
}
async function resendProposal() {
  if (!(await SSCrm.confirmDialog(`Resend this proposal email to ${SSCrm.esc(state.proposal.contact_name || "the customer")}?`))) return;
  try { await SSCrm.fetchJSON(`/api/proposals/${id}/send`, { method: "POST" }); SSCrm.toast("Proposal resent", "success"); state = await SSCrm.fetchJSON("/api/proposals/" + id); render(); }
  catch (e) { SSCrm.toast(e.message, "error"); }
}
async function editProposal() {
  if (!(await SSCrm.confirmDialog("Re-open this proposal for editing? It moves back to draft so you can change the type, options, and line items, then resend."))) return;
  try { await SSCrm.fetchJSON("/api/proposals/" + id, { method: "PATCH", body: JSON.stringify({ status: "draft" }) }); SSCrm.toast("Re-opened for editing", "success"); state = await SSCrm.fetchJSON("/api/proposals/" + id); render(); }
  catch (e) { SSCrm.toast(e.message, "error"); }
}
// Convenience for the bottom-of-page action: persist pending edits to all
// tiers FIRST so the customer gets the freshest version, then email it.
// Skips the confirm dialog (the button label "Save & Send" makes the intent
// explicit) so it's a single confident click after a long edit session.
async function saveThenSend() {
  try {
    await saveAll();
    await SSCrm.fetchJSON(`/api/proposals/${id}/send`, { method: "POST" });
    SSCrm.toast("Saved + sent to customer", "success");
    state = await SSCrm.fetchJSON("/api/proposals/" + id);
    render();
  } catch (e) { SSCrm.toast(e.message, "error"); }
}
async function convertToContract() {
  if (!(await SSCrm.confirmDialog(`Create a contract from the ${state.proposal.selected_tier || "selected"} tier?`))) return;
  try {
    const { id: nid } = await SSCrm.fetchJSON(`/api/proposals/${id}/convert`, { method: "POST" });
    SSCrm.toast("Contract drafted from proposal", "success");
    location.href = "/crm/contract.html?id=" + nid;
  } catch (e) { SSCrm.toast(e.message, "error"); }
}
async function del() {
  if (!(await SSCrm.confirmDialog("Delete this proposal?"))) return;
